  <text x="10" y="16" font-family="Arial, sans-serif" font-size="10">WORKSHOP OS</text>
  <text x="470" y="16" text-anchor="end" font-family="Arial, sans-serif" font-size="9">2:49</text>
  <g font-family="Arial, sans-serif" fill="black" stroke="black">
    <g transform="translate(8 32)"><rect width="149" height="112" fill="white" stroke-width="1.5"/><circle cx="16" cy="18" r="6" fill="white" stroke-width="1"/><text x="28" y="21" stroke="none" font-size="8.5">NOW</text><text x="10" y="66" stroke="none" font-size="14">2:49 PM</text><text x="10" y="94" stroke="none" font-size="8">Sat · Sep 26</text></g>
    <g transform="translate(165 32)"><rect width="149" height="112" fill="white" stroke-width="1.5"/><circle cx="16" cy="18" r="6" fill="white" stroke-width="1"/><text x="28" y="21" stroke="none" font-size="8.5">SMART HOME</text><text x="10" y="66" stroke="none" font-size="14">3 devices</text><text x="10" y="94" stroke="none" font-size="8">All normal</text></g>
    <g transform="translate(322 32)"><rect width="149" height="112" fill="white" stroke-width="1.5"/><circle cx="16" cy="18" r="6" fill="white" stroke-width="1"/><text x="28" y="21" stroke="none" font-size="8.5">WORKSHOP</text><text x="10" y="66" stroke="none" font-size="14">Ready</text><text x="10" y="94" stroke="none" font-size="8">2 timers</text></g>
    <g transform="translate(8 152)"><rect width="149" height="112" fill="white" stroke-width="1.5"/><circle cx="16" cy="18" r="6" fill="white" stroke-width="1"/><text x="28" y="21" stroke="none" font-size="8.5">PRINTER</text><text x="10" y="66" stroke="none" font-size="14">Idle</text><text x="10" y="94" stroke="none" font-size="8">Ready</text></g>
    <g transform="translate(165 152)"><rect width="149" height="112" fill="white" stroke-width="1.5"/><circle cx="16" cy="18" r="6" fill="white" stroke-width="1"/><text x="28" y="21" stroke="none" font-size="8.5">APPS</text><text x="10" y="66" stroke="none" font-size="14">Sky Radar</text><text x="10" y="94" stroke="none" font-size="8">6 built-ins</text></g>
    <g transform="translate(322 152)"><rect width="149" height="112" fill="white" stroke-width="1.5"/><circle cx="16" cy="18" r="6" fill="white" stroke-width="1"/><text x="28" y="21" stroke="none" font-size="8.5">SYSTEM</text><text x="10" y="66" stroke="none" font-size="14">Healthy</text><text x="10" y="94" stroke="none" font-size="8">Wi-Fi connected</text></g>
