  <rect x="0" y="272" width="480" height="48" fill="white" stroke="black" stroke-width="1.5"/>
  <line x1="120" y1="272" x2="120" y2="320" stroke="black"/><line x1="240" y1="272" x2="240" y2="320" stroke="black"/><line x1="360" y1="272" x2="360" y2="320" stroke="black"/>
