<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">480 by 320 Home Hub geometry proof</title>
  <desc id="desc">Wireframe showing six home tiles in a three-column by two-row grid with persistent Home, Apps, Printer, and System navigation.</desc>
