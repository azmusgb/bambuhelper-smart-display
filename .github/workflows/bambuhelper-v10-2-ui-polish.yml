name: BambuHelper ws_lcd_350 Smart Home v10.2 Workshop UI Polish RC1

on:
  push:
    branches: [evolve/v10-2-ui-polish]
    paths:
      - 'apply_smart_home_ui_v10_2.py'
      - '.github/workflows/bambuhelper-v10-2-ui-polish.yml'
      - 'apply_smart_home_hardware_v10_1.py'
      - 'scripts/apply_smart_home_stack.sh'
  pull_request:
    branches: [main, evolve/v10-1-hardware-enablement]
    paths:
      - 'apply_smart_home_ui_v10_2.py'
      - '.github/workflows/bambuhelper-v10-2-ui-polish.yml'
      - 'apply_smart_home_hardware_v10_1.py'
      - 'scripts/apply_smart_home_stack.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-home-v10-2-ui-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout evolution repository
        uses: actions/checkout@v4

      - name: Checkout pinned BambuHelper baseline
        uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate patch tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile apply_smart_home_hardware_v10_1.py apply_smart_home_ui_v10_2.py
          bash -n scripts/apply_smart_home_stack.sh

      - name: Apply Smart Home stack through v10.1
        shell: bash
        run: bash scripts/apply_smart_home_stack.sh upstream apply_smart_home_hardware_v10_1.py

      - name: Apply v10.2 UI polish
        run: python apply_smart_home_ui_v10_2.py --repo upstream --apply

      - name: Validate inherited device contracts
        run: python scripts/validate_device_contracts.py

      - name: Verify v10.2 UI and inherited hardware contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          build=Path('upstream/include/smart_home_build.h').read_text()
          hub=Path('upstream/src/smart_hub.cpp').read_text()
          board=Path('upstream/boards/ws_lcd_350.ini').read_text()
          backend=Path('upstream/src/buzzer_backend_es8311.cpp').read_text()
          web=Path('upstream/src/web_server.cpp').read_text()
          focal=Path('upstream/src/button_touch_focaltech.cpp').read_text()

          def need(body, needle, label):
              if needle not in body:
                  raise SystemExit(f'MISSING {label}: {needle}')
          def forbid(body, needle, label):
              if needle in body:
                  raise SystemExit(f'FORBIDDEN {label}: {needle}')

          need(build, '#define SMART_HOME_VERSION "v10.2"', 'v10.2 version')
          need(build, 'Smart Home v10.2 Workshop UI Polish RC1', 'v10.2 label')

          # More screen: no landscape truncation, 2x2 appliance launcher.
          need(hub, 'const int16_t m=8,g=8,cw=(W-2*m-g)/2,ch=74;', '2x2 More geometry')
          need(hub, 'const char* titles[4]={"CUSTOM","SYSTEM","EDIT","CLASSIC"};', 'short launcher labels')
          need(hub, 'Legacy printer surface', 'classic subtitle')
          need(hub, 'uiPanelFill(8,202,W-16,62);', 'compact device summary')
          need(hub, 'drawHeader("MORE","TOOLS",3)', 'compressed More header')
          forbid(hub, 'drawHeader("MORE","TOOLS & SETTINGS",3)', 'legacy verbose More header')
          forbid(hub, 'EDIT WIDGETS","CLASSIC PRINTER', 'truncation-prone launcher labels')
          forbid(hub, 'GET STARTED', 'orphan onboarding label')

          # Stronger OS-style nav and Workshop operational detail.
          need(hub, 'tft.fillRoundRect(8, y + 3, tft.width() - 16, hubNavH() - 6, 11, UI_PANEL_2);', 'dock navigation')
          need(hub, 'AMS / FILAMENT', 'AMS snapshot title')
          need(hub, 'A%d LOADED', 'loaded tray indicator')
          need(hub, '"OPERATIONAL"', 'Workshop operational metrics')
          for n in ['"STATE"','"LAYER"','"ATTENTION"']:
              need(hub,n,'operational metric labels')

          # v10.1 hardware/audio must remain enabled by this UI-only layer.
          for n in ['BOARD_HAS_ES8311_AUDIO=1','BOARD_HAS_MICROPHONE=1','AUDIO_I2S_DIN=14','AUDIO_PA_CTRL=-1']:
              need(board,n,'WS350 audio hardware')
          for n in ['I2S_MODE_RX','buzzerBackendMicLevel','AUDIO_PA_CTRL >= 0']:
              need(backend,n,'ES8311/mic backend')
          need(hub,'INPUT & AUDIO','physical audio system UI')
          need(web,'handleAudioMicTest','browser microphone diagnostic')

          # Preserve the known safety contracts.
          need(focal,'ft6336RecoverBus','FT6336 recovery')
          need(web,'recoverySha256HexArrayBuffer','Safari-safe recovery')
          need(web,'doc["hasAccessCode"]','secret-safe status')
          print('v10.2 UI polish contracts: PASS')
          PY

      - name: Validate browser JavaScript
        run: node --check upstream/web/app.js

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build WS350 v10.2
        working-directory: upstream
        run: pio run -e ws_lcd_350

      - name: Regression build shared 320x480 target
        working-directory: upstream
        run: pio run -e jc3248w535

      - name: Merge Full image
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full

      - name: Package v10.2 Workshop UI Polish RC1 artifacts
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' | sort | tail -1)"
          APP='upstream/.pio/build/ws_lcd_350/firmware.bin'
          mkdir -p v10-2-artifacts/source-snapshot
          cp "$FULL" v10-2-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v10.2-Workshop-UI-Polish-RC1-Full.bin
          cp "$APP" v10-2-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v10.2-Workshop-UI-Polish-RC1-OTA.bin
          cp "$APP" v10-2-artifacts/WaveshareHome-firmware.bin
          for f in \
            boards/ws_lcd_350.ini \
            src/buzzer.cpp src/buzzer_backend.h src/buzzer_backend_es8311.cpp \
            src/smart_hub.cpp src/web_server.cpp src/web_template.cpp \
            include/web_pages.h include/smart_home_build.h web/app.js web/app.css \
            src/button_touch_focaltech.cpp src/settings.cpp; do
            mkdir -p "v10-2-artifacts/source-snapshot/$(dirname "$f")"
            cp "upstream/$f" "v10-2-artifacts/source-snapshot/$f"
          done
          {
            echo 'BambuHelper ws_lcd_350 Smart Home v10.2 Workshop UI Polish RC1 validation'
            echo 'more_launcher_2x2=PASS'
            echo 'launcher_title_truncation=REMOVED'
            echo 'header_density=REDUCED'
            echo 'touch_targets=ENLARGED'
            echo 'device_summary=COMPACT'
            echo 'bottom_navigation=OS_DOCK'
            echo 'workshop_operational_metrics=ENABLED'
            echo 'ams_loaded_filament_snapshot=ENABLED'
            echo 'get_started_label=ABSENT'
            echo 'es8311_speaker=PRESERVED'
            echo 'microphone_i2s_rx=PRESERVED'
            echo 'printer_configuration_retention=PRESERVED'
            echo 'safari_recovery_foundation=PRESERVED'
            echo 'ft6336_reliability=PRESERVED'
            echo 'ws350_build=PASS'
            echo 'jc3248w535_regression=PASS'
            echo 'physical_ui_acceptance=REQUIRED'
            sha256sum v10-2-artifacts/*.bin
          } | tee v10-2-artifacts/validation-report-v10-2-workshop-ui-polish-rc1.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bambuhelper-ws_lcd_350-smart-home-v10-2-workshop-ui-polish-rc1
          retention-days: 14
          if-no-files-found: error
          path: v10-2-artifacts/
