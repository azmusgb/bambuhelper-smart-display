name: Validate Smart Display release metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate installer source and release manifest
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('release.json').read_text())
          assert r['release']=='production-rc-v6'
          assert r['board']['id']=='ws_lcd_350'
          p=r['profiles']['smart-display']
          assert p['size']==2207040
          assert p['sha256']=='82265502dac6b93356ee2ab3d7c4edcaad47bdd7584be85d24ddef348166d5ac'
          print('Release metadata contract: PASS')
          PY

      - name: Verify preserved release asset when present
        shell: bash
        run: |
          set -euo pipefail
          FILE=firmware/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-display-v6-validated.bin
          if [ -f "$FILE" ]; then
            test "$(stat -c%s "$FILE")" = '2207040'
            echo '82265502dac6b93356ee2ab3d7c4edcaad47bdd7584be85d24ddef348166d5ac  '"$FILE" | sha256sum -c -
            python3 build.py
          else
            echo 'Preserved release asset is not yet committed.'
          fi
