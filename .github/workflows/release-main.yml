name: Validate production Smart Home release

on:
  push:
    branches: [main]
    paths:
      - 'release.json'
      - 'build.py'
      - 'index.html'
      - 'app.js'
      - 'firmware/**'
      - '.github/workflows/release-main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate installer and every firmware profile
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          python3 build.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          release=json.loads(Path('release.json').read_text())
          assert release['release']=='production-rc-v7'
          assert release['sourceCommit']=='8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4'
          assert release['board']['id']=='ws_lcd_350'
          assert release['profiles']['smart-home-v7']['recommended'] is True
          assert 'smart-display-v6' in release['profiles']

          expected={
              'smart-home-v7': (2207472, 'c659d4acfd3c6642baa789d6d7b64a9b77173a2f92be90a90fa71b48d4dbbfc7'),
              'smart-display-v6': (2207040, '82265502dac6b93356ee2ab3d7c4edcaad47bdd7584be85d24ddef348166d5ac'),
          }
          for profile_id, profile in release['profiles'].items():
              assert profile_id in expected, profile_id
              expected_size, expected_sha = expected[profile_id]
              assert profile['size']==expected_size, profile_id
              assert profile['sha256']==expected_sha, profile_id
              raw=Path(profile['file']).read_bytes()
              assert len(raw)==profile['size'], profile_id
              assert hashlib.sha256(raw).hexdigest()==profile['sha256'], profile_id
              published=(Path('dist')/profile['file']).read_bytes()
              assert hashlib.sha256(published).hexdigest()==profile['sha256'], profile_id
              print(profile_id, 'PASS', profile['sha256'])
          PY

      - name: Validate v7 physical-fix evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'legacy_clock_replaced_by_smart_home=PASS' validation-report-v7.txt
          grep -Fq 'legacy_clock_upgrade_wake_to_home=PASS' validation-report-v7.txt
          grep -Fq 'idle_home_immediate_print_preemption=PASS' validation-report-v7.txt
          grep -Fq 'tap_discoverability_hints=PASS' validation-report-v7.txt
          grep -Fq 'hub_page_cycle=HOME_WORKSHOP_CUSTOM_SYSTEM_PRINTER_HOME' validation-report-v7.txt
          grep -Fq 'hms_finish_printer_priority_preserved=PASS' validation-report-v7.txt
          grep -Fq 'shared_layout_regression=jc3248w535_passed' validation-report-v7.txt
