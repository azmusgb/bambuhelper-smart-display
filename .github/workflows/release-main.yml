name: Validate Smart Display source build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild Smart Display source stack
        shell: bash
        run: |
          set -euo pipefail
          # This is a source/regression build, not a bit-for-bit release reproduction.
          # Embedded/toolchain builds can drift in bytes between runs. The deployed
          # release asset is the separately preserved, previously validated binary.
          EXPECT_RELEASE_SHA=82265502dac6b93356ee2ab3d7c4edcaad47bdd7584be85d24ddef348166d5ac \
          ALLOW_BINARY_DRIFT=1 bash scripts/reproduce-firmware.sh

      - name: Upload source-build evidence
        uses: actions/upload-artifact@v4
        with:
          name: bambuhelper-smart-display-source-build
          retention-days: 14
          if-no-files-found: error
          path: |
            firmware/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-display-v6-validated.bin
            firmware-build-report.txt
            validation-report.txt
