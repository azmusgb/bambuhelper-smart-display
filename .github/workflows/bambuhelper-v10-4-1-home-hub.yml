name: BambuHelper ws_lcd_350 Smart Home v10.4.1 Workshop Home Hub RC2

on:
  push:
    branches: [evolve/v10-4-portal-ux]
    paths:
      - 'apply_smart_home_home_v10_4_1.py'
      - '.github/workflows/bambuhelper-v10-4-1-home-hub.yml'
  pull_request:
    branches: [evolve/v10-3-browser-workshop-os]
    paths:
      - 'apply_smart_home_home_v10_4_1.py'
      - '.github/workflows/bambuhelper-v10-4-1-home-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-home-v10-4-1-home-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout evolution repository
        uses: actions/checkout@v4

      - name: Checkout pinned BambuHelper baseline
        uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate patch tooling
        run: |
          python -m py_compile apply_smart_home_hardware_v10_1.py apply_smart_home_ui_v10_2.py apply_smart_home_browser_v10_3.py apply_smart_home_screen_retention_v10_3_1.py apply_smart_home_portal_v10_4.py apply_smart_home_home_v10_4_1.py
          bash -n scripts/apply_smart_home_stack.sh

      - name: Apply Smart Home stack through v10.1
        run: bash scripts/apply_smart_home_stack.sh upstream apply_smart_home_hardware_v10_1.py

      - name: Apply v10.2 physical UI polish
        run: python apply_smart_home_ui_v10_2.py --repo upstream --apply

      - name: Apply v10.3 browser Workshop OS
        run: python apply_smart_home_browser_v10_3.py --repo upstream --apply

      - name: Apply v10.3.1 screen-retention hotfix
        run: python apply_smart_home_screen_retention_v10_3_1.py --repo upstream --apply

      - name: Apply v10.4 portal UX
        run: python apply_smart_home_portal_v10_4.py --repo upstream --apply

      - name: Apply v10.4.1 workshop-first Home
        run: python apply_smart_home_home_v10_4_1.py --repo upstream --apply

      - name: Validate inherited device contracts
        run: python scripts/validate_device_contracts.py

      - name: Verify workshop-first Home and inherited contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          pages=Path('upstream/include/web_pages.h').read_text()
          app=Path('upstream/web/app.js').read_text()
          css=Path('upstream/web/app.css').read_text()
          build=Path('upstream/include/smart_home_build.h').read_text()
          main=Path('upstream/src/main.cpp').read_text()
          hub=Path('upstream/src/smart_hub.cpp').read_text()
          board=Path('upstream/boards/ws_lcd_350.ini').read_text()
          web=Path('upstream/src/web_server.cpp').read_text()
          def need(body,n,label):
              if n not in body: raise SystemExit(f'MISSING {label}: {n}')
          def forbid(body,n,label):
              if n in body: raise SystemExit(f'FORBIDDEN {label}: {n}')
          need(build,'#define SMART_HOME_VERSION "v10.4.1"','v10.4.1 version')
          need(build,'Smart Home v10.4.1 Workshop Home Hub RC2','v10.4.1 build label')
          a=pages.index('id="sec-home"'); b=pages.index('id="sec-workshop"'); home=pages[a:b]
          for n in ['Your workshop at a glance.','data-hh-widget="workshop"','data-hh-widget="printer"','data-hh-widget="device"','data-hh-widget="network"','data-hh-widget="system"','data-hh-widget="quick"','Go where the work is']:
              need(home,n,'workshop-first Home')
          forbid(home,'LIVE PRINT','duplicate live-print Home hero')
          forbid(home,'class="cc-grid"','legacy printer-first Home grid')
          for n in ['function hhApplyStatus','function refreshCommandCenter(manual)','function ccRefreshLiveWidget(){}','Printer is one source, never the sole definition of Home health.']:
              need(app,n,'Home behavior')
          for n in ['.hh-grid','.hh-workshop{grid-column:span 7}', '.hh-printer{grid-column:span 5}', '.hh-status-grid']:
              need(css,n,'Home layout')
          # Preserve v10.4 Printer UX.
          for n in ['v104EnsureTopHealth','v104BuildSlotSwitcher','v104BuildSupportPanel','v104EnsurePrinterWorkspace']:
              need(app,n,'v10.4 portal UX')
          # Preserve screen ownership and hardware foundations.
          need(main,'Smart Home v10.3.1 screen-retention contract.','screen retention')
          need(main,'if (!smartHubShouldYieldToPrinter(printing))','screen route guard')
          need(hub,'native Smart Home Printer is the normal live-print surface','native printer surface')
          need(web,'handleAudioMicTest','microphone diagnostic')
          for n in ['BOARD_HAS_ES8311_AUDIO=1','BOARD_HAS_MICROPHONE=1','AUDIO_I2S_DIN=14','AUDIO_PA_CTRL=-1']:
              need(board,n,'WS350 audio')
          print('v10.4.1 workshop-first Home contracts: PASS')
          PY

      - name: Validate browser JavaScript
        run: node --check upstream/web/app.js

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build WS350 v10.4.1
        working-directory: upstream
        run: pio run -e ws_lcd_350

      - name: Regression build shared 320x480 target
        working-directory: upstream
        run: pio run -e jc3248w535

      - name: Merge Full image
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full

      - name: Package v10.4.1 Workshop Home Hub RC2 artifacts
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' | sort | tail -1)"
          APP='upstream/.pio/build/ws_lcd_350/firmware.bin'
          mkdir -p v10-4-1-artifacts/source-snapshot
          cp "$FULL" v10-4-1-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v10.4.1-Workshop-Home-Hub-RC2-Full.bin
          cp "$APP" v10-4-1-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v10.4.1-Workshop-Home-Hub-RC2-OTA.bin
          cp "$APP" v10-4-1-artifacts/WaveshareHome-firmware.bin
          for f in src/main.cpp src/smart_hub.cpp src/web_server.cpp src/web_template.cpp include/web_pages.h include/smart_home_build.h web/app.js web/app.css boards/ws_lcd_350.ini; do
            mkdir -p "v10-4-1-artifacts/source-snapshot/$(dirname "$f")"
            cp "upstream/$f" "v10-4-1-artifacts/source-snapshot/$f"
          done
          {
            echo 'BambuHelper ws_lcd_350 Smart Home v10.4.1 Workshop Home Hub RC2 validation'
            echo 'home_workshop_first=PASS'
            echo 'home_live_print_duplication=REMOVED'
            echo 'home_workshop_material=PASS'
            echo 'home_printer_compact_snapshot=PASS'
            echo 'home_device_hardware=PASS'
            echo 'home_network=PASS'
            echo 'home_system_recovery=PASS'
            echo 'home_cross_domain_attention=PASS'
            echo 'home_widget_customization=PASS'
            echo 'v10_4_printer_ux=PRESERVED'
            echo 'printer_configuration_screen_retention=PRESERVED'
            echo 'es8311_speaker=PRESERVED'
            echo 'microphone_i2s_rx=PRESERVED'
            echo 'ws350_build=PASS'
            echo 'jc3248w535_regression=PASS'
            sha256sum v10-4-1-artifacts/*.bin
          } | tee v10-4-1-artifacts/validation-report-v10-4-1-workshop-home-hub-rc2.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bambuhelper-ws_lcd_350-smart-home-v10-4-1-workshop-home-hub-rc2
          retention-days: 14
          if-no-files-found: error
          path: v10-4-1-artifacts/
