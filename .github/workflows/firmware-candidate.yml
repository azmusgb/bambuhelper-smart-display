name: Workshop OS Firmware Gate — v11.20 Portal Auth RC1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/firmware-candidate.yml'
      - 'README.md'
      - 'SECURITY.md'
      - 'releases/current.json'
      - 'apply_smart_home_*.py'
      - '.bambuhelper-validation/**'
      - 'assets/**'
      - 'scripts/apply_*.sh'
      - 'scripts/validate_*.py'
      - 'scripts/capture-ws350-views.zsh'
      - 'docs/physical-*.md'
      - 'docs/visual-*.md'
      - 'docs/portal-auth-*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop-os-firmware-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        name: Checkout Workshop OS repository

      - name: Checkout pinned BambuHelper baseline
        uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate candidate tooling
        run: |
          python -m py_compile apply_smart_home_physical_fit_v11_19_1.py
          python -m py_compile apply_smart_home_portal_auth_v11_20.py
          python -m py_compile scripts/validate_device_contracts.py
          python -m py_compile scripts/validate_visual_contracts_v11_19.py
          python -m py_compile scripts/validate_rendered_fit_v11_19_1.py
          python -m py_compile scripts/validate_portal_auth_v11_20.py
          bash -n scripts/apply_workshop_os_v11_19.sh
          bash -n scripts/apply_workshop_os_v11_19_1.sh
          bash -n scripts/capture-ws350-views.zsh

      - name: Reconstruct accepted v11.19 baseline
        run: bash scripts/apply_workshop_os_v11_19.sh upstream

      - name: Validate inherited device contracts at v11.19 boundary
        run: python scripts/validate_device_contracts.py

      - name: Validate complete v11.19 visual baseline
        run: python scripts/validate_visual_contracts_v11_19.py upstream

      - name: Apply accepted v11.19.1 physical-fit delta
        run: python apply_smart_home_physical_fit_v11_19_1.py --repo upstream --apply

      - name: Validate accepted v11.19.1 rendered-fit contracts
        run: python scripts/validate_rendered_fit_v11_19_1.py upstream

      - name: Verify accepted baseline before security delta
        run: |
          python - <<'PY'
          from pathlib import Path

          hub = Path('upstream/src/smart_hub.cpp').read_text()
          web = Path('upstream/src/web_server.cpp').read_text()
          mqtt = Path('upstream/src/bambu_mqtt.cpp').read_text()
          app = Path('upstream/web/app.js').read_text()
          tasmota = Path('upstream/src/tasmota.cpp').read_text()
          build = Path('upstream/include/smart_home_build.h').read_text()

          def need(body, needle, label):
              if needle not in body:
                  raise SystemExit(f'MISSING {label}: {needle}')

          for n in ['SMART_HOME_VERSION "v11.19.1"', 'Smart Home v11.19.1 Physical Fit RC2']:
              need(build, n, 'accepted release identity')
          for n in ['DROPPED: MQTT offline', 'if (!st.connected) return false']:
              need(mqtt, n, 'fail-closed printer control')
          for n in ['v117StateFresh', 'V117_STALE_MS=10000']:
              need(app, n, 'live-state integrity')
          for n in ['visiblePlugForSlot', 'TASMOTA_PLUG_COUNT']:
              need(tasmota, n, 'smart-plug slot mapping')
          for n in ['smartHubCapturePrepare', 'smartHubCaptureRgbRow', 'g_hubFrame->readPixel']:
              need(hub, n, 'physical framebuffer capture')
          for n in [
              'SECURE_GET("/hub/views", handleHubViews)',
              'SECURE_GET("/hub/frame.ppm", handleHubFramePpm)',
              'SECURE_POST("/hub/show", handleHubShow)',
          ]:
              need(web, n, 'visual capture route')
          for forbidden in ['requestSpeedCommand', 'requestFanCommand']:
              if forbidden in hub or forbidden in web or forbidden in mqtt:
                  raise SystemExit(f'forbidden speculative printer command introduced: {forbidden}')
          print('Accepted v11.19.1 baseline before auth delta: PASS')
          PY

      - name: Apply v11.20 Portal Auth RC1
        run: python apply_smart_home_portal_auth_v11_20.py --repo upstream --apply

      - name: Validate v11.20 portal authentication contracts
        run: python scripts/validate_portal_auth_v11_20.py upstream

      - name: Verify inherited safety after auth delta
        run: |
          python - <<'PY'
          from pathlib import Path

          hub = Path('upstream/src/smart_hub.cpp').read_text()
          web = Path('upstream/src/web_server.cpp').read_text()
          mqtt = Path('upstream/src/bambu_mqtt.cpp').read_text()
          tasmota = Path('upstream/src/tasmota.cpp').read_text()
          build = Path('upstream/include/smart_home_build.h').read_text()

          def need(body, needle, label):
              if needle not in body:
                  raise SystemExit(f'MISSING {label}: {needle}')

          for n in ['SMART_HOME_VERSION "v11.20"', 'Smart Home v11.20 Portal Auth RC1']:
              need(build, n, 'candidate release identity')
          for n in ['DROPPED: MQTT offline', 'if (!st.connected) return false']:
              need(mqtt, n, 'fail-closed printer control')
          for n in ['visiblePlugForSlot', 'TASMOTA_PLUG_COUNT']:
              need(tasmota, n, 'smart-plug slot mapping')
          for n in ['smartHubCapturePrepare', 'smartHubCaptureRgbRow', 'g_hubFrame->readPixel']:
              need(hub, n, 'physical framebuffer capture')
          for n in [
              'SECURE_GET("/hub/views", handleHubViews)',
              'SECURE_GET("/hub/frame.ppm", handleHubFramePpm)',
              'SECURE_POST("/hub/show", handleHubShow)',
          ]:
              need(web, n, 'authenticated visual capture')
          for forbidden in ['requestSpeedCommand', 'requestFanCommand']:
              if forbidden in hub or forbidden in web or forbidden in mqtt:
                  raise SystemExit(f'forbidden speculative printer command introduced: {forbidden}')
          print('v11.20 inherited control/capture safety: PASS')
          PY

      - name: Validate browser JavaScript
        run: node --check upstream/web/app.js

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build WS350 v11.20
        working-directory: upstream
        run: pio run -e ws_lcd_350

      - name: Regression build shared 320x480 target
        working-directory: upstream
        run: pio run -e jc3248w535

      - name: Merge Full image
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full

      - name: Package v11.20 Portal Auth RC1 artifacts
        shell: bash
        env:
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          FULL="$(find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' | sort | tail -1)"
          APP='upstream/.pio/build/ws_lcd_350/firmware.bin'
          mkdir -p firmware-gate-artifacts/source-snapshot firmware-gate-artifacts/tools firmware-gate-artifacts/docs
          cp "$FULL" firmware-gate-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Workshop-OS-v11.20-Portal-Auth-RC1-Full.bin
          cp "$APP" firmware-gate-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Workshop-OS-v11.20-Portal-Auth-RC1-OTA.bin
          cp "$APP" firmware-gate-artifacts/WaveshareHome-firmware.bin
          cp scripts/capture-ws350-views.zsh firmware-gate-artifacts/tools/capture-ws350-views.zsh
          cp apply_smart_home_portal_auth_v11_20.py firmware-gate-artifacts/tools/apply_smart_home_portal_auth_v11_20.py
          cp scripts/validate_portal_auth_v11_20.py firmware-gate-artifacts/tools/validate_portal_auth_v11_20.py
          cp docs/portal-auth-v11-20.md firmware-gate-artifacts/docs/portal-auth-v11-20.md
          cp docs/physical-fit-v11-19-1.md firmware-gate-artifacts/docs/physical-fit-v11-19-1.md
          cp SECURITY.md firmware-gate-artifacts/docs/SECURITY.md
          cp releases/current.json firmware-gate-artifacts/docs/release-state.json
          for f in include/web_pages.h include/smart_home_build.h web/app.js web/app.css src/web_server.cpp src/bambu_mqtt.cpp src/smart_hub.cpp src/settings.cpp src/display_ui.h src/tasmota.cpp src/security_manager.cpp include/security_manager.h; do
            mkdir -p "firmware-gate-artifacts/source-snapshot/$(dirname "$f")"
            cp "upstream/$f" "firmware-gate-artifacts/source-snapshot/$f"
          done
          {
            echo 'Workshop OS v11.20 Portal Auth RC1'
            echo "candidate_head_sha=${CANDIDATE_HEAD_SHA}"
            echo 'source_line=CANDIDATE'
            echo 'physical_acceptance=REQUIRED'
            echo 'accepted_v11_19_1_rendered_fit=PRESERVED'
            echo 'portal_auth=ENABLED'
            echo 'development_unlock=REMOVED'
            echo 'portal_credential_serial_logging=FORBIDDEN'
            echo 'normal_lan_recovery_auth=REQUIRED'
            echo 'ordinary_ap_full_admin_bypass=FORBIDDEN'
            echo 'ordinary_ap_public_scope=ONBOARDING_ONLY'
            echo 'recovery_safe_mode_public_scope=RECOVERY_OTA_RESET_ONLY'
            echo 'ap_portal_code_login=AVAILABLE'
            echo 'settings_export_anonymous_ap=FORBIDDEN'
            echo 'ws350_touch_safety=PRESERVED'
            echo 'same_origin_mutation_guard=PRESERVED'
            echo 'guarded_power_control=PRESERVED'
            echo 'fail_closed_printer_commands=PRESERVED'
            echo 'capture_routes=AUTHENTICATED'
            echo 'capture_raw_frame_retention=FORBIDDEN'
            echo 'capture_system_credential=REDACTED_BEFORE_RETENTION'
            echo 'capture_printer_config_exports=EXCLUDED'
            echo 'ws350_build=PASS'
            echo 'jc3248w535_regression=PASS'
            sha256sum firmware-gate-artifacts/*.bin
          } | tee firmware-gate-artifacts/validation-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: workshop-os-v11-20-portal-auth-rc1
          retention-days: 14
          if-no-files-found: error
          path: firmware-gate-artifacts/
