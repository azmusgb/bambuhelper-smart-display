name: Workshop OS Firmware Gate — v11.29 Acceptance Open LAN RC1

on:
  pull_request:
    branches: [feature/v11-27-companion-link]

permissions:
  contents: read

concurrency:
  group: workshop-os-firmware-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Native v11.29 Acceptance Mode Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        name: Checkout Workshop OS stacked candidate
      - uses: actions/checkout@v4
        name: Checkout pinned BambuHelper baseline
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate candidate tooling
        run: |
          set -euo pipefail
          python -m py_compile apply_smart_home_physical_fit_v11_19_1.py
          python -m py_compile apply_smart_home_portal_auth_v11_20.py
          python -m py_compile apply_smart_home_display_expert_v11_22.py
          python -m py_compile apply_smart_home_network_locale_layout_v11_23.py
          python -m py_compile apply_smart_home_touch_ux_v11_23_rc2_secure.py
          python -m py_compile apply_smart_home_touch_ux_v11_23_rc2_finalize_secure.py
          python -m py_compile apply_smart_home_touch_ux_v11_23_rc2_guard_feedback.py
          python -m py_compile apply_smart_home_auth_restore_v11_23_rc2.py
          python -m py_compile apply_smart_home_audio_console_v11_24.py
          python -m py_compile apply_workshop_companion_ble_v11_25.py
          python -m py_compile apply_workshop_companion_web_v11_26.py
          python -m py_compile apply_workshop_companion_link_v11_27.py
          python -m py_compile apply_workshop_companion_viewer_v11_28.py
          python -m py_compile apply_workshop_acceptance_mode_v11_29.py
          python -m py_compile scripts/validate_workshop_companion_viewer_v11_28.py
          python -m py_compile scripts/validate_workshop_acceptance_mode_v11_29.py
          python -m py_compile scripts/validate_settings_parity.py
          bash -n scripts/apply_workshop_os_v11_19.sh

      - name: Reconstruct accepted v11.19 baseline
        run: bash scripts/apply_workshop_os_v11_19.sh upstream
      - name: Validate inherited v11.19 device contracts
        run: python scripts/validate_device_contracts.py
      - name: Validate accepted v11.19 visual contracts
        run: python scripts/validate_visual_contracts_v11_19.py upstream

      - name: Apply accepted v11.19.1 physical-fit delta
        run: python apply_smart_home_physical_fit_v11_19_1.py --repo upstream --apply
      - name: Validate accepted v11.19.1 rendered fit
        run: python scripts/validate_rendered_fit_v11_19_1.py upstream

      - name: Apply and validate v11.20 Portal Auth baseline
        run: |
          python apply_smart_home_portal_auth_v11_20.py --repo upstream --apply
          python scripts/validate_portal_auth_v11_20.py upstream

      - name: Apply and validate v11.22 Display Expert
        run: |
          python apply_smart_home_display_expert_v11_22.py --repo upstream --apply
          python scripts/validate_display_expert_v11_22.py upstream

      - name: Reconstruct and validate secure v11.23 RC2
        run: |
          python apply_smart_home_network_locale_layout_v11_23.py --repo upstream --apply
          python scripts/validate_network_locale_layout_v11_23.py upstream
          python apply_smart_home_touch_ux_v11_23_rc2_secure.py --repo upstream --apply
          python scripts/validate_touch_ux_v11_23_rc2.py upstream
          python apply_smart_home_touch_ux_v11_23_rc2_finalize_secure.py --repo upstream --apply
          python scripts/validate_touch_ux_v11_23_rc2_finalize.py upstream
          python apply_smart_home_touch_ux_v11_23_rc2_guard_feedback.py --repo upstream --apply
          python scripts/validate_touch_ux_v11_23_rc2_guard_feedback.py upstream
          python apply_smart_home_auth_restore_v11_23_rc2.py --repo upstream --apply
          python scripts/validate_auth_restore_v11_23_rc2.py upstream

      - name: Apply and validate v11.24 Audio Console
        run: |
          python apply_smart_home_audio_console_v11_24.py --repo upstream --apply
          python scripts/validate_audio_console_v11_24.py upstream

      - name: Apply and validate v11.25 Workshop Companion BLE
        run: |
          python apply_workshop_companion_ble_v11_25.py --repo upstream --apply
          python scripts/validate_workshop_companion_ble_v11_25.py upstream

      - name: Apply and validate v11.26 Workshop Companion Web
        run: |
          python apply_workshop_companion_web_v11_26.py --repo upstream --apply
          python scripts/validate_workshop_companion_web_v11_26.py upstream

      - name: Apply and validate v11.27 Companion Link
        run: |
          python apply_workshop_companion_link_v11_27.py --repo upstream --apply
          python scripts/validate_workshop_companion_link_v11_27.py upstream

      - name: Apply and validate v11.28 Physical Companion Viewer
        run: |
          python apply_workshop_companion_viewer_v11_28.py --repo upstream --apply
          python scripts/validate_workshop_companion_viewer_v11_28.py upstream

      - name: Apply and validate v11.29 Acceptance Open LAN
        run: |
          python apply_workshop_acceptance_mode_v11_29.py --repo upstream --apply
          python scripts/validate_workshop_acceptance_mode_v11_29.py upstream

      - name: Validate settings parity against reconstructed v11.29 source
        run: python scripts/validate_settings_parity.py --repo upstream

      - name: Verify inherited control, recovery and volatile-capture boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          build=Path('upstream/include/smart_home_build.h').read_text()
          security=Path('upstream/src/security_manager.cpp').read_text()
          companion=Path('upstream/src/companion_web.cpp').read_text()
          display=Path('upstream/src/display_ui.cpp').read_text()
          mqtt=Path('upstream/src/bambu_mqtt.cpp').read_text()
          for needle in [
              'SMART_HOME_VERSION "v11.29"',
              '#define WORKSHOP_OS_ACCEPTANCE_OPEN_LAN 1',
              'server.on("/companion/state", HTTP_GET',
              'server.on("/companion/capture", HTTP_POST',
              'server.on("/companion/capture/show", HTTP_POST',
              'kCaptureMaxBytes = 256U * 1024U',
              'MALLOC_CAP_SPIRAM',
              'if (companionWebViewerActive())',
              'tft.drawJpg(phoneBuf, phoneLen',
          ]:
              assert needle in build + companion + display, needle
          for needle in [
              'if (!isAPMode()) return true;',
              'if (mutating && !sameOrigin(server))',
              'uri == "/settings/export" || uri == "/debug"',
              'recoverySafeModeActive()',
          ]:
              assert needle in security, needle
          for needle in ['DROPPED: MQTT offline','if (!st.connected) return false']:
              assert needle in mqtt, needle
          for forbidden in ['LittleFS','SPIFFS','FFat','Preferences','putBytes(','writeFile(']:
              assert forbidden not in companion, forbidden
          for forbidden in ['WORKSHOP_OS_TEMP_LAN_OPEN','Serial.printf("Portal code:']:
              assert forbidden not in build + security, forbidden
          print('v11.29 inherited control + recovery + volatile capture boundaries: PASS')
          PY

      - name: Validate browser JavaScript
        run: node --check upstream/web/app.js
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build WS350 v11.29
        working-directory: upstream
        run: pio run -e ws_lcd_350
      - name: Regression build shared 320x480 target
        working-directory: upstream
        run: pio run -e jc3248w535
      - name: Merge Full image
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full

      - name: Package v11.29 Acceptance Open LAN RC1 artifacts
        shell: bash
        env:
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          FULL="$(find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' | sort | tail -1)"
          APP='upstream/.pio/build/ws_lcd_350/firmware.bin'
          mkdir -p firmware-gate-artifacts/tools firmware-gate-artifacts/docs
          cp "$FULL" firmware-gate-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Workshop-OS-v11.29-Acceptance-Open-LAN-RC1-Full.bin
          cp "$APP" firmware-gate-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Workshop-OS-v11.29-Acceptance-Open-LAN-RC1-OTA.bin
          cp "$APP" firmware-gate-artifacts/WaveshareHome-firmware.bin
          cp apply_workshop_companion_viewer_v11_28.py firmware-gate-artifacts/tools/
          cp apply_workshop_acceptance_mode_v11_29.py firmware-gate-artifacts/tools/
          cp scripts/validate_workshop_companion_viewer_v11_28.py firmware-gate-artifacts/tools/
          cp scripts/validate_workshop_acceptance_mode_v11_29.py firmware-gate-artifacts/tools/
          cp docs/workshop-companion-viewer-v11-28.md firmware-gate-artifacts/docs/
          cp docs/workshop-acceptance-mode-v11-29.md firmware-gate-artifacts/docs/
          cp releases/current.json firmware-gate-artifacts/docs/release-state.json
          {
            echo 'Workshop OS v11.29 Acceptance Open LAN RC1'
            echo "candidate_head_sha=${CANDIDATE_HEAD_SHA}"
            echo 'source_line=STACKED_CANDIDATE_ON_V11_27_COMPANION_LINK'
            echo 'physical_acceptance=REQUIRED'
            echo 'normal_lan_portal_code=DISABLED_BY_DEFAULT'
            echo 'physical_portal_code_display=ABSENT'
            echo 'normal_lan_reads=OPEN'
            echo 'same_origin_mutations=REQUIRED'
            echo 'header_only_mutation_provenance=DISABLED'
            echo 'sensitive_settings_export_debug=BLOCKED'
            echo 'ordinary_ap_scope=PRESERVED'
            echo 'recovery_safe_mode=PRESERVED'
            echo 'safari_login_pattern_bug=FIXED_FOR_FUTURE_REENABLE'
            echo 'phone_capture=JPEG_TO_VOLATILE_PSRAM'
            echo 'physical_phone_photo_viewer=EXPLICIT_ONLY'
            echo 'auto_screen_takeover=ABSENT'
            echo 'chamber_camera_fallback=PRESERVED'
            echo 'ws350_build=PASS'
            echo 'jc3248w535_regression=PASS'
            sha256sum firmware-gate-artifacts/*.bin
          } | tee firmware-gate-artifacts/validation-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: workshop-os-v11-29-acceptance-open-lan-rc1
          retention-days: 14
          if-no-files-found: error
          path: firmware-gate-artifacts/
