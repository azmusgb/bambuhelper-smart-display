name: Finalize Smart Home v7.2 production site retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-smart-home-v7-2b.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update polished installer to v7.2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('app.js'); s=p.read_text()
          repl=[
            ("EXPECTED_RELEASE='production-rc-v7.1'","EXPECTED_RELEASE='production-rc-v7.2'"),
            ("selectedProfile='smart-home-v7.1'","selectedProfile='smart-home-v7.2'"),
            ("'RC v7.1 · '+d.board.id","'RC v7.2 · '+d.board.id"),
            ("'release: production-rc-v7.1'","'release: production-rc-v7.2'"),
          ]
          for old,new in repl:
            if old not in s: raise SystemExit('app.js anchor missing: '+old)
            s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('index.html'); s=p.read_text()
          repl=[
            ('id="release-pill">RC v7.1<','id="release-pill">RC v7.2<'),
            ('Smart Home v7.1 keeps the v7 navigation fix and redesigns Workshop around the real 320×480 Waveshare screen: stronger progress hierarchy, useful AMS detail, X2D thermal cards, safer bottom spacing, and explicit custom-build identity.',
             'Smart Home v7.2 keeps the v7.1 visual redesign and addresses the rolling redraw captured on the real Waveshare: Workshop rate-limits dynamic telemetry repainting, clears only the dynamic body, and preserves the header/footer instead of blanking the whole 320×480 panel.'),
            ('<option value="smart-home-v7.1">Smart Home v7.1 — recommended · physical UX pass</option><option value="smart-home-v7">Smart Home v7 — rollback</option><option value="smart-display-v6">Smart Display v6 — legacy rollback</option>',
             '<option value="smart-home-v7.2">Smart Home v7.2 — recommended · display stability</option><option value="smart-home-v7.1">Smart Home v7.1 — rollback</option><option value="smart-home-v7">Smart Home v7 — older rollback</option><option value="smart-display-v6">Smart Display v6 — legacy rollback</option>'),
            ('<strong>Smart Home v7.1 OTA</strong>','<strong>Smart Home v7.2 OTA</strong>'),
            ('Production RC v7.1 · ws_lcd_350','Production RC v7.2 · ws_lcd_350'),
          ]
          for old,new in repl:
            if old not in s: raise SystemExit('index.html anchor missing: '+old[:100])
            s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Write v7.2 release manifest
        shell: bash
        run: |
          cat > release.json <<'JSON'
          {
            "release": "production-rc-v7.2",
            "sourceCommit": "8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4",
            "board": {
              "id": "ws_lcd_350",
              "name": "Waveshare ESP32-S3-Touch-LCD-3.5",
              "chipFamily": "ESP32-S3",
              "display": "3.5\" ST7796 IPS 320×480",
              "touch": "FT6336 capacitive",
              "flash": "16 MB",
              "psram": "8 MB"
            },
            "profiles": {
              "smart-home-v7.2": {
                "label": "Smart Home v7.2",
                "recommended": true,
                "version": "BambuHelper v3.8.1 + Smart Home v7.2 Display Stability",
                "file": "firmware/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-home-v7.2-validated.bin",
                "size": 2208288,
                "sha256": "ed72f08e4977edd14dc7590a129469405d81e0f565f327402ea5e5190543233a",
                "otaFile": "firmware/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v7.2-OTA.bin",
                "otaSize": 2142752,
                "otaSha256": "3eb17d01fb980dbea82e07242bb385ea35b6035b3b57038616b0579f846a95fc",
                "description": "Recommended: v7.1 visual UX plus a video-driven display-stability pass. Workshop no longer clears the full panel on every render cycle; dynamic redraws are rate-limited and the header/footer stay stable."
              },
              "smart-home-v7.1": {
                "label": "Smart Home v7.1 (rollback)",
                "recommended": false,
                "version": "BambuHelper v3.8.1 + Smart Home v7.1 UX",
                "file": "firmware/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-home-v7.1-validated.bin",
                "size": 2208400,
                "sha256": "9f1cd4c103caad2378e2ff35e9562047030a8830ac2985e3ff9ab75f162b73fb",
                "otaFile": "firmware/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v7.1-OTA.bin",
                "otaSize": 2142864,
                "otaSha256": "938e0764453b875f5770fa74c64805ea82f721581da0c84dce56db736050037c",
                "description": "Previous physical UX build retained as immediate rollback."
              },
              "smart-home-v7": {
                "label": "Smart Home v7 (older rollback)",
                "recommended": false,
                "version": "v3.8.1 + Smart Home Navigation v7",
                "file": "firmware/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-home-v7-validated.bin",
                "size": 2207472,
                "sha256": "c659d4acfd3c6642baa789d6d7b64a9b77173a2f92be90a90fa71b48d4dbbfc7",
                "description": "Navigation-fix release retained as older rollback."
              },
              "smart-display-v6": {
                "label": "Smart Display v6 (legacy rollback)",
                "recommended": false,
                "version": "v3.8.1 + Smart Display v6",
                "file": "firmware/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-display-v6-validated.bin",
                "size": 2207040,
                "sha256": "82265502dac6b93356ee2ab3d7c4edcaad47bdd7584be85d24ddef348166d5ac",
                "description": "Legacy rollback retaining the original idle-clock behavior."
              }
            }
          }
          JSON

      - name: Write release-aware build script
        shell: bash
        run: |
          cat > build.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import hashlib, json, shutil
          root=Path(__file__).resolve().parent
          dist=root/'dist'
          if dist.exists(): shutil.rmtree(dist)
          dist.mkdir()
          for name in ['index.html','styles.css','app.js','release.json']:
              shutil.copy2(root/name,dist/name)
          release=json.loads((root/'release.json').read_text())
          assert release['release']=='production-rc-v7.2'
          assert release['board']['id']=='ws_lcd_350'
          def publish(path,size,sha,label):
              raw=(root/path).read_bytes(); actual=hashlib.sha256(raw).hexdigest()
              if len(raw)!=size: raise SystemExit(f'{label} size mismatch: {len(raw)}')
              if actual!=sha: raise SystemExit(f'{label} SHA mismatch: {actual}')
              out=dist/path; out.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(root/path,out)
              print('Verified and published',label,len(raw),actual)
          for pid,p in release['profiles'].items():
              publish(p['file'],p['size'],p['sha256'],pid+' Full')
              if p.get('otaFile'): publish(p['otaFile'],p['otaSize'],p['otaSha256'],pid+' OTA')
          PY

      - name: Write production README
        shell: bash
        run: |
          cat > README.md <<'MD'
          # BambuHelper Smart Display

          Production installer for **Waveshare ESP32-S3-Touch-LCD-3.5 (`ws_lcd_350`) + Bambu X2D**.

          ## Smart Home v7.2 — recommended

          v7 fixed the legacy-clock navigation defect. v7.1 redesigned Workshop from physical-display feedback. **v7.2 is the display-stability pass driven by the physical-device video.**

          The video confirms the v7.1 layout is physically running: progress hierarchy, detailed AMS cards, X2D thermal cards, and bottom safe area. It also captures a repeating rolling redraw/pulse near 5 Hz. Inspection found Workshop was clearing the entire TFT every time the hub render loop requested a frame.

          v7.2 changes:
          - Full-screen clear only when entering Workshop.
          - Dynamic Workshop repaint minimum interval: 750 ms.
          - Clean/unchanged Workshop refresh: 5 seconds.
          - Only the dynamic body is cleared between updates; header and bottom navigation remain stable.
          - Smart Home identity advances to v7.2.
          - v7.1 layout, tap cycle, printer preemption, HMS/error priority, and print-finish priority are preserved.

          **Tap cycle:** Home → Workshop → Custom → System → Printer → Home

          ### Validated v7.2 assets
          - Full/USB: 2,208,288 bytes · SHA-256 `ed72f08e4977edd14dc7590a129469405d81e0f565f327402ea5e5190543233a`
          - Wi-Fi OTA/app: 2,142,752 bytes · SHA-256 `3eb17d01fb980dbea82e07242bb385ea35b6035b3b57038616b0579f846a95fc`
          - Validation run: `33297286792`
          - `ws_lcd_350`: PASS
          - shared `jc3248w535` regression build: PASS

          v7.1, v7, and v6 remain available as rollback profiles.

          Production: <https://bambuhelper-smart-display.netlify.app/>

          The next release gate is physical comparison of v7.2 against the v7.1 video, specifically whether the visible rolling redraw/pulse is eliminated or materially reduced.
          MD

      - name: Validate and commit production v7.2 site
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          python3 build.py
          grep -Fq "EXPECTED_RELEASE='production-rc-v7.2'" app.js
          grep -Fq "selectedProfile='smart-home-v7.2'" app.js
          grep -Fq 'Smart Home v7.2 — recommended' index.html
          grep -Fq 'Smart Home v7.2 OTA' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html release.json build.py README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize Smart Home v7.2 production release [skip ci]'
          git push origin HEAD:main
