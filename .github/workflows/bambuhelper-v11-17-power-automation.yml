name: Workshop OS v11.17 — Power Automation RC1

on:
  pull_request:
    branches: [evolve/v11-16-led-essentials]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v11-17-power-automation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        name: Checkout evolution repository
      - name: Checkout pinned BambuHelper baseline
        uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate patch tooling
        run: |
          python -m py_compile \
            apply_smart_home_hardware_v10_1.py \
            apply_smart_home_ui_v10_2.py \
            apply_smart_home_browser_v10_3.py \
            apply_smart_home_screen_retention_v10_3_1.py \
            apply_smart_home_portal_v10_4.py \
            apply_smart_home_home_v10_4_1.py \
            apply_smart_home_physical_v10_5.py \
            apply_smart_home_audio_home_v10_6.py \
            apply_smart_home_signature_v11.py \
            apply_smart_home_calm_v11_1.py \
            apply_smart_home_workshop_tools_v11_2.py \
            apply_smart_home_printer_control_v11_3.py \
            apply_smart_home_printer_control_v11_3_fixup.py \
            apply_smart_home_control_polish_v11_4.py \
            apply_smart_home_printer_power_v11_5.py \
            apply_smart_home_workshop_command_v11_6.py \
            apply_smart_home_live_state_v11_7.py \
            apply_smart_home_display_experience_v11_8.py \
            apply_smart_home_display_schedule_v11_9.py \
            apply_smart_home_display_behavior_v11_10.py \
            apply_smart_home_display_visual_v11_11.py \
            apply_smart_home_clock_experience_v11_12.py \
            apply_smart_home_alerts_hms_v11_13.py \
            apply_smart_home_network_essentials_v11_14.py \
            apply_smart_home_audio_essentials_v11_15.py \
            apply_smart_home_led_essentials_v11_16.py \
            apply_smart_home_led_essentials_v11_16_fixup.py \
            apply_smart_home_power_automation_v11_17.py
      - name: Apply Smart Home stack through v10.1
        run: bash scripts/apply_smart_home_stack.sh upstream apply_smart_home_hardware_v10_1.py
      - {name: Apply v10.2, run: python apply_smart_home_ui_v10_2.py --repo upstream --apply}
      - {name: Apply v10.3, run: python apply_smart_home_browser_v10_3.py --repo upstream --apply}
      - {name: Apply v10.3.1, run: python apply_smart_home_screen_retention_v10_3_1.py --repo upstream --apply}
      - {name: Apply v10.4, run: python apply_smart_home_portal_v10_4.py --repo upstream --apply}
      - {name: Apply v10.4.1, run: python apply_smart_home_home_v10_4_1.py --repo upstream --apply}
      - {name: Apply v10.5, run: python apply_smart_home_physical_v10_5.py --repo upstream --apply}
      - {name: Apply v10.6, run: python apply_smart_home_audio_home_v10_6.py --repo upstream --apply}
      - {name: Apply v11, run: python apply_smart_home_signature_v11.py --repo upstream --apply}
      - {name: Apply v11.1, run: python apply_smart_home_calm_v11_1.py --repo upstream --apply}
      - {name: Apply v11.2, run: python apply_smart_home_workshop_tools_v11_2.py --repo upstream --apply}
      - {name: Apply v11.3 Printer Control, run: python apply_smart_home_printer_control_v11_3.py --repo upstream --apply}
      - {name: Apply v11.3 browser serialization fixup, run: python apply_smart_home_printer_control_v11_3_fixup.py --repo upstream --apply}
      - {name: Apply v11.4 Control Polish, run: python apply_smart_home_control_polish_v11_4.py --repo upstream --apply}
      - {name: Apply v11.5 Printer Power, run: python apply_smart_home_printer_power_v11_5.py --repo upstream --apply}
      - {name: Apply v11.6 Workshop Command Center, run: python apply_smart_home_workshop_command_v11_6.py --repo upstream --apply}
      - {name: Apply v11.7 Live State Integrity, run: python apply_smart_home_live_state_v11_7.py --repo upstream --apply}
      - {name: Apply v11.8 Display & Experience, run: python apply_smart_home_display_experience_v11_8.py --repo upstream --apply}
      - {name: Apply v11.9 Display Schedule & Finish, run: python apply_smart_home_display_schedule_v11_9.py --repo upstream --apply}
      - {name: Apply v11.10 Display Behavior, run: python apply_smart_home_display_behavior_v11_10.py --repo upstream --apply}
      - {name: Apply v11.11 Display Visual, run: python apply_smart_home_display_visual_v11_11.py --repo upstream --apply}
      - {name: Apply v11.12 Clock Experience, run: python apply_smart_home_clock_experience_v11_12.py --repo upstream --apply}
      - {name: Apply v11.13 Alerts & HMS, run: python apply_smart_home_alerts_hms_v11_13.py --repo upstream --apply}
      - {name: Apply v11.14 Network Essentials, run: python apply_smart_home_network_essentials_v11_14.py --repo upstream --apply}
      - {name: Apply v11.15 Audio Essentials, run: python apply_smart_home_audio_essentials_v11_15.py --repo upstream --apply}
      - {name: Apply v11.16 LED Essentials, run: python apply_smart_home_led_essentials_v11_16.py --repo upstream --apply}
      - {name: Apply v11.16 LED header fixup, run: python apply_smart_home_led_essentials_v11_16_fixup.py --repo upstream --apply}
      - {name: Apply v11.17 Power Automation, run: python apply_smart_home_power_automation_v11_17.py --repo upstream --apply}
      - name: Validate inherited device contracts
        run: python scripts/validate_device_contracts.py
      - name: Verify v11.17 power contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          build=Path('upstream/include/smart_home_build.h').read_text()
          hub=Path('upstream/src/smart_hub.cpp').read_text()
          web=Path('upstream/src/web_server.cpp').read_text()
          mqtt=Path('upstream/src/bambu_mqtt.cpp').read_text()
          app=Path('upstream/web/app.js').read_text()
          def need(body,n,label):
              if n not in body: raise SystemExit(f'MISSING {label}: {n}')
          for n in ['#define SMART_HOME_VERSION "v11.17"','#define SMART_HOME_PROFILE "power-automation"','Smart Home v11.17 Power Automation RC1']:
              need(build,n,'identity')
          for n in ['#include "led.h"','hubPowerConfigPlug','hubPowerDisplayModeLabel','hubStepPowerPoll','hubStepAutoOffDelay','hubPersistPower','PLUG ENABLED','POLL INTERVAL','STATUS DISPLAY','BUTTON POWER','AUTO OFF','AUTO OFF DELAY','CANCEL ON DOOR','PLUG CONFIG','tasmotaInit()','ps.autoOffEnabled=!ps.autoOffEnabled','ps.autoOffCancelOnDoor=!ps.autoOffCancelOnDoor','dispSettings.buttonPowerControl=!dispSettings.buttonPowerControl','(g_audioSettingsPage+1U)%7U']:
              need(hub,n,'power automation')
          for n in ['handlePrinterPowerStatus','handlePrinterPower','POWER OFF DURING PRINT']:
              need(web,n,'guarded power API')
          for n in ['DROPPED: MQTT offline','if (!st.connected) return false']:
              need(mqtt,n,'fail-closed printer control')
          for n in ['v117StateFresh','V117_STALE_MS=10000']:
              need(app,n,'live-state integrity')
          print('v11.17 Power Automation contracts: PASS')
          PY
      - name: Validate browser JavaScript
        run: node --check upstream/web/app.js
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build WS350 v11.17
        working-directory: upstream
        run: pio run -e ws_lcd_350
      - name: Regression build shared 320x480 target
        working-directory: upstream
        run: pio run -e jc3248w535
      - name: Merge Full image
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full
      - name: Package v11.17 artifacts
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' | sort | tail -1)"
          APP='upstream/.pio/build/ws_lcd_350/firmware.bin'
          mkdir -p v11-17-artifacts/source-snapshot
          cp "$FULL" v11-17-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v11.17-Power-Automation-RC1-Full.bin
          cp "$APP" v11-17-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v11.17-Power-Automation-RC1-OTA.bin
          cp "$APP" v11-17-artifacts/WaveshareHome-firmware.bin
          for f in include/web_pages.h include/smart_home_build.h web/app.js web/app.css src/web_server.cpp src/bambu_mqtt.cpp src/smart_hub.cpp src/settings.cpp src/display_ui.h src/tasmota.cpp; do
            mkdir -p "v11-17-artifacts/source-snapshot/$(dirname "$f")"
            cp "upstream/$f" "v11-17-artifacts/source-snapshot/$f"
          done
          {
            echo 'BambuHelper ws_lcd_350 Smart Home v11.17 Power Automation RC1 validation'
            echo 'led_public_header=PASS'
            echo 'power_slot_mapping=EXISTING_TASMOTA_POLICY'
            echo 'power_monitoring_page=PASS'
            echo 'auto_off_page=PASS'
            echo 'plug_ip_type_outlet=PORTAL_SETUP_BY_DESIGN'
            echo 'guarded_power_control=PRESERVED'
            echo 'fail_closed_printer_commands=PRESERVED'
            echo 'ws350_build=PASS'
            echo 'jc3248w535_regression=PASS'
            echo 'physical_acceptance=REQUIRED'
            sha256sum v11-17-artifacts/*.bin
          } | tee v11-17-artifacts/validation-report-v11-17-power-automation-rc1.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bambuhelper-ws_lcd_350-smart-home-v11-17-power-automation-rc1
          retention-days: 14
          if-no-files-found: error
          path: v11-17-artifacts/
