name: BambuHelper v7.1 UX source introspection

on:
  push:
    branches: [smart-home-v7-1-ux-validation]
    paths:
      - '.github/workflows/bambuhelper-v7-1-introspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rehydrate v1-v7 patchers
        shell: bash
        run: |
          set -euo pipefail
          v1=https://raw.githubusercontent.com/azmusgb/filamentinventory/741a6f0651fb4e20d8e2674f2c0ce726b0d7bdf9/.bambuhelper-validation
          v3=https://raw.githubusercontent.com/azmusgb/filamentinventory/07ce909fa7dd485abfc556eaf9addfbbd82e3cb3/.bambuhelper-validation
          v6=https://raw.githubusercontent.com/azmusgb/filamentinventory/c1a6cdf389be14b18f26eecefd5c5a62b5d1e7dc/.bambuhelper-validation
          curl -fsSL "$v1/installer.zlib.b64" -o /tmp/installer.b64
          for n in 0 1 2 3; do curl -fsSL "$v1/device.part$n" -o "/tmp/device.part$n"; done
          cat /tmp/device.part{0,1,2,3} > /tmp/device.b64
          curl -fsSL "$v3/v2.zlib.b64" -o /tmp/v2.b64
          curl -fsSL "$v3/v3.zlib.b64" -o /tmp/v3.b64
          curl -fsSL "$v6/v4.zlib.b64" -o /tmp/v4.b64
          curl -fsSL "$v6/v5.zlib.b64" -o /tmp/v5.b64
          curl -fsSL "$v6/v6.zlib.b64" -o /tmp/v6.b64
          python - <<'PY'
          from pathlib import Path
          import base64,zlib
          pairs=[('/tmp/installer.b64','apply_installer_evolution.py'),('/tmp/device.b64','apply_device_onboarding_evolution.py'),('/tmp/v2.b64','apply_resilience_evolution_v2.py'),('/tmp/v3.b64','apply_smart_profiles_evolution_v3.py'),('/tmp/v4.b64','apply_ws350_remote_dashboard_v4.py'),('/tmp/v5.b64','apply_commissioning_evolution_v5.py'),('/tmp/v6.b64','apply_smart_display_platform_v6.py'),('.bambuhelper-validation/v7-home.zlib.b64','apply_smart_home_navigation_v7.py')]
          for src,dst in pairs:
              Path(dst).write_bytes(zlib.decompress(base64.b64decode(Path(src).read_text().strip())))
          PY
      - name: Repair v3 patcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apply_smart_profiles_evolution_v3.py'); text=p.read_text(); needle='"app/profile-account-selection",'; pos=text.find(needle)
          if pos>=0:
              start=text.rfind('    text = replace_once(',0,pos); end=text.find('\n    )',pos)+len('\n    )')
              replacement="""    profile_refresh_anchor = '''  updatePrinterOnboarding();\n  refreshPrinterHealth(false);'''\n    profile_refresh_count = text.count(profile_refresh_anchor)\n    if profile_refresh_count < 1:\n        raise PatchError(\"app/profile-context-refresh: expected at least one v2 refresh anchor\")\n    text = text.replace(profile_refresh_anchor, '''  updatePrinterOnboarding();\n  refreshGaugeProfileUi();\n  refreshPrinterHealth(false);''')"""
              text=text[:start]+replacement+text[end:]; p.write_text(text)
          PY
      - name: Apply v1-v7 stack
        shell: bash
        run: |
          set -euo pipefail
          python apply_installer_evolution.py --repo upstream --apply
          python apply_device_onboarding_evolution.py --repo upstream --apply
          python apply_resilience_evolution_v2.py --repo upstream --apply
          python apply_smart_profiles_evolution_v3.py --repo upstream --apply
          python apply_ws350_remote_dashboard_v4.py --repo upstream --apply
          python apply_commissioning_evolution_v5.py --repo upstream --apply
          python apply_smart_display_platform_v6.py --repo upstream --apply
          python apply_smart_home_navigation_v7.py --repo upstream --apply
      - name: Print Smart Hub UX anchors
        shell: bash
        run: |
          set -euo pipefail
          echo '=== FUNCTIONS / ANCHORS ==='
          grep -n -E 'draw.*(Home|Workshop|Custom|System)|drawTapHint|SCREEN_HUB|WORKSHOP|AMS|Nozzle L|Nozzle R' upstream/src/smart_hub.cpp | head -250
          echo '=== SMART HUB SOURCE ==='
          cat upstream/src/smart_hub.cpp
      - name: Upload evolved source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: smart-hub-v7-source
          retention-days: 2
          path: |
            upstream/src/smart_hub.cpp
            upstream/src/smart_hub.h
            upstream/src/main.cpp
