name: Polish Smart Home v7.1 production OTA UX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-v7-1-production.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production OTA polish
        run: python3 scripts/polish_v71.py
      - name: Validate production contract
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          python3 build.py
          grep -Fq 'verifyOtaAsset' app.js
          grep -Fq 'Download verified OTA' index.html
          grep -Fq 'Fresh install / recovery over USB' index.html
          grep -Fq '.ota-panel{' styles.css
          grep -Fq 'for = "/app.js"' netlify.toml
          grep -Fq '### Update paths' README.md
      - name: Commit production polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html styles.css netlify.toml README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Make verified Wi-Fi OTA the primary upgrade path'
          git push origin HEAD:main
