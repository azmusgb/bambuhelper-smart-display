name: Workshop OS v11.19.1 — Physical Fit RC2

on:
  pull_request:
    branches: [evolve/v11-19-visual-correctness]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v11-19-1-physical-fit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        name: Checkout evolution repository

      - name: Checkout pinned BambuHelper baseline
        uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate v11.19.1 tooling
        run: |
          python -m py_compile apply_smart_home_physical_fit_v11_19_1.py
          python -m py_compile scripts/validate_rendered_fit_v11_19_1.py
          bash -n scripts/apply_workshop_os_v11_19_1.sh
          bash -n scripts/capture-ws350-views.zsh

      - name: Reconstruct validated v11.19 baseline
        run: bash scripts/apply_workshop_os_v11_19.sh upstream

      - name: Validate inherited device contracts at v11.19 boundary
        run: python scripts/validate_device_contracts.py

      - name: Validate complete v11.19 visual baseline before RC2 delta
        run: python scripts/validate_visual_contracts_v11_19.py upstream

      - name: Apply v11.19.1 physical-fit delta
        run: python apply_smart_home_physical_fit_v11_19_1.py --repo upstream --apply

      - name: Validate v11.19.1 rendered-fit contracts
        run: python scripts/validate_rendered_fit_v11_19_1.py upstream

      - name: Verify safety and capture invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          hub = Path('upstream/src/smart_hub.cpp').read_text()
          web = Path('upstream/src/web_server.cpp').read_text()
          mqtt = Path('upstream/src/bambu_mqtt.cpp').read_text()
          app = Path('upstream/web/app.js').read_text()
          tasmota = Path('upstream/src/tasmota.cpp').read_text()
          build = Path('upstream/include/smart_home_build.h').read_text()

          def need(body, needle, label):
              if needle not in body:
                  raise SystemExit(f'MISSING {label}: {needle}')

          for n in ['SMART_HOME_VERSION "v11.19.1"', 'Smart Home v11.19.1 Physical Fit RC2']:
              need(build, n, 'release identity')
          for n in ['DROPPED: MQTT offline', 'if (!st.connected) return false']:
              need(mqtt, n, 'fail-closed printer control')
          for n in ['v117StateFresh', 'V117_STALE_MS=10000']:
              need(app, n, 'live-state integrity')
          for n in ['visiblePlugForSlot', 'TASMOTA_PLUG_COUNT']:
              need(tasmota, n, 'existing smart-plug slot mapping')
          for n in ['smartHubCapturePrepare', 'smartHubCaptureRgbRow', 'g_hubFrame->readPixel']:
              need(hub, n, 'physical framebuffer capture')
          for n in [
              'SECURE_GET("/hub/views", handleHubViews)',
              'SECURE_GET("/hub/frame.ppm", handleHubFramePpm)',
              'SECURE_POST("/hub/show", handleHubShow)',
          ]:
              need(web, n, 'authenticated visual capture')
          for forbidden in ['requestSpeedCommand', 'requestFanCommand']:
              if forbidden in hub or forbidden in web or forbidden in mqtt:
                  raise SystemExit(f'forbidden speculative printer command introduced: {forbidden}')
          print('v11.19.1 safety/capture invariants: PASS')
          PY

      - name: Validate browser JavaScript
        run: node --check upstream/web/app.js

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build WS350 v11.19.1
        working-directory: upstream
        run: pio run -e ws_lcd_350

      - name: Regression build shared 320x480 target
        working-directory: upstream
        run: pio run -e jc3248w535

      - name: Merge Full image
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full

      - name: Package v11.19.1 artifacts
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' | sort | tail -1)"
          APP='upstream/.pio/build/ws_lcd_350/firmware.bin'
          mkdir -p v11-19-1-artifacts/source-snapshot v11-19-1-artifacts/tools v11-19-1-artifacts/docs
          cp "$FULL" v11-19-1-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v11.19.1-Physical-Fit-RC2-Full.bin
          cp "$APP" v11-19-1-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v11.19.1-Physical-Fit-RC2-OTA.bin
          cp "$APP" v11-19-1-artifacts/WaveshareHome-firmware.bin
          cp scripts/capture-ws350-views.zsh v11-19-1-artifacts/tools/capture-ws350-views.zsh
          cp apply_smart_home_physical_fit_v11_19_1.py v11-19-1-artifacts/tools/apply_smart_home_physical_fit_v11_19_1.py
          cp scripts/validate_rendered_fit_v11_19_1.py v11-19-1-artifacts/tools/validate_rendered_fit_v11_19_1.py
          cp docs/physical-fit-v11-19-1.md v11-19-1-artifacts/docs/physical-fit-v11-19-1.md
          for f in include/web_pages.h include/smart_home_build.h web/app.js web/app.css src/web_server.cpp src/bambu_mqtt.cpp src/smart_hub.cpp src/settings.cpp src/display_ui.h src/tasmota.cpp src/security_manager.cpp include/security_manager.h; do
            mkdir -p "v11-19-1-artifacts/source-snapshot/$(dirname "$f")"
            cp "upstream/$f" "v11-19-1-artifacts/source-snapshot/$f"
          done
          {
            echo 'BambuHelper ws_lcd_350 Smart Home v11.19.1 Physical Fit RC2 validation'
            echo 'release_scope=PHYSICAL_FIT_ONLY'
            echo 'v11_19_baseline_contracts=PASS_BEFORE_DELTA'
            echo 'workshop_loaded_state=AMS_IDLE_FITS'
            echo 'system_events_action=EVENTS_FITS'
            echo 'known_v11_19_overflow_strings=ABSENT'
            echo 'rendered_fit_contract=PASS'
            echo 'v11_19_visual_correctness=PRESERVED'
            echo 'portal_code_on_system=PRESERVED'
            echo 'ams_sentinel_guard=PRESERVED'
            echo 'inactive_configured_state=PRESERVED'
            echo 'custom_persisted_values=PRESERVED'
            echo 'visual_capture_catalog=22_VIEWS_PRESERVED'
            echo 'capture_routes=AUTHENTICATED'
            echo 'guarded_power_control=PRESERVED'
            echo 'fail_closed_printer_commands=PRESERVED'
            echo 'smart_plug_slot_mapping=PRESERVED'
            echo 'ws350_build=PASS'
            echo 'jc3248w535_regression=PASS'
            echo 'physical_acceptance=REQUIRED'
            sha256sum v11-19-1-artifacts/*.bin
          } | tee v11-19-1-artifacts/validation-report-v11-19-1-physical-fit-rc2.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bambuhelper-ws_lcd_350-smart-home-v11-19-1-physical-fit-rc2
          retention-days: 14
          if-no-files-found: error
          path: v11-19-1-artifacts/
