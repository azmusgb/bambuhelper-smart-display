name: BambuHelper ws_lcd_350 Smart Home v9.4 Recovery Foundation RC1

on:
  push:
    branches: [main, evolve/v9-4-recovery-foundation]
    paths:
      - 'apply_smart_home_recovery_v9_4.py'
      - 'apply_smart_home_dev_unlock_v9_3.py'
      - 'scripts/validate_device_contracts.py'
      - '.github/workflows/bambuhelper-v9-4-recovery-foundation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apply_smart_home_recovery_v9_4.py'
      - 'apply_smart_home_dev_unlock_v9_3.py'
      - 'scripts/validate_device_contracts.py'
      - '.github/workflows/bambuhelper-v9-4-recovery-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-home-v9-4-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout evolution repository
        uses: actions/checkout@v4

      - name: Checkout pinned BambuHelper baseline
        uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rehydrate v1-v7.2 patch stack
        shell: bash
        run: |
          set -euo pipefail
          v1=https://raw.githubusercontent.com/azmusgb/filamentinventory/741a6f0651fb4e20d8e2674f2c0ce726b0d7bdf9/.bambuhelper-validation
          v3=https://raw.githubusercontent.com/azmusgb/filamentinventory/07ce909fa7dd485abfc556eaf9addfbbd82e3cb3/.bambuhelper-validation
          v6=https://raw.githubusercontent.com/azmusgb/filamentinventory/c1a6cdf389be14b18f26eecefd5c5a62b5d1e7dc/.bambuhelper-validation
          v72=https://raw.githubusercontent.com/azmusgb/bambuhelper-smart-display/smart-home-v7-2-display-stability
          curl -fsSL "$v1/installer.zlib.b64" -o /tmp/installer.b64
          for n in 0 1 2 3; do curl -fsSL "$v1/device.part$n" -o "/tmp/device.part$n"; done
          cat /tmp/device.part{0,1,2,3} > /tmp/device.b64
          curl -fsSL "$v3/v2.zlib.b64" -o /tmp/v2.b64
          curl -fsSL "$v3/v3.zlib.b64" -o /tmp/v3.b64
          curl -fsSL "$v6/v4.zlib.b64" -o /tmp/v4.b64
          curl -fsSL "$v6/v5.zlib.b64" -o /tmp/v5.b64
          curl -fsSL "$v6/v6.zlib.b64" -o /tmp/v6.b64
          curl -fsSL "$v72/.bambuhelper-validation/v7-home.zlib.b64" -o /tmp/v7-home.b64
          curl -fsSL "$v72/apply_smart_home_ux_v7_1.py" -o apply_smart_home_ux_v7_1.py
          curl -fsSL "$v72/apply_smart_home_display_stability_v7_2.py" -o apply_smart_home_display_stability_v7_2.py
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          pairs=[
            ('/tmp/installer.b64','apply_installer_evolution.py'),('/tmp/device.b64','apply_device_onboarding_evolution.py'),
            ('/tmp/v2.b64','apply_resilience_evolution_v2.py'),('/tmp/v3.b64','apply_smart_profiles_evolution_v3.py'),
            ('/tmp/v4.b64','apply_ws350_remote_dashboard_v4.py'),('/tmp/v5.b64','apply_commissioning_evolution_v5.py'),
            ('/tmp/v6.b64','apply_smart_display_platform_v6.py'),('/tmp/v7-home.b64','apply_smart_home_navigation_v7.py')]
          for src,dst in pairs: Path(dst).write_bytes(zlib.decompress(base64.b64decode(Path(src).read_text().strip())))
          PY

      - name: Repair historical v3 patcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apply_smart_profiles_evolution_v3.py');text=p.read_text();needle='"app/profile-account-selection",';pos=text.find(needle)
          if pos>=0:
              start=text.rfind('    text = replace_once(',0,pos);end=text.find('\n    )',pos)
              if min(start,end)<0: raise SystemExit('v3 repair anchor malformed')
              end += len('\n    )')
              replacement="""    profile_refresh_anchor = '''  updatePrinterOnboarding();\n  refreshPrinterHealth(false);'''\n    profile_refresh_count = text.count(profile_refresh_anchor)\n    if profile_refresh_count < 1:\n        raise PatchError(\"app/profile-context-refresh: expected at least one v2 refresh anchor\")\n    text = text.replace(profile_refresh_anchor, '''  updatePrinterOnboarding();\n  refreshGaugeProfileUi();\n  refreshPrinterHealth(false);''')"""
              p.write_text(text[:start]+replacement+text[end:])
          PY
          python -m py_compile apply_*.py scripts/validate_device_contracts.py

      - name: Apply complete v9.4 recovery stack
        shell: bash
        run: |
          set -euo pipefail
          python apply_installer_evolution.py --repo upstream --apply
          python apply_device_onboarding_evolution.py --repo upstream --apply
          python apply_resilience_evolution_v2.py --repo upstream --apply
          python apply_smart_profiles_evolution_v3.py --repo upstream --apply
          python apply_ws350_remote_dashboard_v4.py --repo upstream --apply
          python apply_commissioning_evolution_v5.py --repo upstream --apply
          python apply_smart_display_platform_v6.py --repo upstream --apply
          python apply_smart_home_navigation_v7.py --repo upstream --apply
          python apply_smart_home_ux_v7_1.py --repo upstream --apply
          python apply_smart_home_display_stability_v7_2.py --repo upstream --apply
          python apply_smart_home_hardening_v8.py --repo upstream --apply
          python apply_smart_home_hardening_v8_1.py --repo upstream --apply
          python apply_smart_home_visual_v9.py --repo upstream --apply
          python apply_smart_home_print_ui_v9.py --repo upstream --apply
          python apply_smart_home_reliability_v9_1.py --repo upstream --apply
          python apply_smart_home_evolution_v9_2.py --repo upstream --apply
          python apply_smart_home_dev_unlock_v9_3.py --repo upstream --apply
          python apply_smart_home_recovery_v9_4.py --repo upstream --apply

      - name: Validate inherited OTA and printer contracts
        run: python scripts/validate_device_contracts.py

      - name: Verify v9.4 recovery invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          rec=Path('upstream/src/recovery_manager.cpp').read_text();web=Path('upstream/src/web_server.cpp').read_text();wifi=Path('upstream/src/wifi_manager.cpp').read_text();main=Path('upstream/src/main.cpp').read_text();build=Path('upstream/include/smart_home_build.h').read_text();app=Path('upstream/web/app.js').read_text();settings=Path('upstream/src/settings.cpp').read_text();sec=Path('upstream/src/security_manager.cpp').read_text();board=Path('upstream/boards/ws_lcd_350.ini').read_text()
          def need(body,n,label):
              if n not in body: raise SystemExit(f'MISSING {label}: {n}')
          def forbid(body,n,label):
              if n in body: raise SystemExit(f'FORBIDDEN {label}: {n}')
          for n in ['kCandidateMaxAttempts = 3','recoveryArmCandidateBoot','esp_ota_set_boot_partition','triple reset -> Safe Mode','kCandidateHealthyMs = 25000']:
              need(rec,n,'recovery manager')
          for n in ['/recovery/status','/recovery/touch','/recovery/safe','/recovery/rollback','/recovery/reset-ui','/recovery/reset-auth','/recovery/reset-wifi','WaveshareHome-firmware.bin','recoveryArmCandidateBoot();']:
              need(web,n,'recovery web plane')
          need(wifi,'Waveshare-Recovery-','recovery AP')
          need(wifi,'recoverySafeModeActive()','safe-mode WiFi gate')
          need(main,'recoveryBootProbe();','boot probe')
          need(main,'recoveryTick();','health tick')
          need(build,'#define SMART_HOME_VERSION "v9.4"','v9.4 version')
          need(build,'#define SMART_HOME_DEV_UNLOCK 1','dev unlock retained')
          need(build,'Smart Home v9.4 Recovery Foundation RC1','build identity')
          need(sec,'if (!portalAuthRequired()) return true;','portal auth remains off')
          need(settings,'buttonType = BTN_TOUCHSCREEN;','touch lockout guard')
          need(app,'Recovery console: <b>/recovery</b>','visible recovery path')
          forbid(web,'client.setInsecure();','TLS downgrade')
          forbid(board,'-D ENABLE_OTA_AUTO=1','WS350 unsafe auto OTA')
          print('v9.4 recovery + inherited safety contracts: PASS')
          PY

      - name: Validate browser JavaScript and SHA-256 helper
        shell: bash
        run: |
          set -euo pipefail
          node --check upstream/web/app.js
          python - <<'PY'
          from pathlib import Path
          s=Path('upstream/web/app.js').read_text();a=s.index('function sha256HexArrayBuffer');b=s.index('async function startOta()',a);Path('/tmp/hash-test.js').write_text(s[a:b]+"\nconst b=new TextEncoder().encode('abc').buffer; console.log(sha256HexArrayBuffer(b));\n")
          PY
          test "$(node /tmp/hash-test.js)" = 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build WS350
        working-directory: upstream
        run: pio run -e ws_lcd_350

      - name: Regression build shared 320x480 target
        working-directory: upstream
        run: pio run -e jc3248w535

      - name: Merge Full image
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full

      - name: Package v9.4 recovery artifacts
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' | sort | tail -1)";APP='upstream/.pio/build/ws_lcd_350/firmware.bin'
          mkdir -p v9.4-artifacts/source-snapshot
          cp "$FULL" v9.4-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v9.4-Recovery-Foundation-RC1-Full.bin
          cp "$APP" v9.4-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v9.4-Recovery-Foundation-RC1-OTA.bin
          cp "$APP" v9.4-artifacts/WaveshareHome-firmware.bin
          cmp "$APP" v9.4-artifacts/WaveshareHome-firmware.bin
          cp upstream/src/recovery_manager.cpp v9.4-artifacts/source-snapshot/recovery_manager.cpp
          cp upstream/src/web_server.cpp v9.4-artifacts/source-snapshot/web_server.cpp
          cp upstream/src/wifi_manager.cpp v9.4-artifacts/source-snapshot/wifi_manager.cpp
          cp upstream/src/security_manager.cpp v9.4-artifacts/source-snapshot/security_manager.cpp
          cp upstream/web/app.js v9.4-artifacts/source-snapshot/app.js
          {
            echo 'BambuHelper ws_lcd_350 Smart Home v9.4 Recovery Foundation RC1 validation'
            echo 'portal_auth_required=NO_DEVELOPMENT_BUILD'
            echo 'independent_recovery_console=PASS'
            echo 'triple_reset_safe_mode=PASS'
            echo 'recovery_ap=PASS'
            echo 'candidate_health_watchdog=PASS'
            echo 'automatic_candidate_rollback=PASS'
            echo 'manual_previous_slot_boot=PASS'
            echo 'selective_reset_controls=PASS'
            echo 'ws350_touch_forced_on=PASS'
            echo 'manual_ota_sha256=PASS'
            echo 'ws350_build=PASS'
            echo 'jc3248w535_regression=PASS'
            echo 'physical_acceptance=REQUIRED'
            sha256sum v9.4-artifacts/*.bin
          } | tee v9.4-artifacts/validation-report-v9.4-recovery-foundation-rc1.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bambuhelper-ws_lcd_350-smart-home-v9.4-recovery-foundation-rc1
          retention-days: 14
          if-no-files-found: error
          path: v9.4-artifacts/
