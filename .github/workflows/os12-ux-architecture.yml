name: Workshop OS 12 UX Architecture

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/os12-ux-architecture-overhaul
      - feature/os12-portal-control-plane-v4
    paths:
      - 'apply_workshop_os12_*.py'
      - 'contracts/**'
      - 'firmware/platform/**'
      - 'firmware/ui-v11.25-rc10/**'
      - 'firmware/ui-v11.26-ui11/**'
      - 'firmware/ui-v11.27-ui12/**'
      - 'firmware/ui-v11.28-ui13/**'
      - 'scripts/ensure-platformio.sh'
      - 'scripts/run_os12_platform_local.sh'
      - 'scripts/run_os12_ux_local.sh'
      - 'scripts/run_x2d_local.sh'
      - 'scripts/consolidate_portal_css.py'
      - 'scripts/smart_home_patch_utils.py'
      - 'scripts/validate_os12_*.py'
      - 'scripts/validate_os12_inventory_service.py'
      - 'scripts/validate_os12_ux_architecture.py'
      - 'scripts/validate_os12_ux_geometry.py'
      - 'scripts/validate_os12_ux_physical_fit.py'
      - 'scripts/validate_os12_ui_finish.py'
      - 'scripts/validate_os12_product_surface.py'
      - 'scripts/validate_os12_product_surface_complete.py'
      - 'scripts/validate_os12_physical_acceptance_refinement.py'
      - 'scripts/validate_os12_portal_login.py'
      - 'scripts/validate_os12_portal_control_plane.py'
      - 'scripts/validate_os12_visual_overhaul.py'
      - 'scripts/validate_os12_post_capture_ui_hardening.py'
      - 'scripts/validate_os12_workshop_surface_runtime.py'
      - 'scripts/validate_os12_portal_signin.py'
      - 'scripts/validate_os12_touch_hotfix.py'
      - 'scripts/validate_os12_status_lite.py'
      - 'scripts/validate_os12_code_token.py'
      - 'scripts/validate_os12_rapid_reset.py'
      - 'scripts/validate_os12_more_overhaul.py'
      - 'tests/workshop_os12_more_layout_smoke.cpp'
      - 'tests/workshop_os12_rapid_reset_smoke.cpp'
      - 'tests/workshop_os12_code_token_smoke.cpp'
      - '.github/workflows/os12-ux-architecture.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apply_workshop_os12_*.py'
      - 'contracts/**'
      - 'firmware/platform/**'
      - 'firmware/ui-v11.25-rc10/**'
      - 'firmware/ui-v11.26-ui11/**'
      - 'firmware/ui-v11.27-ui12/**'
      - 'firmware/ui-v11.28-ui13/**'
      - 'scripts/ensure-platformio.sh'
      - 'scripts/run_os12_platform_local.sh'
      - 'scripts/run_os12_ux_local.sh'
      - 'scripts/run_x2d_local.sh'
      - 'scripts/consolidate_portal_css.py'
      - 'scripts/smart_home_patch_utils.py'
      - 'scripts/validate_os12_*.py'
      - 'scripts/validate_os12_inventory_service.py'
      - 'scripts/validate_os12_ux_architecture.py'
      - 'scripts/validate_os12_ux_geometry.py'
      - 'scripts/validate_os12_ux_physical_fit.py'
      - 'scripts/validate_os12_ui_finish.py'
      - 'scripts/validate_os12_product_surface.py'
      - 'scripts/validate_os12_product_surface_complete.py'
      - 'scripts/validate_os12_physical_acceptance_refinement.py'
      - 'scripts/validate_os12_portal_login.py'
      - 'scripts/validate_os12_portal_control_plane.py'
      - 'scripts/validate_os12_visual_overhaul.py'
      - 'scripts/validate_os12_post_capture_ui_hardening.py'
      - 'scripts/validate_os12_workshop_surface_runtime.py'
      - 'scripts/validate_os12_portal_signin.py'
      - 'scripts/validate_os12_touch_hotfix.py'
      - 'scripts/validate_os12_status_lite.py'
      - 'scripts/validate_os12_code_token.py'
      - 'scripts/validate_os12_rapid_reset.py'
      - 'scripts/validate_os12_more_overhaul.py'
      - 'tests/workshop_os12_more_layout_smoke.cpp'
      - 'tests/workshop_os12_rapid_reset_smoke.cpp'
      - 'tests/workshop_os12_code_token_smoke.cpp'
      - '.github/workflows/os12-ux-architecture.yml'

permissions:
  contents: read

concurrency:
  group: os12-ux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Reconstruct and compile OS12 control plane
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OS12_RELEASE_VERSION: '12.2.0'
      OS12_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate script syntax
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y zsh
          fi
          python3 -m py_compile \
            apply_workshop_os12_ux_architecture.py \
            apply_workshop_os12_ux_geometry.py \
            apply_workshop_os12_ux_physical_fit.py \
            apply_workshop_os12_portal_control_plane.py \
            apply_workshop_os12_visual_overhaul.py \
            apply_workshop_os12_post_capture_ui_hardening.py \
            apply_workshop_os12_workshop_surface_runtime.py \
            apply_workshop_os12_physical_polish.py \
            apply_workshop_os12_portal_signin_restore.py \
            apply_workshop_os12_touch_hotfix.py \
            apply_workshop_os12_status_lite.py \
            apply_workshop_os12_code_token.py \
            apply_workshop_os12_rapid_reset.py \
            apply_workshop_os12_more_overhaul.py \
            scripts/validate_os12_ux_architecture.py \
            scripts/validate_os12_ux_geometry.py \
            scripts/validate_os12_ux_physical_fit.py \
            scripts/validate_os12_portal_control_plane.py \
            scripts/validate_os12_visual_overhaul.py \
            scripts/validate_os12_post_capture_ui_hardening.py \
            scripts/validate_os12_workshop_surface_runtime.py \
            scripts/validate_os12_physical_polish.py \
            scripts/validate_os12_portal_signin.py \
            scripts/validate_os12_touch_hotfix.py \
            scripts/validate_os12_status_lite.py \
            scripts/validate_os12_code_token.py \
            scripts/validate_os12_rapid_reset.py \
            scripts/validate_os12_more_overhaul.py \
            scripts/accept_os12_status_lite_runtime.py \
            scripts/accept_os12_code_token_runtime.py \
            scripts/accept_os12_portal_runtime.py \
            scripts/accept_os12_media_runtime.py \
            scripts/accept_os12_media_physical.py \
            scripts/accept_os12_device_ui_physical.py \
            scripts/accept_os12_update_runtime.py \
            scripts/capture_os12_views_unattended.py \
            scripts/validate_os12_automatic_candidate.py
          python3 -m json.tool contracts/filament-inventory-device-feed-v1.schema.json >/dev/null
          bash -n scripts/ensure-platformio.sh
          bash -n scripts/run_os12_ux_local.sh
          zsh -n scripts/capture-ws350-views.zsh
          bash -n scripts/bootstrap_ws350_os12_usb_macos.sh
          bash -n scripts/flash_os12_ci_candidate_macos.sh
          bash -n scripts/install_accept_os12_candidate_macos.sh
          bash -n scripts/accept_os12_installed_candidate_macos.sh

      - name: Cache pinned PlatformIO toolchain
        uses: actions/cache@v5
        with:
          path: .workshop-tools
          key: platformio-${{ runner.os }}-${{ hashFiles('scripts/ensure-platformio.sh', 'upstream/platformio.ini') }}

      - name: Prepare pinned PlatformIO toolchain
        run: |
          set -euo pipefail
          PIO_BIN="$(ROOT="$PWD" bash scripts/ensure-platformio.sh)"
          "$PIO_BIN" --version
          "$(dirname "$PIO_BIN")/python" --version

      - name: Reconstruct and build exact-head UX candidate
        run: BUILD=/tmp/ws350-os12-ux-build bash scripts/run_os12_ux_local.sh --build

      - name: Package exact WS350 physical candidate
        id: candidate
        run: |
          set -euo pipefail
          SRC=/tmp/ws350-os12-ux-build/.pio/build/ws_lcd_350/firmware.bin
          PART=/tmp/ws350-os12-ux-build/.pio/build/ws_lcd_350/partitions.bin
          OUT=/tmp/os12-ux-ws350-candidate
          test -s "$SRC"
          test -s "$PART"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$SRC" "$OUT/firmware.bin"
          cp "$PART" "$OUT/partitions.bin"
          FW_SHA="$(sha256sum "$OUT/firmware.bin" | awk '{print $1}')"
          FW_SIZE="$(stat -c '%s' "$OUT/firmware.bin")"
          PART_SHA="$(sha256sum "$OUT/partitions.bin" | awk '{print $1}')"
          PART_SIZE="$(stat -c '%s' "$OUT/partitions.bin")"
          {
            printf '%s  %s\n' "$FW_SHA" firmware.bin
            printf '%s  %s\n' "$PART_SHA" partitions.bin
          } > "$OUT/SHA256SUMS.txt"
          printf '{\n  "schemaVersion": 1,\n  "product": "Workshop OS",\n  "version": "%s",\n  "board": "ws_lcd_350",\n  "sourceSha": "%s",\n  "firmwareSha256": "%s",\n  "firmwareSize": %s,\n  "partitionSha256": "%s",\n  "partitionSize": %s,\n  "releaseState": "built-tested-ci-only",\n  "artifactRole": "physical-acceptance-candidate",\n  "candidateAuthority": "os12-ux-architecture",\n  "portalArchitecture": "control-plane-v4",\n  "inventoryContract": "device-feed/v1",\n  "physicalAcceptance": "required",\n  "accepted": false,\n  "stable": false\n}\n' \
            "$OS12_RELEASE_VERSION" "$OS12_SOURCE_SHA" "$FW_SHA" "$FW_SIZE" "$PART_SHA" "$PART_SIZE" > "$OUT/candidate.json"
          echo "firmware_sha256=$FW_SHA" >> "$GITHUB_OUTPUT"
          echo "firmware_size=$FW_SIZE" >> "$GITHUB_OUTPUT"
          {
            echo '### WS350 exact-head OS12 control-plane candidate'
            echo
            echo "- Source SHA: `$OS12_SOURCE_SHA`"
            echo "- Firmware SHA-256: `$FW_SHA`"
            echo "- Firmware bytes: `$FW_SIZE`"
            echo "- Partition SHA-256: `$PART_SHA`"
            echo "- Partition bytes: `$PART_SIZE`"
            echo '- Artifact role: physical-acceptance-candidate'
            echo '- Candidate authority: os12-ux-architecture'
            echo '- Portal architecture: control-plane-v4'
            echo '- Inventory contract: device-feed/v1'
            echo '- Release state: built/tested in CI only'
            echo '- Physical acceptance: required'
            echo '- Accepted: no'
            echo '- Stable: no'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact WS350 candidate evidence
        uses: actions/upload-artifact@v6
        with:
          name: os12-ux-ws350-${{ env.OS12_SOURCE_SHA }}
          path: /tmp/os12-ux-ws350-candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Compile experimental X2D overlay candidate (not packaged)
        run: |
          set -euo pipefail
          # Proves the reconstruction-only X2D overlays still apply to the real
          # tree and compile. The canonical candidate was already copied out and
          # uploaded above, so the overlays go straight onto the build tree for
          # an incremental build instead of a full rebuild of a copy.
          bash -n scripts/run_x2d_local.sh
          BASE=/tmp/ws350-os12-ux-build \
            X2D_BRIDGE_URL=http://10.0.0.16:8091/x2d/frame.jpg \
            bash scripts/run_x2d_local.sh --in-place --build

      - name: Record non-promotion state
        if: always()
        run: |
          echo 'This workflow is the sole CI authority for the flashable WS350 OS12 physical-acceptance candidate and proves reconstruction, hierarchy/geometry/navigation/control-plane validation, compile regression, and exact artifact identity only.'
          echo 'It does not establish runtime, physical, accepted, or stable state.'
          echo 'Inventory facts remain authoritative only when supplied by the profile-scoped Filament Inventory device-feed contract.'
          echo 'Do not integrate this candidate into the canonical bootstrap/update path until physical 480x320 acceptance passes.'
