name: One-time delete superseded evolution branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify containment or exact audited superseded delta, then delete
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          branches=(
            evolve/v9-2-smart-printer-ux
            evolve/v9-3-dev-unlocked
            evolve/v9-4-recovery-foundation
            evolve/v9-6-ultimate-experience
            evolve/v9-8-unified-display-system
            evolve/v9-9-display-experience
            evolve/v10-1-hardware-enablement
            evolve/v10-2-ui-polish
            evolve/v10-3-browser-workshop-os
            evolve/v10-4-portal-ux
            evolve/v10-5-physical-workshop-os
            evolve/v10-6-audio-home
            evolve/v10-workshop-os-theme
            evolve/v11-1-calm-workshop-os
            evolve/v11-2-workshop-tools
            evolve/v11-3-printer-control
            evolve/v11-4-control-polish
            evolve/v11-5-printer-power
            evolve/v11-6-workshop-command-center
            evolve/v11-7-live-state-integrity
            evolve/v11-8-display-experience
            evolve/v11-9-display-schedule
            evolve/v11-10-display-behavior
            evolve/v11-11-display-visual
            evolve/v11-12-clock-experience
            evolve/v11-13-alerts-hms
            evolve/v11-14-network-essentials
            evolve/v11-15-audio-essentials
            evolve/v11-16-led-essentials
            evolve/v11-17-power-automation
            evolve/v11-18-visual-capture
            evolve/v11-19-visual-correctness
            evolve/v11-19-1-physical-fit
            evolve/v11-signature-workshop-os
          )
          expected_delta() {
            case "$1" in
              evolve/v9-2-smart-printer-ux) printf '%s\n' '.github/workflows/bambuhelper-v9-2-smart-printer.yml' 'apply_smart_home_evolution_v9_2.py' 'docs/DEVICE_CAPABILITY_MATRIX.md' ;;
              evolve/v9-3-dev-unlocked) printf '%s\n' '.github/workflows/bambuhelper-v9-3-dev-unlocked.yml' 'apply_smart_home_dev_unlock_v9_3.py' ;;
              evolve/v9-4-recovery-foundation) printf '%s\n' '.github/workflows/bambuhelper-v9-4-recovery-foundation.yml' 'apply_smart_home_recovery_hardening_v9_4_1.py' 'apply_smart_home_recovery_v9_4.py' ;;
              evolve/v9-6-ultimate-experience) printf '%s\n' '.github/workflows/bambuhelper-v9-6-ultimate.yml' 'apply_smart_home_touch_nav_compat_v9_6_2.py' 'apply_smart_home_touch_nav_v9_6_1.py' 'apply_smart_home_ultimate_v9_6.py' ;;
              evolve/v10-workshop-os-theme) printf '%s\n' '.github/workflows/bambuhelper-v10-workshop-os-theme.yml' 'apply_smart_home_workshop_os_theme_v10.py' ;;
              *) return 1 ;;
            esac
          }
          unsafe=0
          existing=()
          for b in "${branches[@]}"; do
            if ! git show-ref --verify --quiet "refs/remotes/origin/$b"; then
              echo "ALREADY ABSENT: $b"
              continue
            fi
            existing+=("$b")
            if git merge-base --is-ancestor "refs/remotes/origin/$b" refs/remotes/origin/main; then
              echo "SAFE CONTAINED: $b"
              continue
            fi
            if expected="$(expected_delta "$b" 2>/dev/null)"; then
              base="$(git merge-base "refs/remotes/origin/$b" refs/remotes/origin/main)"
              actual="$(git diff --name-only "$base" "refs/remotes/origin/$b" | sort)"
              expected="$(printf '%s\n' "$expected" | sort)"
              if [[ "$actual" == "$expected" ]]; then
                echo "SAFE AUDITED-SUPERSEDED: $b"
              else
                echo "UNSAFE DELTA MISMATCH: $b" >&2
                echo 'Expected:' >&2; echo "$expected" >&2
                echo 'Actual:' >&2; echo "$actual" >&2
                unsafe=1
              fi
            else
              echo "UNSAFE UNREVIEWED DIVERGENCE: $b" >&2
              unsafe=1
            fi
          done
          if (( unsafe != 0 )); then
            echo 'Refusing cleanup: branch evidence changed from the audited set.' >&2
            exit 1
          fi
          for b in "${existing[@]}"; do
            git push origin --delete "$b"
          done
          remaining="$(git ls-remote --heads origin 'refs/heads/evolve/*')"
          if [[ -n "$remaining" ]]; then
            echo 'Unexpected evolve/* branches remain:' >&2
            echo "$remaining" >&2
            exit 1
          fi
          echo "Evolution branch cleanup: PASS (${#existing[@]} deleted)"
      - name: Remove one-time workflow and maintenance branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/delete-evolution-branches-once.yml
          git commit -m "Remove completed one-time branch cleanup workflow"
          git push origin HEAD:main
          git push origin --delete maintenance/delete-evolution-branches || true
