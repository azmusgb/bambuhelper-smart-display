name: Import validated Smart Home v7 firmware

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v7-validated-firmware.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  import-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated v7 artifact from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ID=9726695851
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/v7.zip
          mkdir -p /tmp/v7
          unzip -q /tmp/v7.zip -d /tmp/v7
          FULL=/tmp/v7/upstream/firmware/v3.8.1/BambuHelper-ws_lcd_350-v3.8.1-Full.bin
          REPORT=/tmp/v7/validation-report-v7.txt
          test -f "$FULL"
          test -f "$REPORT"
          test "$(stat -c%s "$FULL")" = '2207472'
          echo 'c659d4acfd3c6642baa789d6d7b64a9b77173a2f92be90a90fa71b48d4dbbfc7  '"$FULL" | sha256sum -c -
          grep -Fq 'legacy_clock_replaced_by_smart_home=PASS' "$REPORT"
          grep -Fq 'shared_layout_regression=jc3248w535_passed' "$REPORT"
          mkdir -p firmware
          cp "$FULL" firmware/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-home-v7-validated.bin
          cp "$REPORT" validation-report-v7.txt

      - name: Commit validated v7 release asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-home-v7-validated.bin validation-report-v7.txt
          if git diff --cached --quiet; then
            echo 'Validated v7 firmware already present.'
          else
            git commit -m 'Add validated Smart Home v7 firmware'
            git push origin HEAD:main
          fi
