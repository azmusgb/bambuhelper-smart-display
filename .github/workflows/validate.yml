name: Validate

# The one check every change gets: repository, release and tooling contracts. Firmware builds
# live in firmware.yml and the iOS app in companion-ios.yml, both path-filtered.
# Branches are validated through their pull request; push runs only for main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Core repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  raise SystemExit(f'Invalid JSON: {path}: {exc}')
          print('JSON validation: PASS')
          PY

      - name: Validate tracked Python syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git ls-files -z '*.py')
          if (("${#files[@]}")); then
            python3 -m py_compile "${files[@]}"
          fi
          echo 'Python syntax: PASS'

      - name: Test X2D camera overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_x2d_bridge_camera.py
          python3 scripts/test_x2d_viewer_polish.py
          python3 scripts/test_consolidate_portal_css.py
          python3 scripts/test_portal_phone_fit.py
          python3 scripts/test_device_localai_palette.py

      - name: Validate tracked shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(git ls-files -z '*.sh')
          echo 'Shell syntax: PASS'

      - name: Compile lightweight platform contract smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/workshop-os12-tests
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic tests/workshop_os12_state_smoke.cpp -o /tmp/workshop-os12-tests/state-smoke
          /tmp/workshop-os12-tests/state-smoke
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic tests/workshop_os12_inventory_projection_smoke.cpp -o /tmp/workshop-os12-tests/inventory-projection-smoke
          /tmp/workshop-os12-tests/inventory-projection-smoke
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic             tests/workshop_os12_portal_access_smoke.cpp             -o /tmp/workshop-os12-tests/portal-access-smoke
          /tmp/workshop-os12-tests/portal-access-smoke
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic             tests/workshop_os12_status_lite_smoke.cpp             -o /tmp/workshop-os12-tests/status-lite-smoke
          /tmp/workshop-os12-tests/status-lite-smoke
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic tests/workshop_os12_code_token_smoke.cpp -o /tmp/workshop-os12-tests/code-token-smoke
          /tmp/workshop-os12-tests/code-token-smoke
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic tests/workshop_os12_more_layout_smoke.cpp -o /tmp/workshop-os12-tests/more-layout-smoke
          /tmp/workshop-os12-tests/more-layout-smoke
          g++ -std=c++11 -O1 -Wall -Wextra -Werror -pedantic tests/workshop_os12_tabs_layout_smoke.cpp -o /tmp/workshop-os12-tests/tabs-layout-smoke
          /tmp/workshop-os12-tests/tabs-layout-smoke
          g++ -std=c++11 -O1 -Wall -Wextra -Werror -pedantic tests/workshop_os12_localai_feed_smoke.cpp -o /tmp/workshop-os12-tests/localai-feed-smoke
          /tmp/workshop-os12-tests/localai-feed-smoke
          g++ -std=c++11 -O1 -Wall -Wextra -Werror -pedantic tests/workshop_os12_lab_judge_smoke.cpp -o /tmp/workshop-os12-tests/lab-judge-smoke
          /tmp/workshop-os12-tests/lab-judge-smoke
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic tests/workshop_os12_rapid_reset_smoke.cpp -o /tmp/workshop-os12-tests/rapid-reset-smoke
          /tmp/workshop-os12-tests/rapid-reset-smoke
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic tests/workshop_os12_frame_diff_smoke.cpp -o /tmp/workshop-os12-tests/frame-diff-smoke
          /tmp/workshop-os12-tests/frame-diff-smoke
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic tests/workshop_os12_recording_dsp_smoke.cpp -o /tmp/workshop-os12-tests/recording-dsp-smoke
          /tmp/workshop-os12-tests/recording-dsp-smoke
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic tests/workshop_os12_press_gesture_smoke.cpp -o /tmp/workshop-os12-tests/press-gesture-smoke
          /tmp/workshop-os12-tests/press-gesture-smoke
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic -pthread tests/workshop_os12_mic_meter_smoke.cpp -o /tmp/workshop-os12-tests/mic-meter-smoke
          /tmp/workshop-os12-tests/mic-meter-smoke

      - name: Validate repository and release policy
        run: python3 scripts/validate_release.py

      - name: Validate static installer and device update manifest
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          python3 build.py
          python3 scripts/validate_static_installer.py

      - name: Validate device platform contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_os12_device_update.py --source-root .
          python3 scripts/validate_os12_candidate_publisher.py
          python3 scripts/validate_os12_media_service.py
          python3 scripts/validate_os12_premium_ui_v2.py --repo .
          python3 scripts/validate_platformio_toolchain.py

      - name: Validate acceptance and recovery tooling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y zsh >/dev/null
          fi
          zsh -n scripts/capture-ws350-views.zsh
          python3 scripts/validate_os12_physical_acceptance.py
          python3 scripts/validate_os12_automation_collection.py
          python3 scripts/validate_os12_recovery_roundtrip.py
          python3 scripts/test_os12_evidence_bundle.py

      - name: Exercise acceptance clients against a fake device
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_os12_portal_session_client.py
          python3 scripts/test_os12_status_lite_runtime.py
          python3 scripts/test_os12_code_token_runtime.py
          python3 scripts/test_os12_video_page_start.py
          python3 scripts/test_os12_retest_12_3_6.py
          python3 scripts/test_os12_retest_12_3_9.py

      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -q '^firmware/build/'; then
            echo 'firmware/build must not be tracked' >&2
            exit 1
          fi
          echo 'Repository hygiene: PASS'
