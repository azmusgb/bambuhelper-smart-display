name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('.').rglob('*.json'):
              try:
                  json.loads(p.read_text())
              except Exception as e:
                  raise SystemExit(f'Invalid JSON: {p}: {e}')
          print('JSON validation passed')
          PY

      - name: Validate settings capability registry
        run: python3 scripts/validate_settings_parity.py

      - name: Validate Workshop Companion protocol
        run: python3 scripts/validate_companion_protocol.py

      - name: Validate Workshop OS 12 device contract
        run: python3 scripts/validate_os12_device_contract.py

      - name: Validate Workshop OS 12 platform bridge
        run: python3 scripts/validate_os12_platform_bridge.py

      - name: Validate Workshop OS 12 media service
        run: python3 scripts/validate_os12_media_service.py

      - name: Validate Workshop OS 12 UI state reads
        run: python3 scripts/validate_os12_ui_state_reads.py

      - name: Validate Workshop OS 12 system state reads
        run: python3 scripts/validate_os12_system_state_reads.py

      - name: Validate Workshop OS 12 non-destructive controls
        run: python3 scripts/validate_os12_non_destructive_controls.py

      - name: Validate Workshop OS 12 guarded Stop
        run: python3 scripts/validate_os12_guarded_stop.py

      - name: Validate Workshop OS 12 portal login hardening
        run: python3 scripts/validate_os12_portal_login.py

      - name: Validate Workshop OS 12 device-native updates
        run: python3 scripts/validate_os12_device_update.py --source-root .

      - name: Validate OS12 candidate publication safety
        run: python3 scripts/validate_os12_candidate_publisher.py

      - name: Validate runtime acceptance helper syntax
        run: |
          python3 -m py_compile \
            scripts/accept_os12_portal_runtime.py \
            scripts/accept_os12_update_runtime.py

      - name: Validate OS12 patcher/publication helper syntax
        run: |
          python3 -m py_compile \
            apply_workshop_os12_device_update.py \
            apply_workshop_os12_release_identity.py \
            apply_workshop_os12_media_runtime.py \
            apply_workshop_os12_media_ui.py \
            scripts/validate_os12_device_update.py \
            scripts/prepare_os12_device_candidate.py \
            scripts/validate_os12_candidate_publisher.py \
            scripts/validate_os12_media_service.py \
            scripts/validate_os12_media_runtime.py \
            scripts/validate_os12_media_ui.py

      - name: Compile Workshop OS 12 platform contracts
        run: |
          set -euo pipefail
          mkdir -p /tmp/workshop-os12-tests
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            tests/workshop_os12_state_smoke.cpp \
            -o /tmp/workshop-os12-tests/state-smoke
          /tmp/workshop-os12-tests/state-smoke

      - name: Validate shell helpers
        run: |
          bash -n scripts/ensure-platformio.sh
          bash -n scripts/waveshare-usb.sh
          bash -n scripts/run_os12_platform_local.sh
          bash -n scripts/bootstrap_ws350_os12_usb_macos.sh

      - name: Check ignored build output
        run: |
          if git ls-files | grep -q '^firmware/build/'; then
            echo 'firmware/build must not be tracked'
            exit 1
          fi

  companion-ios:
    name: Workshop Companion iOS
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: companion/ios
        run: xcodegen generate --spec project.yml

      - name: Compile iOS Simulator app
        working-directory: companion/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project WorkshopCompanion.xcodeproj \
            -scheme WorkshopCompanion \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
