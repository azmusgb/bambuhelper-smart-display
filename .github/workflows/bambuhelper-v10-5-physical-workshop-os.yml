name: BambuHelper ws_lcd_350 Smart Home v10.5 Physical Workshop OS RC1

on:
  push:
    branches: [evolve/v10-5-physical-workshop-os]
    paths:
      - 'apply_smart_home_physical_v10_5.py'
      - '.bambuhelper-validation/v10_5_physical.zlib.b64'
      - '.github/workflows/bambuhelper-v10-5-physical-workshop-os.yml'
  pull_request:
    branches: [evolve/v10-4-portal-ux]
    paths:
      - 'apply_smart_home_physical_v10_5.py'
      - '.bambuhelper-validation/v10_5_physical.zlib.b64'
      - '.github/workflows/bambuhelper-v10-5-physical-workshop-os.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-home-v10-5-physical-workshop-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout evolution repository
        uses: actions/checkout@v4

      - name: Checkout pinned BambuHelper baseline
        uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate patch tooling
        run: |
          python -m py_compile \
            apply_smart_home_hardware_v10_1.py \
            apply_smart_home_ui_v10_2.py \
            apply_smart_home_browser_v10_3.py \
            apply_smart_home_screen_retention_v10_3_1.py \
            apply_smart_home_portal_v10_4.py \
            apply_smart_home_home_v10_4_1.py \
            apply_smart_home_physical_v10_5.py
          bash -n scripts/apply_smart_home_stack.sh

      - name: Apply Smart Home stack through v10.1
        run: bash scripts/apply_smart_home_stack.sh upstream apply_smart_home_hardware_v10_1.py

      - name: Apply v10.2 physical UI polish
        run: python apply_smart_home_ui_v10_2.py --repo upstream --apply

      - name: Apply v10.3 browser Workshop OS
        run: python apply_smart_home_browser_v10_3.py --repo upstream --apply

      - name: Apply v10.3.1 screen-retention hotfix
        run: python apply_smart_home_screen_retention_v10_3_1.py --repo upstream --apply

      - name: Apply v10.4 portal UX
        run: python apply_smart_home_portal_v10_4.py --repo upstream --apply

      - name: Apply v10.4.1 workshop-first browser Home
        run: python apply_smart_home_home_v10_4_1.py --repo upstream --apply

      - name: Apply v10.5 physical Workshop OS
        run: python apply_smart_home_physical_v10_5.py --repo upstream --apply

      - name: Validate inherited device contracts
        run: python scripts/validate_device_contracts.py

      - name: Verify v10.5 physical UX and inherited contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          hub=Path('upstream/src/smart_hub.cpp').read_text()
          main=Path('upstream/src/main.cpp').read_text()
          build=Path('upstream/include/smart_home_build.h').read_text()
          board=Path('upstream/boards/ws_lcd_350.ini').read_text()
          backend=Path('upstream/src/buzzer_backend_es8311.cpp').read_text()
          web=Path('upstream/src/web_server.cpp').read_text()
          focal=Path('upstream/src/button_touch_focaltech.cpp').read_text()
          app=Path('upstream/web/app.js').read_text()

          def need(body,n,label):
              if n not in body: raise SystemExit(f'MISSING {label}: {n}')
          def forbid(body,n,label):
              if n in body: raise SystemExit(f'FORBIDDEN {label}: {n}')

          need(build,'#define SMART_HOME_VERSION "v10.5"','v10.5 version')
          need(build,'Smart Home v10.5 Physical Workshop OS RC1','v10.5 build label')

          # 1. Cross-domain Home, with Printer as one subsystem.
          for n in ['WORKSHOP / MATERIALS','NETWORK','DEVICE','SYSTEM','No attention items']:
              need(hub,n,'cross-domain Home')

          # 2/3. Workshop is materials-first, not another printer telemetry page.
          for n in ['AMS / FILAMENT','LOADED','uiLoadedTray','uiLoadedFilamentLow']:
              need(hub,n,'materials-first Workshop')

          # 4/5. Global connectivity header + canonical printer semantics.
          need(hub,'const char* globalState = online ? "ONLINE" : "OFFLINE";','global header state')
          need(hub,'uiPrinterStateLabel','canonical printer state')

          # 6. Classic is not promoted from Printer; legacy surface stays under More.
          forbid(hub,'"CLASSIC DETAILS"','Printer Classic action')
          need(hub,'"MATERIALS"','Printer to Workshop action')

          # 7. AMS slots expose material, coarse color identity, and remaining percent.
          for n in ['uiFilamentColorName','remainPct','BLACK','WHITE','ORANGE','PURPLE']:
              need(hub,n,'AMS material identity')

          # 8/9. Compact More identity and non-truncating recovery health.
          need(hub,'Workshop OS %s','short device build identity')
          need(hub,'RECOVERY OK','compact recovery pill')
          forbid(hub,'Smart Home v10.4.1 Workshop Home Hub','long physical build label')

          # 10. Reduce decorative accent noise while keeping strong cards distinct.
          need(hub,'Normal cards use a quiet top accent','simplified card accents')

          # Routing/actions remain complementary.
          need(hub,'setPage(SCREEN_HUB_WORKSHOP)','Printer materials routing')
          need(hub,'setPage(SCREEN_HUB_PRINTER)','Workshop printer routing')

          # Preserve prior safety/hardware foundations.
          need(main,'Smart Home v10.3.1 screen-retention contract.','screen retention')
          need(main,'if (!smartHubShouldYieldToPrinter(printing))','screen route guard')
          for n in ['BOARD_HAS_ES8311_AUDIO=1','BOARD_HAS_MICROPHONE=1','AUDIO_I2S_DIN=14','AUDIO_PA_CTRL=-1']:
              need(board,n,'WS350 audio hardware')
          for n in ['I2S_MODE_RX','buzzerBackendMicLevel','AUDIO_PA_CTRL >= 0']:
              need(backend,n,'ES8311/microphone backend')
          need(web,'handleAudioMicTest','microphone diagnostic')
          need(web,'recoverySha256HexArrayBuffer','Safari-safe recovery')
          need(focal,'ft6336RecoverBus','FT6336 recovery')
          need(app,'v1041BuildHome','workshop-first browser Home preserved')

          print('v10.5 physical Workshop OS contracts: PASS')
          PY

      - name: Validate browser JavaScript
        run: node --check upstream/web/app.js

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build WS350 v10.5
        working-directory: upstream
        run: pio run -e ws_lcd_350

      - name: Regression build shared 320x480 target
        working-directory: upstream
        run: pio run -e jc3248w535

      - name: Merge Full image
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full

      - name: Package v10.5 Physical Workshop OS RC1 artifacts
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' | sort | tail -1)"
          APP='upstream/.pio/build/ws_lcd_350/firmware.bin'
          mkdir -p v10-5-artifacts/source-snapshot
          cp "$FULL" v10-5-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v10.5-Physical-Workshop-OS-RC1-Full.bin
          cp "$APP" v10-5-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v10.5-Physical-Workshop-OS-RC1-OTA.bin
          cp "$APP" v10-5-artifacts/WaveshareHome-firmware.bin
          for f in src/main.cpp src/smart_hub.cpp src/web_server.cpp src/buzzer_backend_es8311.cpp src/button_touch_focaltech.cpp include/smart_home_build.h web/app.js web/app.css boards/ws_lcd_350.ini; do
            mkdir -p "v10-5-artifacts/source-snapshot/$(dirname "$f")"
            cp "upstream/$f" "v10-5-artifacts/source-snapshot/$f"
          done
          {
            echo 'BambuHelper ws_lcd_350 Smart Home v10.5 Physical Workshop OS RC1 validation'
            echo 'physical_home_cross_domain_dashboard=PASS'
            echo 'workshop_materials_first=PASS'
            echo 'global_header_connectivity_time=PASS'
            echo 'canonical_printer_state_semantics=PASS'
            echo 'printer_classic_removed=PASS'
            echo 'ams_color_and_remaining_identity=PASS'
            echo 'compact_more_identity=PASS'
            echo 'visible_truncation_guards=PASS'
            echo 'simplified_card_accents=PASS'
            echo 'browser_v10_4_1=PRESERVED'
            echo 'printer_configuration_screen_retention=PRESERVED'
            echo 'es8311_speaker=PRESERVED'
            echo 'microphone_i2s_rx=PRESERVED'
            echo 'ft6336_reliability=PRESERVED'
            echo 'ws350_build=PASS'
            echo 'jc3248w535_regression=PASS'
            echo 'physical_acceptance=REQUIRED'
            sha256sum v10-5-artifacts/*.bin
          } | tee v10-5-artifacts/validation-report-v10-5-physical-workshop-os-rc1.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bambuhelper-ws_lcd_350-smart-home-v10-5-physical-workshop-os-rc1
          retention-days: 14
          if-no-files-found: error
          path: v10-5-artifacts/
