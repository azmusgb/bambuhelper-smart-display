name: Smoke test Smart Home v7.1 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-netlify-v7-1.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production HTML and release manifest
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://bambuhelper-smart-display.netlify.app'
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/" -o /tmp/index.html
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/release.json" -o /tmp/release.json
          grep -Fq 'RC v7.1' /tmp/index.html
          grep -Fq 'Smart Home v7.1 — recommended' /tmp/index.html
          grep -Fq 'Download v7.1 OTA image' /tmp/index.html
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/release.json'))
          assert r['release']=='production-rc-v7.1'
          p=r['profiles']['smart-home-v7.1']
          assert p['recommended'] is True
          assert p['size']==2208400
          assert p['sha256']=='9f1cd4c103caad2378e2ff35e9562047030a8830ac2985e3ff9ab75f162b73fb'
          assert p['otaSize']==2142864
          assert p['otaSha256']=='938e0764453b875f5770fa74c64805ea82f721581da0c84dce56db736050037c'
          print('production manifest: PASS')
          PY
      - name: Verify production firmware bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://bambuhelper-smart-display.netlify.app/firmware'
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-home-v7.1-validated.bin" -o /tmp/full.bin
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v7.1-OTA.bin" -o /tmp/ota.bin
          test "$(stat -c%s /tmp/full.bin)" = 2208400
          test "$(stat -c%s /tmp/ota.bin)" = 2142864
          echo '9f1cd4c103caad2378e2ff35e9562047030a8830ac2985e3ff9ab75f162b73fb  /tmp/full.bin' | sha256sum -c -
          echo '938e0764453b875f5770fa74c64805ea82f721581da0c84dce56db736050037c  /tmp/ota.bin' | sha256sum -c -
          echo 'production firmware bytes: PASS'
