name: BambuHelper ws_lcd_350 Smart Home v10.3.1 Browser Workshop OS RC2

on:
  push:
    branches: [evolve/v10-3-browser-workshop-os]
    paths:
      - 'apply_smart_home_screen_retention_v10_3_1.py'
      - '.github/workflows/bambuhelper-v10-3-1-screen-retention.yml'
  pull_request:
    branches: [evolve/v10-2-ui-polish]
    paths:
      - 'apply_smart_home_screen_retention_v10_3_1.py'
      - '.github/workflows/bambuhelper-v10-3-1-screen-retention.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-home-v10-3-1-screen-retention-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout evolution repository
        uses: actions/checkout@v4

      - name: Checkout pinned BambuHelper baseline
        uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate patch tooling
        run: |
          python -m py_compile apply_smart_home_hardware_v10_1.py apply_smart_home_ui_v10_2.py apply_smart_home_browser_v10_3.py apply_smart_home_screen_retention_v10_3_1.py
          bash -n scripts/apply_smart_home_stack.sh

      - name: Apply Smart Home stack through v10.1
        run: bash scripts/apply_smart_home_stack.sh upstream apply_smart_home_hardware_v10_1.py

      - name: Apply v10.2 physical UI polish
        run: python apply_smart_home_ui_v10_2.py --repo upstream --apply

      - name: Apply v10.3 browser Workshop OS
        run: python apply_smart_home_browser_v10_3.py --repo upstream --apply

      - name: Apply v10.3.1 screen-retention hotfix
        run: python apply_smart_home_screen_retention_v10_3_1.py --repo upstream --apply

      - name: Validate inherited device contracts
        run: python scripts/validate_device_contracts.py

      - name: Verify printer configuration cannot steal Workshop OS screens
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          main=Path('upstream/src/main.cpp').read_text()
          hub=Path('upstream/src/smart_hub.cpp').read_text()
          app=Path('upstream/web/app.js').read_text()
          build=Path('upstream/include/smart_home_build.h').read_text()
          board=Path('upstream/boards/ws_lcd_350.ini').read_text()
          backend=Path('upstream/src/buzzer_backend_es8311.cpp').read_text()
          web=Path('upstream/src/web_server.cpp').read_text()
          focal=Path('upstream/src/button_touch_focaltech.cpp').read_text()

          def need(body,n,label):
              if n not in body: raise SystemExit(f'MISSING {label}: {n}')

          need(build,'#define SMART_HOME_VERSION "v10.3.1"','hotfix version')
          need(build,'Smart Home v10.3.1 Browser Workshop OS RC2','hotfix label')
          need(main,'Smart Home v10.3.1 screen-retention contract.','routing guard')
          need(main,'if (smartHubIsScreen(current))','Smart Home ownership check')
          need(main,'smartHubShouldYieldToPrinter(printing)','yield contract')
          need(main,'if (isOtaAutoInProgress())','OTA preemption preserved')
          need(hub,'native Smart Home Printer is the normal live-print surface','native printer contract')
          need(hub,'return false;','legacy auto-yield disabled')
          need(app,"var SECTIONS = ['home','printer','workshop','display','hardware','wifi','power','diag','advanced'];",'browser route registry')

          # Preserve v10.3 browser, v10.2 physical UI, and v10.1 audio/mic.
          need(app,'function v103RefreshWorkshop','browser Workshop')
          need(hub,'drawHeader("MORE","TOOLS",3)','v10.2 More UI')
          need(hub,'AMS / FILAMENT','physical AMS/filament UI')
          for n in ['BOARD_HAS_ES8311_AUDIO=1','BOARD_HAS_MICROPHONE=1','AUDIO_I2S_DIN=14','AUDIO_PA_CTRL=-1']:
              need(board,n,'WS350 audio hardware')
          for n in ['I2S_MODE_RX','buzzerBackendMicLevel','AUDIO_PA_CTRL >= 0']:
              need(backend,n,'ES8311/mic backend')
          need(web,'handleAudioMicTest','mic diagnostic')
          need(web,'recoverySha256HexArrayBuffer','Safari-safe recovery')
          need(focal,'ft6336RecoverBus','touch recovery')
          print('v10.3.1 screen-retention contracts: PASS')
          PY

      - name: Validate browser JavaScript
        run: node --check upstream/web/app.js

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build WS350 v10.3.1
        working-directory: upstream
        run: pio run -e ws_lcd_350

      - name: Regression build shared 320x480 target
        working-directory: upstream
        run: pio run -e jc3248w535

      - name: Merge Full image
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full

      - name: Package v10.3.1 RC2 artifacts
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' | sort | tail -1)"
          APP='upstream/.pio/build/ws_lcd_350/firmware.bin'
          mkdir -p v10-3-1-artifacts/source-snapshot
          cp "$FULL" v10-3-1-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v10.3.1-Browser-Workshop-OS-RC2-Full.bin
          cp "$APP" v10-3-1-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v10.3.1-Browser-Workshop-OS-RC2-OTA.bin
          cp "$APP" v10-3-1-artifacts/WaveshareHome-firmware.bin
          for f in src/main.cpp src/smart_hub.cpp src/display_ui.cpp src/web_server.cpp src/web_template.cpp src/buzzer_backend_es8311.cpp src/button_touch_focaltech.cpp include/web_pages.h include/smart_home_build.h web/app.js web/app.css boards/ws_lcd_350.ini; do
            mkdir -p "v10-3-1-artifacts/source-snapshot/$(dirname "$f")"
            cp "upstream/$f" "v10-3-1-artifacts/source-snapshot/$f"
          done
          {
            echo 'BambuHelper ws_lcd_350 Smart Home v10.3.1 Browser Workshop OS RC2 validation'
            echo 'printer_configuration_screen_retention=PASS'
            echo 'smart_home_route_ownership=PASS'
            echo 'classic_printer_explicit_only=PASS'
            echo 'browser_workshop_route_registry=PASS'
            echo 'ota_preemption=PRESERVED'
            echo 'es8311_speaker=PRESERVED'
            echo 'microphone_i2s_rx=PRESERVED'
            echo 'v10_3_browser_workspace=PRESERVED'
            echo 'v10_2_physical_ui=PRESERVED'
            echo 'ft6336_reliability=PRESERVED'
            echo 'ws350_build=PASS'
            echo 'jc3248w535_regression=PASS'
            sha256sum v10-3-1-artifacts/*.bin
          } | tee v10-3-1-artifacts/validation-report-v10-3-1-screen-retention-rc2.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bambuhelper-ws_lcd_350-smart-home-v10-3-1-browser-workshop-os-rc2
          retention-days: 14
          if-no-files-found: error
          path: v10-3-1-artifacts/
