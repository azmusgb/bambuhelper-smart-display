name: Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository/release policy
        run: python3 scripts/validate_release.py

      - name: Validate release metadata JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('release.json'), Path('releases/current.json')]:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'{path}: PASS')
          PY

  merge-gate:
    if: github.event_name == 'pull_request'
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Determine required conditional workflow gates
        id: required
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(
            gh api --paginate "/repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename'
          )

          tooling_only=true
          for f in "${files[@]}"; do
            case "$f" in
              apply_*.py|scripts/*.py|scripts/*.sh|docs/*|*.md)
                ;;
              *)
                tooling_only=false
                break
                ;;
            esac
          done
          if [ "$tooling_only" = true ] && [ ${#files[@]} -gt 0 ]; then
            echo 'required=["Validate"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          required=("Validate")
          legacy_firmware_required=0
          settings_required=0
          static_required=0
          os12_required=0
          platform_required=0
          companion_required=0
          tooling_required=0

          for f in "${files[@]}"; do
            case "$f" in
              .github/workflows/firmware-candidate.yml|apply_smart_home_physical_fit_v11_19_1.py|apply_smart_home_portal_auth_v11_20.py|apply_smart_home_display_expert_v11_22.py|scripts/apply_workshop_os_v11_19.sh|scripts/apply_workshop_os_v11_19_1.sh|scripts/validate_device_contracts.py|scripts/validate_visual_contracts_v11_19.py|scripts/validate_rendered_fit_v11_19_1.py|scripts/validate_portal_auth_v11_20.py|scripts/validate_display_expert_v11_22.py|scripts/validate_settings_parity.py|scripts/capture-ws350-views.zsh)
                legacy_firmware_required=1
                ;;
            esac

            case "$f" in
              .github/workflows/ui13-appliance-settings.yml|apply_workshop_os_*.py|apply_smart_home_network_locale_layout_v11_23.py|apply_smart_home_touch_ux_v11_23_rc2_*.py|apply_smart_home_auth_restore_v11_23_rc2.py|firmware/ui-v11.25/*|firmware/ui-v11.25-*/*|firmware/ui-v11.26-ui11/*|firmware/ui-v11.27-ui12/*|firmware/ui-v11.28-ui13/*|assets/v11_25_*.css|scripts/run_rc10_local.sh|scripts/run_ui12_local.sh|scripts/run_ui13_local.sh|scripts/validate_ui12_control_center.py|scripts/validate_ui13_appliance_settings.py|scripts/validate_ui13_product_finish.py|docs/UI11_SOURCE_PROVENANCE.md|docs/UI12_CONTROL_CENTER.md|docs/UI13_APPLIANCE_SETTINGS.md)
                settings_required=1
                ;;
            esac

            case "$f" in
              release.json|build.py|index.html|app.js|firmware/*.bin|scripts/validate_release.py|.github/workflows/release-main.yml)
                static_required=1
                ;;
            esac

            case "$f" in
              .github/workflows/os12-ux-architecture.yml|apply_workshop_os12_*.py|contracts/*|contracts/**/*|firmware/platform/*|firmware/platform/**/*|firmware/ui-v11.25-rc10/*|firmware/ui-v11.25-rc10/**/*|firmware/ui-v11.26-ui11/*|firmware/ui-v11.26-ui11/**/*|firmware/ui-v11.27-ui12/*|firmware/ui-v11.27-ui12/**/*|firmware/ui-v11.28-ui13/*|firmware/ui-v11.28-ui13/**/*|scripts/ensure-platformio.sh|scripts/run_os12_platform_local.sh|scripts/run_os12_ux_local.sh|scripts/validate_os12_inventory_service.py|scripts/validate_os12_ux_architecture.py|scripts/validate_os12_ux_geometry.py|scripts/validate_os12_ux_physical_fit.py|scripts/validate_os12_ui_finish.py|scripts/validate_os12_product_surface.py|scripts/validate_os12_product_surface_complete.py|scripts/validate_os12_physical_acceptance_refinement.py|scripts/validate_os12_portal_login.py|scripts/validate_os12_portal_control_plane.py|scripts/validate_os12_visual_overhaul.py|scripts/validate_os12_post_capture_ui_hardening.py|scripts/validate_os12_workshop_surface_runtime.py|scripts/validate_os12_code_free_portal.py)
                os12_required=1
                ;;
            esac

            case "$f" in
              .github/workflows/os12-platform-bridge.yml|firmware/platform/*|firmware/platform/**/*|apply_workshop_os12_platform_bridge.py|apply_workshop_os12_media_hardware.py|apply_workshop_os12_media_capture.py|apply_workshop_os12_media_runtime.py|apply_workshop_os12_media_signal_hardening.py|apply_workshop_os12_mqtt_camera_telemetry.py|apply_workshop_os12_media_ui.py|apply_workshop_os12_media_api.py|apply_workshop_os12_non_destructive_controls.py|apply_workshop_os12_guarded_stop.py|apply_workshop_os12_portal_login_hardening.py|apply_workshop_os12_inventory_api.py|apply_workshop_os12_device_update.py|apply_workshop_os12_inventory_service.py|apply_workshop_os12_release_identity.py|scripts/run_os12_platform_local.sh|scripts/validate_os12_platform_bridge.py|scripts/validate_os12_media_hardware.py|scripts/validate_os12_media_capture.py|scripts/validate_os12_media_signal.py|scripts/validate_os12_mqtt_camera_telemetry.py|scripts/validate_os12_media_service.py|scripts/validate_os12_media_runtime.py|scripts/validate_os12_media_ui.py|scripts/validate_os12_media_api.py|scripts/validate_os12_non_destructive_controls.py|scripts/validate_os12_guarded_stop.py|scripts/validate_os12_control_boundary.py|scripts/validate_os12_portal_login.py|scripts/validate_os12_inventory_api.py|scripts/validate_os12_device_update.py|scripts/validate_os12_inventory_service.py|scripts/validate_os12_candidate_publisher.py|scripts/ensure-platformio.sh)
                platform_required=1
                ;;
            esac

            case "$f" in
              .github/workflows/companion-ios.yml|companion/*|companion/**/*|scripts/validate_companion_protocol.py)
                companion_required=1
                ;;
            esac

            case "$f" in
              .github/workflows/os12-tooling.yml|scripts/accept_os12_*.py|scripts/accept_os12_*.sh|scripts/bootstrap_ws350_os12_usb_macos.sh|scripts/capture-ws350-views.zsh|scripts/capture_os12_views_unattended.py|scripts/collect_os12_candidate_evidence_macos.sh|scripts/finalize_os12_evidence_bundle.py|scripts/verify_os12_evidence_bundle.py|scripts/test_os12_evidence_bundle.py|scripts/flash_os12_ci_candidate_macos.sh|scripts/install_accept_os12_candidate_macos.sh|scripts/prepare_os12_device_candidate.py|scripts/validate_os12_automatic_candidate.py|scripts/validate_os12_candidate_publisher.py|scripts/validate_os12_merge_gate.py|scripts/validate_os12_physical_acceptance.py|scripts/validate_os12_recovery_roundtrip.py|scripts/waveshare-usb.sh)
                tooling_required=1
                ;;
            esac
          done

          if (( legacy_firmware_required )); then
            required+=("Workshop OS Firmware Gate — v11.22 Display Expert RC1")
          fi
          if (( settings_required )); then
            required+=("Workshop OS UI13 Appliance Settings Gate")
          fi
          if (( static_required )); then
            required+=("Validate accepted static installer")
          fi
          if (( platform_required )); then
            required+=("Workshop OS 12 Platform Bridge")
          fi
          if (( os12_required )); then
            required+=("Workshop OS 12 UX Architecture")
          fi
          if (( companion_required )); then
            required+=("Workshop Companion iOS")
          fi
          if (( tooling_required )); then
            required+=("Workshop OS 12 Tooling Checks")
          fi

          printf '%s\n' "${required[@]}" | awk '!seen[$0]++' | jq -R . | jq -s -c . > required.json
          echo "required=$(cat required.json)" >> "$GITHUB_OUTPUT"

          echo "Changed paths:"
          printf '  %s\\n' "${files[@]}"
          echo "Required workflow gates:"
          jq -r '.[] | "  " + .' required.json

      - name: Wait for required workflow gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRED: ${{ steps.required.outputs.required }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t required < <(jq -r '.[]' <<< "$REQUIRED")

          # Never allow a transient/hung GitHub API request to pin the merge gate
          # until the 70-minute job timeout. Each poll is independently bounded and
          # retried, while gate semantics remain fail-closed.
          for attempt in $(seq 1 120); do
            echo "Merge Gate poll $attempt"

            if ! runs="$(timeout 30s gh api "/repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100")"; then
              rc=$?
              echo "  RETRY GitHub Actions API query failed or timed out (rc=$rc)"
              sleep 20
              continue
            fi

            all_passed=1
            for name in "${required[@]}"; do
              row="$(jq -c --arg n "$name" '[.workflow_runs[] | select(.name == $n)] | sort_by(.created_at) | last // empty' <<< "$runs")"
              if [[ -z "$row" ]]; then
                echo "  WAIT  $name — workflow run not present yet"
                all_passed=0
                continue
              fi

              status="$(jq -r '.status' <<< "$row")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$row")"
              url="$(jq -r '.html_url' <<< "$row")"

              if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
                echo "  PASS  $name"
              elif [[ "$status" == "completed" ]]; then
                echo "  FAIL  $name — conclusion=$conclusion"
                echo "        $url"
                exit 1
              else
                echo "  WAIT  $name — status=$status"
                all_passed=0
              fi
            done

            if (( all_passed )); then
              echo "Merge Gate: PASS"
              exit 0
            fi

            sleep 20
          done

          echo "Merge Gate: timed out waiting for required workflows" >&2
          exit 1
