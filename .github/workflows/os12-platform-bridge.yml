name: Workshop OS 12 Platform Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - feature/workshop-os12-device-platform-foundation
    paths:
      - 'firmware/platform/**'
      - 'apply_workshop_os12_platform_bridge.py'
      - 'apply_workshop_os12_media_hardware.py'
      - 'apply_workshop_os12_media_capture.py'
      - 'apply_workshop_os12_media_runtime.py'
      - 'apply_workshop_os12_media_signal_hardening.py'
      - 'apply_workshop_os12_mqtt_camera_telemetry.py'
      - 'apply_workshop_os12_media_ui.py'
      - 'apply_workshop_os12_media_api.py'
      - 'apply_workshop_os12_non_destructive_controls.py'
      - 'apply_workshop_os12_guarded_stop.py'
      - 'apply_workshop_os12_portal_login_hardening.py'
      - 'apply_workshop_os12_inventory_api.py'
      - 'apply_workshop_os12_device_update.py'
      - 'apply_workshop_os12_inventory_service.py'
      - 'apply_workshop_os12_release_identity.py'
      - 'scripts/ensure-platformio.sh'
      - 'scripts/run_os12_platform_local.sh'
      - 'scripts/validate_os12_platform_bridge.py'
      - 'scripts/validate_os12_media_hardware.py'
      - 'scripts/validate_os12_media_capture.py'
      - 'scripts/validate_os12_media_signal.py'
      - 'scripts/validate_os12_mqtt_camera_telemetry.py'
      - 'scripts/validate_os12_media_service.py'
      - 'scripts/validate_os12_media_runtime.py'
      - 'scripts/validate_os12_media_ui.py'
      - 'scripts/validate_os12_media_api.py'
      - 'scripts/validate_os12_non_destructive_controls.py'
      - 'scripts/validate_os12_guarded_stop.py'
      - 'scripts/validate_os12_control_boundary.py'
      - 'scripts/validate_os12_portal_login.py'
      - 'scripts/validate_os12_inventory_api.py'
      - 'scripts/validate_os12_device_update.py'
      - 'scripts/validate_os12_inventory_service.py'
      - 'scripts/validate_os12_candidate_publisher.py'
      - '.github/workflows/os12-platform-bridge.yml'
  pull_request:
    paths:
      - 'firmware/platform/**'
      - 'apply_workshop_os12_platform_bridge.py'
      - 'apply_workshop_os12_media_hardware.py'
      - 'apply_workshop_os12_media_capture.py'
      - 'apply_workshop_os12_media_runtime.py'
      - 'apply_workshop_os12_media_signal_hardening.py'
      - 'apply_workshop_os12_mqtt_camera_telemetry.py'
      - 'apply_workshop_os12_media_ui.py'
      - 'apply_workshop_os12_media_api.py'
      - 'apply_workshop_os12_non_destructive_controls.py'
      - 'apply_workshop_os12_guarded_stop.py'
      - 'apply_workshop_os12_portal_login_hardening.py'
      - 'apply_workshop_os12_inventory_api.py'
      - 'apply_workshop_os12_device_update.py'
      - 'apply_workshop_os12_inventory_service.py'
      - 'apply_workshop_os12_release_identity.py'
      - 'scripts/ensure-platformio.sh'
      - 'scripts/run_os12_platform_local.sh'
      - 'scripts/validate_os12_platform_bridge.py'
      - 'scripts/validate_os12_media_hardware.py'
      - 'scripts/validate_os12_media_capture.py'
      - 'scripts/validate_os12_media_signal.py'
      - 'scripts/validate_os12_mqtt_camera_telemetry.py'
      - 'scripts/validate_os12_media_service.py'
      - 'scripts/validate_os12_media_runtime.py'
      - 'scripts/validate_os12_media_ui.py'
      - 'scripts/validate_os12_media_api.py'
      - 'scripts/validate_os12_non_destructive_controls.py'
      - 'scripts/validate_os12_guarded_stop.py'
      - 'scripts/validate_os12_control_boundary.py'
      - 'scripts/validate_os12_portal_login.py'
      - 'scripts/validate_os12_inventory_api.py'
      - 'scripts/validate_os12_device_update.py'
      - 'scripts/validate_os12_inventory_service.py'
      - 'scripts/validate_os12_candidate_publisher.py'
      - '.github/workflows/os12-platform-bridge.yml'

permissions:
  contents: read

concurrency:
  group: os12-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Reconstruct and compile OS12 device platform
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OS12_RELEASE_VERSION: '12.8.0'
      OS12_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Classify platform impact
        id: impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # Manual and platform-foundation pushes retain the complete regression
          # build. Pull requests may take the fast path when every newly pushed
          # platform change is presentation-only under firmware/platform/ui/**.
          #
          # On PR open/reopen we classify the full PR. On synchronize we classify
          # only before -> head so an earlier workflow-file change in the same PR
          # does not permanently force every later UI commit through a second build.
          full_build=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            full_build=false
            diff_base="$BASE_SHA"
            if [[ "$ACTION" == "synchronize" && -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              diff_base="$BEFORE_SHA"
            fi

            echo "Classifying Platform Bridge delta: $diff_base..$HEAD_SHA"
            mapfile -t files < <(git diff --name-only "$diff_base" "$HEAD_SHA")

            for f in "${files[@]}"; do
              case "$f" in
                firmware/platform/ui/*|firmware/platform/ui/**/*)
                  # UX Architecture is the authoritative exact-head compiler for
                  # these files, so Platform Bridge need not compile them twice.
                  ;;
                firmware/platform/*|firmware/platform/**/*|\
                apply_workshop_os12_platform_bridge.py|\
                apply_workshop_os12_media_hardware.py|\
                apply_workshop_os12_media_capture.py|\
                apply_workshop_os12_media_runtime.py|\
                apply_workshop_os12_media_signal_hardening.py|\
                apply_workshop_os12_mqtt_camera_telemetry.py|\
                apply_workshop_os12_media_ui.py|\
                apply_workshop_os12_media_api.py|\
                apply_workshop_os12_non_destructive_controls.py|\
                apply_workshop_os12_guarded_stop.py|\
                apply_workshop_os12_portal_login_hardening.py|\
                apply_workshop_os12_inventory_api.py|\
                apply_workshop_os12_device_update.py|\
                apply_workshop_os12_inventory_service.py|\
                apply_workshop_os12_release_identity.py|\
                scripts/ensure-platformio.sh|\
                scripts/run_os12_platform_local.sh|\
                scripts/validate_os12_platform_bridge.py|\
                scripts/validate_os12_media_hardware.py|\
                scripts/validate_os12_media_capture.py|\
                scripts/validate_os12_media_signal.py|\
                scripts/validate_os12_mqtt_camera_telemetry.py|\
                scripts/validate_os12_media_service.py|\
                scripts/validate_os12_media_runtime.py|\
                scripts/validate_os12_media_ui.py|\
                scripts/validate_os12_media_api.py|\
                scripts/validate_os12_non_destructive_controls.py|\
                scripts/validate_os12_guarded_stop.py|\
                scripts/validate_os12_control_boundary.py|\
                scripts/validate_os12_portal_login.py|\
                scripts/validate_os12_inventory_api.py|\
                scripts/validate_os12_device_update.py|\
                scripts/validate_os12_inventory_service.py|\
                scripts/validate_os12_candidate_publisher.py|\
                .github/workflows/os12-platform-bridge.yml)
                  full_build=true
                  break
                  ;;
                *)
                  # Files outside the Platform Bridge trigger surface do not make
                  # this workflow responsible for a second firmware build.
                  ;;
              esac
            done
          fi

          echo "full_build=$full_build" >> "$GITHUB_OUTPUT"
          echo "Platform full build required: $full_build"

      - name: Record UI-only platform fast path
        if: steps.impact.outputs.full_build != 'true'
        run: |
          echo 'Platform Bridge fast path: presentation-only firmware/platform/ui changes detected.'
          echo 'The Workshop OS 12 UX Architecture workflow remains responsible for exact-head reconstruction, WS350 compile, cross-board compile, artifact identity, and X2D regression.'

      - name: Cache pinned PlatformIO toolchain
        if: steps.impact.outputs.full_build == 'true'
        uses: actions/cache@v5
        with:
          path: .workshop-tools
          key: platformio-${{ runner.os }}-${{ hashFiles('scripts/ensure-platformio.sh', 'upstream/platformio.ini') }}

      - name: Prepare pinned PlatformIO toolchain
        if: steps.impact.outputs.full_build == 'true'
        run: |
          set -euo pipefail
          PIO_BIN="$(ROOT="$PWD" bash scripts/ensure-platformio.sh)"
          "$PIO_BIN" --version
          "$(dirname "$PIO_BIN")/python" --version

      - name: Validate device-native update source contract
        run: python3 scripts/validate_os12_device_update.py --source-root .

      - name: Validate candidate publication safety
        run: python3 scripts/validate_os12_candidate_publisher.py

      - name: Validate media service contracts
        run: python3 scripts/validate_os12_media_service.py

      - name: Reconstruct UI13 and apply OS12 platform
        if: steps.impact.outputs.full_build == 'true'
        run: BUILD=/tmp/ws350-os12-platform-build bash scripts/run_os12_platform_local.sh --build

      - name: Validate runtime acceptance helper syntax
        run: |
          python3 -m py_compile \
            scripts/accept_os12_portal_runtime.py \
            scripts/accept_os12_update_runtime.py \
            scripts/accept_os12_media_runtime.py \
            scripts/accept_os12_media_physical.py \
            scripts/accept_os12_device_ui_physical.py \
            scripts/accept_os12_unattended.py

      - name: Validate USB/bootstrap helper syntax
        run: |
          bash -n scripts/ensure-platformio.sh
          bash -n scripts/waveshare-usb.sh
          bash -n scripts/bootstrap_ws350_os12_usb_macos.sh

      - name: Record intermediate platform-regression build identity
        if: steps.impact.outputs.full_build == 'true'
        run: |
          set -euo pipefail
          BUILD=/tmp/ws350-os12-platform-build
          SOURCE="$BUILD/.pio/build/ws_lcd_350/firmware.bin"
          test -s "$SOURCE"

          OUT=/tmp/workshop-os12-platform-regression-evidence
          rm -rf "$OUT"
          mkdir -p "$OUT"
          FW_SHA="$(sha256sum "$SOURCE" | awk '{print $1}')"
          FW_SIZE="$(stat -c '%s' "$SOURCE")"

          {
            echo "release_state=intermediate-regression-built-tested-ci-only"
            echo "release_version=${OS12_RELEASE_VERSION}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "source_sha=${OS12_SOURCE_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "board=ws_lcd_350"
            echo "artifact_role=platform-regression-evidence"
            echo "physical_candidate=false"
            echo "flashable_artifact_published=false"
            echo "physical_candidate_authority=.github/workflows/os12-ux-architecture.yml"
            echo "intermediate_firmware_sha256=$FW_SHA"
            echo "intermediate_firmware_size=$FW_SIZE"
            echo "full_image=false"
            echo "device_native_update_service=true"
            echo "media_service=true"
            echo "filament_inventory_device_feed_v1=true"
            echo "filament_inventory_device_credential=revocable-read-only"
            echo "media_ui=true"
            echo "media_recording=bounded-five-second"
            echo "media_signal_hardening=analog-mic-route-gain-diagnostics"
            echo "media_video=ws350-owned-demo-plus-source-scoped-printer-camera"
            echo "printer_camera_telemetry=read-only-mqtt"
            echo "media_physical_acceptance=false"
            echo "legacy_url_auto_ota_route=false"
            echo "physical_acceptance=false"
            echo
            grep -E 'SMART_HOME_BUILD_LABEL|SMART_HOME_PROFILE|WORKSHOP_OS_UI_SCHEMA|WORKSHOP_OS_V11_28_UI13|WORKSHOP_OS12_DEVICE_UPDATE|WORKSHOP_OS_RELEASE_VERSION|WORKSHOP_OS_SOURCE_SHA' \
              "$BUILD/include/smart_home_build.h" || true
          } > "$OUT/BUILD-INFO.txt"

          cat "$OUT/BUILD-INFO.txt"

      - name: Upload platform-regression evidence
        if: steps.impact.outputs.full_build == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: workshop-os12-platform-regression-evidence-${{ env.OS12_SOURCE_SHA }}
          path: /tmp/workshop-os12-platform-regression-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Record non-promotion state
        if: always()
        run: |
          if [[ "${{ steps.impact.outputs.full_build }}" == "true" ]]; then
            echo 'This workflow proves the intermediate platform reconstruction/build only and publishes metadata evidence, not a flashable firmware candidate.'
          else
            echo 'This workflow took the UI-only fast path and intentionally did not repeat the authoritative UX Architecture firmware build.'
          fi
          echo 'Media speaker/microphone/recording capability is not physically accepted by this workflow.'
          echo 'WS350 analog microphone signal-path hardening is implemented/tested but requires physical acceptance.'
          echo 'WS350-owned demo video and read-only printer camera telemetry are implemented/built/tested; physical video acceptance is not established by CI.'
          echo 'The OS12 UX Architecture workflow is the sole CI authority for the flashable physical-acceptance candidate.'
          echo 'This workflow does not upload firmware.bin and does not publish anything into the device discovery manifest.'
          echo 'It does not establish runtime, physical, accepted, or stable state.'

  pi-preflight:
    name: Pi fast preflight
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.WORKSHOP_PI_RUNNER == 'enabled'
    runs-on: [self-hosted, linux, ARM64, workshop-pi]
    timeout-minutes: 20
    env:
      OS12_RELEASE_VERSION: '12.8.0'
      OS12_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_NAME"
          uname -a
          python3 --version
          g++ --version | head -1
          echo "Source SHA: $OS12_SOURCE_SHA"

      - name: Validate fast Python contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/validate_os12_premium_ui_v2.py \
            scripts/validate_os12_touch_audio_fit.py \
            scripts/validate_os12_glance_legibility.py \
            scripts/test_x2d_bridge_camera.py
          python3 scripts/validate_os12_premium_ui_v2.py --repo .
          git diff --check origin/main...HEAD

      - name: Build and run tabs layout smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workshop-preflight"
          g++ \
            -std=c++11 \
            -O1 \
            -Wall \
            -Wextra \
            -Werror \
            -pedantic \
            tests/workshop_os12_tabs_layout_smoke.cpp \
            -o "$RUNNER_TEMP/workshop-preflight/tabs-layout-smoke"
          "$RUNNER_TEMP/workshop-preflight/tabs-layout-smoke"

      - name: Build and run More layout smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workshop-preflight"
          g++ \
            -std=c++11 \
            -O1 \
            -Wall \
            -Wextra \
            -Werror \
            -pedantic \
            tests/workshop_os12_more_layout_smoke.cpp \
            -o "$RUNNER_TEMP/workshop-preflight/more-layout-smoke"
          "$RUNNER_TEMP/workshop-preflight/more-layout-smoke"

      - name: Run X2D bridge unit tests
        run: python3 scripts/test_x2d_bridge_camera.py

      - name: Record preflight result
        if: always()
        shell: bash
        run: |
          echo 'Pi preflight is an accelerator only.'
          echo 'It does not replace the GitHub-hosted UX Architecture exact-head candidate authority.'
          echo 'No physical acceptance or stable promotion is established here.'
