name: Workshop OS 12 Platform Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - feature/workshop-os12-device-platform-foundation
    paths:
      - 'firmware/platform/**'
      - 'apply_workshop_os12_platform_bridge.py'
      - 'apply_workshop_os12_non_destructive_controls.py'
      - 'apply_workshop_os12_guarded_stop.py'
      - 'apply_workshop_os12_portal_login_hardening.py'
      - 'scripts/run_os12_platform_local.sh'
      - 'scripts/validate_os12_platform_bridge.py'
      - 'scripts/validate_os12_non_destructive_controls.py'
      - 'scripts/validate_os12_guarded_stop.py'
      - 'scripts/validate_os12_control_boundary.py'
      - 'scripts/validate_os12_portal_login.py'
      - 'scripts/accept_os12_portal_runtime.py'
      - 'docs/WORKSHOP_OS12_DEVICE_PLATFORM.md'
      - '.github/workflows/os12-platform-bridge.yml'
  pull_request:
    paths:
      - 'firmware/platform/**'
      - 'apply_workshop_os12_platform_bridge.py'
      - 'apply_workshop_os12_non_destructive_controls.py'
      - 'apply_workshop_os12_guarded_stop.py'
      - 'apply_workshop_os12_portal_login_hardening.py'
      - 'scripts/run_os12_platform_local.sh'
      - 'scripts/validate_os12_platform_bridge.py'
      - 'scripts/validate_os12_non_destructive_controls.py'
      - 'scripts/validate_os12_guarded_stop.py'
      - 'scripts/validate_os12_control_boundary.py'
      - 'scripts/validate_os12_portal_login.py'
      - 'scripts/accept_os12_portal_runtime.py'
      - 'docs/WORKSHOP_OS12_DEVICE_PLATFORM.md'
      - '.github/workflows/os12-platform-bridge.yml'

permissions:
  contents: read

jobs:
  build:
    name: Reconstruct and compile OS12 control bridge
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO
        run: |
          python3 -m pip install --upgrade platformio
          pio --version

      - name: Reconstruct UI13 and apply OS12 bridge
        run: BUILD=/tmp/ws350-os12-platform-build bash scripts/run_os12_platform_local.sh --build

      - name: Validate portal runtime helper syntax
        run: python3 -m py_compile scripts/accept_os12_portal_runtime.py

      - name: Package exact-head WS350 OTA candidate
        run: |
          set -euo pipefail
          BUILD=/tmp/ws350-os12-platform-build
          SOURCE="$BUILD/.pio/build/ws_lcd_350/firmware.bin"
          test -s "$SOURCE"

          OUT=/tmp/workshop-os12-ws350-ota
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$SOURCE" "$OUT/Workshop-OS12-WS350-${GITHUB_SHA}.bin"
          (
            cd "$OUT"
            sha256sum "Workshop-OS12-WS350-${GITHUB_SHA}.bin" > SHA256SUMS.txt
          )

          {
            echo "release_state=built-tested-candidate-only"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "head_sha=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "board=ws_lcd_350"
            echo "artifact_type=OTA/application image"
            echo "full_image=false"
            echo "physical_acceptance=false"
            echo
            grep -E 'SMART_HOME_BUILD_LABEL|SMART_HOME_PROFILE|WORKSHOP_OS_UI_SCHEMA|WORKSHOP_OS_V11_28_UI13' \
              "$BUILD/include/smart_home_build.h" || true
          } > "$OUT/BUILD-INFO.txt"

          cat "$OUT/SHA256SUMS.txt"
          cat "$OUT/BUILD-INFO.txt"

      - name: Upload exact-head WS350 OTA candidate
        uses: actions/upload-artifact@v4
        with:
          name: workshop-os12-ws350-ota-${{ github.sha }}
          path: /tmp/workshop-os12-ws350-ota/
          if-no-files-found: error
          retention-days: 14

      - name: Record non-promotion state
        if: always()
        run: |
          echo 'This workflow proves buildability and publishes a candidate OTA artifact only.'
          echo 'It does not establish runtime, physical, accepted, or stable state.'
