name: BambuHelper ws_lcd_350 Smart Home v9.6 Ultimate Experience

on:
  push:
    branches: [evolve/v9-6-ultimate-experience]
    paths:
      - 'apply_smart_home_ultimate_v9_6.py'
      - 'apply_smart_home_touch_nav_v9_6_1.py'
      - 'apply_smart_home_experience_v9_5.py'
      - '.github/workflows/bambuhelper-v9-6-ultimate.yml'
      - 'scripts/validate_device_contracts.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-home-v9-6-ultimate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout evolution repository
        uses: actions/checkout@v4

      - name: Checkout pinned BambuHelper baseline
        uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rehydrate v1-v7.2 patch stack
        shell: bash
        run: |
          set -euo pipefail
          v1=https://raw.githubusercontent.com/azmusgb/filamentinventory/741a6f0651fb4e20d8e2674f2c0ce726b0d7bdf9/.bambuhelper-validation
          v3=https://raw.githubusercontent.com/azmusgb/filamentinventory/07ce909fa7dd485abfc556eaf9addfbbd82e3cb3/.bambuhelper-validation
          v6=https://raw.githubusercontent.com/azmusgb/filamentinventory/c1a6cdf389be14b18f26eecefd5c5a62b5d1e7dc/.bambuhelper-validation
          v72=https://raw.githubusercontent.com/azmusgb/bambuhelper-smart-display/smart-home-v7-2-display-stability
          curl -fsSL "$v1/installer.zlib.b64" -o /tmp/installer.b64
          for n in 0 1 2 3; do curl -fsSL "$v1/device.part$n" -o "/tmp/device.part$n"; done
          cat /tmp/device.part{0,1,2,3} > /tmp/device.b64
          curl -fsSL "$v3/v2.zlib.b64" -o /tmp/v2.b64
          curl -fsSL "$v3/v3.zlib.b64" -o /tmp/v3.b64
          curl -fsSL "$v6/v4.zlib.b64" -o /tmp/v4.b64
          curl -fsSL "$v6/v5.zlib.b64" -o /tmp/v5.b64
          curl -fsSL "$v6/v6.zlib.b64" -o /tmp/v6.b64
          curl -fsSL "$v72/.bambuhelper-validation/v7-home.zlib.b64" -o /tmp/v7-home.b64
          curl -fsSL "$v72/apply_smart_home_ux_v7_1.py" -o apply_smart_home_ux_v7_1.py
          curl -fsSL "$v72/apply_smart_home_display_stability_v7_2.py" -o apply_smart_home_display_stability_v7_2.py
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          pairs=[
            ('/tmp/installer.b64','apply_installer_evolution.py'),('/tmp/device.b64','apply_device_onboarding_evolution.py'),
            ('/tmp/v2.b64','apply_resilience_evolution_v2.py'),('/tmp/v3.b64','apply_smart_profiles_evolution_v3.py'),
            ('/tmp/v4.b64','apply_ws350_remote_dashboard_v4.py'),('/tmp/v5.b64','apply_commissioning_evolution_v5.py'),
            ('/tmp/v6.b64','apply_smart_display_platform_v6.py'),('/tmp/v7-home.b64','apply_smart_home_navigation_v7.py')]
          for src,dst in pairs:
              Path(dst).write_bytes(zlib.decompress(base64.b64decode(Path(src).read_text().strip())))
          PY

      - name: Repair historical v3 patcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apply_smart_profiles_evolution_v3.py')
          text=p.read_text()
          needle='"app/profile-account-selection",'
          pos=text.find(needle)
          if pos>=0:
              start=text.rfind('    text = replace_once(',0,pos)
              end=text.find('\n    )',pos)
              if min(start,end)<0: raise SystemExit('v3 repair anchor malformed')
              end += len('\n    )')
              replacement="""    profile_refresh_anchor = '''  updatePrinterOnboarding();\n  refreshPrinterHealth(false);'''\n    profile_refresh_count = text.count(profile_refresh_anchor)\n    if profile_refresh_count < 1:\n        raise PatchError(\"app/profile-context-refresh: expected at least one v2 refresh anchor\")\n    text = text.replace(profile_refresh_anchor, '''  updatePrinterOnboarding();\n  refreshGaugeProfileUi();\n  refreshPrinterHealth(false);''')"""
              p.write_text(text[:start]+replacement+text[end:])
          PY
          python -m py_compile apply_*.py scripts/validate_device_contracts.py

      - name: Apply complete RC3 + v9.5 + v9.6 RC2 stack
        shell: bash
        run: |
          set -euo pipefail
          python apply_installer_evolution.py --repo upstream --apply
          python apply_device_onboarding_evolution.py --repo upstream --apply
          python apply_resilience_evolution_v2.py --repo upstream --apply
          python apply_smart_profiles_evolution_v3.py --repo upstream --apply
          python apply_ws350_remote_dashboard_v4.py --repo upstream --apply
          python apply_commissioning_evolution_v5.py --repo upstream --apply
          python apply_smart_display_platform_v6.py --repo upstream --apply
          python apply_smart_home_navigation_v7.py --repo upstream --apply
          python apply_smart_home_ux_v7_1.py --repo upstream --apply
          python apply_smart_home_display_stability_v7_2.py --repo upstream --apply
          python apply_smart_home_hardening_v8.py --repo upstream --apply
          python apply_smart_home_hardening_v8_1.py --repo upstream --apply
          python apply_smart_home_visual_v9.py --repo upstream --apply
          python apply_smart_home_print_ui_v9.py --repo upstream --apply
          python apply_smart_home_reliability_v9_1.py --repo upstream --apply
          python apply_smart_home_evolution_v9_2.py --repo upstream --apply
          python apply_smart_home_dev_unlock_v9_3.py --repo upstream --apply
          python apply_smart_home_recovery_v9_4.py --repo upstream --apply
          python apply_smart_home_recovery_hardening_v9_4_1.py --repo upstream --apply
          python apply_smart_home_recovery_entry_v9_4_2.py --repo upstream --apply
          python apply_smart_home_experience_v9_5.py --repo upstream --apply
          python apply_smart_home_ultimate_v9_6.py --repo upstream --apply
          python apply_smart_home_touch_nav_v9_6_1.py --repo upstream --apply

      - name: Validate inherited device contracts
        run: python scripts/validate_device_contracts.py

      - name: Verify v9.6 RC2 experience and RC3 safety contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          hub=Path('upstream/src/smart_hub.cpp').read_text()
          hubh=Path('upstream/src/smart_hub.h').read_text()
          app=Path('upstream/web/app.js').read_text()
          rec=Path('upstream/src/recovery_manager.cpp').read_text()
          web=Path('upstream/src/web_server.cpp').read_text()
          sec=Path('upstream/src/security_manager.cpp').read_text()
          settings=Path('upstream/src/settings.cpp').read_text()
          board=Path('upstream/boards/ws_lcd_350.ini').read_text()
          button=Path('upstream/src/button.cpp').read_text()
          buttonh=Path('upstream/src/button.h').read_text()
          touchh=Path('upstream/src/button_touch_backend.h').read_text()
          focal=Path('upstream/src/button_touch_focaltech.cpp').read_text()
          main=Path('upstream/src/main.cpp').read_text()
          def need(body, needle, label):
              if needle not in body: raise SystemExit(f'MISSING {label}: {needle}')
          def forbid(body, needle, label):
              if needle in body: raise SystemExit(f'FORBIDDEN {label}: {needle}')
          for n in ['drawAmbientHome','tap to wake  •  local-first','g_ambientHome = true','uiWidgetSignature','DEVELOPMENT UNLOCKED','RECOVERY FOUNDATION','doc["widgets"]','"gauge"']:
              need(hub,n,'v9.6 hub')
          for n in ['smartHubHandleTouch','SmartHub nav touch raw=','direct footer taps select pages']:
              need(hub,n,'RC2 direct navigation')
          need(hubh,'smartHubHandleTouch(int16_t rawX, int16_t rawY)','RC2 hub API')
          for n in ['Smart Home v9.6 Ultimate Experience Studio','Print Focus','Device Care','ccV96SetDensity']:
              need(app,n,'v9.6 browser')
          for n in ['int16_t x;','int16_t y;','bool hasPoint;']:
              need(touchh,n,'coordinate touch contract')
          for n in ['FT5X06_P1_XH_REG','ft5x06ReadPoint','return {TouchEvent::None, true, x, y, true}']:
              need(focal,n,'FT6336 point capture')
          need(button,'buttonLastTouchPoint','button coordinate cache')
          need(buttonh,'buttonLastTouchPoint(int16_t* x, int16_t* y)','button coordinate API')
          for n in ['buttonLastTouchPoint(&touchX, &touchY)','smartHubHandleTouch(touchX, touchY)']:
              need(main,n,'main direct-nav dispatch')
          for n in ['kCandidateMaxAttempts = 3','recoveryMarkWebReady','esp_ota_set_boot_partition']:
              need(rec,n,'RC3 recovery')
          for n in ['/recovery/status','/recovery/rollback','Download Settings Backup']:
              need(web,n,'RC3 web recovery')
          need(sec,'if (!portalAuthRequired()) return true;','development unlock')
          need(settings,'buttonType = BTN_TOUCHSCREEN;','touch guard')
          forbid(web,'client.setInsecure();','TLS downgrade')
          forbid(board,'-D ENABLE_OTA_AUTO=1','unsafe auto OTA')
          print('v9.6 Ultimate Experience RC2 + direct touch nav + RC3 recovery contracts: PASS')
          PY

      - name: Validate browser JavaScript
        run: node --check upstream/web/app.js

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build WS350
        working-directory: upstream
        run: pio run -e ws_lcd_350

      - name: Regression build shared 320x480 target
        working-directory: upstream
        run: pio run -e jc3248w535

      - name: Merge Full image
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full

      - name: Package v9.6 Ultimate Experience RC2 artifacts
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' | sort | tail -1)"
          APP='upstream/.pio/build/ws_lcd_350/firmware.bin'
          mkdir -p v9.6-artifacts/source-snapshot
          cp "$FULL" v9.6-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v9.6-Ultimate-Experience-RC2-Full.bin
          cp "$APP" v9.6-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v9.6-Ultimate-Experience-RC2-OTA.bin
          cp "$APP" v9.6-artifacts/WaveshareHome-firmware.bin
          cp upstream/src/smart_hub.cpp v9.6-artifacts/source-snapshot/smart_hub.cpp
          cp upstream/src/smart_hub.h v9.6-artifacts/source-snapshot/smart_hub.h
          cp upstream/src/main.cpp v9.6-artifacts/source-snapshot/main.cpp
          cp upstream/src/recovery_manager.cpp v9.6-artifacts/source-snapshot/recovery_manager.cpp
          cp upstream/src/web_server.cpp v9.6-artifacts/source-snapshot/web_server.cpp
          cp upstream/src/wifi_manager.cpp v9.6-artifacts/source-snapshot/wifi_manager.cpp
          cp upstream/src/security_manager.cpp v9.6-artifacts/source-snapshot/security_manager.cpp
          cp upstream/src/settings.cpp v9.6-artifacts/source-snapshot/settings.cpp
          cp upstream/src/button.cpp v9.6-artifacts/source-snapshot/button.cpp
          cp upstream/src/button.h v9.6-artifacts/source-snapshot/button.h
          cp upstream/src/button_touch_backend.h v9.6-artifacts/source-snapshot/button_touch_backend.h
          cp upstream/src/button_touch_focaltech.cpp v9.6-artifacts/source-snapshot/button_touch_focaltech.cpp
          cp upstream/include/smart_home_build.h v9.6-artifacts/source-snapshot/smart_home_build.h
          cp upstream/web/app.js v9.6-artifacts/source-snapshot/app.js
          {
            echo 'BambuHelper ws_lcd_350 Smart Home v9.6 Ultimate Experience RC2'
            echo 'ambient_standby=PASS'
            echo 'ambient_tap_to_wake=PASS'
            echo 'differential_widget_rendering=PASS'
            echo 'custom_widget_gauge_progress_status=PASS'
            echo 'browser_experience_studio=PASS'
            echo 'ft6336_coordinate_capture=PASS'
            echo 'direct_touch_bottom_navigation=PASS'
            echo 'tap_cycle_fallback_preserved=PASS'
            echo 'recovery_foundation_preserved=PASS'
            echo 'portal_auth_required=NO_DEVELOPMENT_BUILD'
            echo 'ws350_build=PASS'
            echo 'jc3248w535_regression=PASS'
            echo 'physical_acceptance=REQUIRED'
            sha256sum v9.6-artifacts/*.bin
          } | tee v9.6-artifacts/validation-report-v9.6-ultimate-experience-rc2.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bambuhelper-ws_lcd_350-smart-home-v9.6-ultimate-experience-rc2
          retention-days: 14
          if-no-files-found: error
          path: v9.6-artifacts/
