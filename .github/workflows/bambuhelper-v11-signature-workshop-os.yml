name: BambuHelper ws_lcd_350 Smart Home v11 Signature Workshop OS RC1

on:
  push:
    branches: [evolve/v11-signature-workshop-os]
    paths:
      - 'apply_smart_home_signature_v11.py'
      - '.bambuhelper-validation/v11_signature.zlib.b64'
      - '.github/workflows/bambuhelper-v11-signature-workshop-os.yml'
  pull_request:
    branches: [evolve/v10-6-audio-home]
    paths:
      - 'apply_smart_home_signature_v11.py'
      - '.bambuhelper-validation/v11_signature.zlib.b64'
      - '.github/workflows/bambuhelper-v11-signature-workshop-os.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-home-v11-signature-workshop-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout evolution repository
        uses: actions/checkout@v4

      - name: Checkout pinned BambuHelper baseline
        uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate patch tooling
        run: |
          python -m py_compile \
            apply_smart_home_hardware_v10_1.py \
            apply_smart_home_ui_v10_2.py \
            apply_smart_home_browser_v10_3.py \
            apply_smart_home_screen_retention_v10_3_1.py \
            apply_smart_home_portal_v10_4.py \
            apply_smart_home_home_v10_4_1.py \
            apply_smart_home_physical_v10_5.py \
            apply_smart_home_audio_home_v10_6.py \
            apply_smart_home_signature_v11.py
          bash -n scripts/apply_smart_home_stack.sh

      - name: Apply Smart Home stack through v10.1
        run: bash scripts/apply_smart_home_stack.sh upstream apply_smart_home_hardware_v10_1.py

      - name: Apply v10.2 physical UI polish
        run: python apply_smart_home_ui_v10_2.py --repo upstream --apply

      - name: Apply v10.3 browser Workshop OS
        run: python apply_smart_home_browser_v10_3.py --repo upstream --apply

      - name: Apply v10.3.1 screen-retention hotfix
        run: python apply_smart_home_screen_retention_v10_3_1.py --repo upstream --apply

      - name: Apply v10.4 portal UX
        run: python apply_smart_home_portal_v10_4.py --repo upstream --apply

      - name: Apply v10.4.1 workshop-first browser Home
        run: python apply_smart_home_home_v10_4_1.py --repo upstream --apply

      - name: Apply v10.5 Physical Workshop OS
        run: python apply_smart_home_physical_v10_5.py --repo upstream --apply

      - name: Apply v10.6 Audio + Home
        run: python apply_smart_home_audio_home_v10_6.py --repo upstream --apply

      - name: Apply v11 Signature Workshop OS
        run: python apply_smart_home_signature_v11.py --repo upstream --apply

      - name: Validate inherited device contracts
        run: python scripts/validate_device_contracts.py

      - name: Verify v11 signature experience and inherited contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          hub=Path('upstream/src/smart_hub.cpp').read_text()
          settings=Path('upstream/src/settings.cpp').read_text()
          backend=Path('upstream/src/buzzer_backend_es8311.cpp').read_text()
          backend_h=Path('upstream/src/buzzer_backend.h').read_text()
          web=Path('upstream/src/web_server.cpp').read_text()
          build=Path('upstream/include/smart_home_build.h').read_text()
          board=Path('upstream/boards/ws_lcd_350.ini').read_text()
          main=Path('upstream/src/main.cpp').read_text()
          focal=Path('upstream/src/button_touch_focaltech.cpp').read_text()
          app=Path('upstream/web/app.js').read_text()
          css=Path('upstream/web/app.css').read_text()

          def need(body,n,label):
              if n not in body: raise SystemExit(f'MISSING {label}: {n}')
          def forbid(body,n,label):
              if n in body: raise SystemExit(f'FORBIDDEN {label}: {n}')

          need(build,'#define SMART_HOME_VERSION "v11.0"','v11 version')
          need(build,'#define SMART_HOME_PROFILE "signature-workshop-os"','v11 profile')
          need(build,'Smart Home v11.0 Signature Workshop OS RC1','v11 build label')

          for n in ['uiSignatureHero','uiSignatureMaterialRail','uiSignaturePrinterCard','uiSignatureServiceChip']:
              need(hub,n,'signature Home helper')
          for n in ['WORKSHOP READY','PRINT IN PROGRESS','FILAMENT LOW','PRINTER NEEDS ATTENTION','NETWORK OFFLINE']:
              need(hub,n,'adaptive Home hero')
          for n in ['"NETWORK"','"AUDIO"','"RECOVERY"']:
              need(hub,n,'service rail')
          for n in ['BLACK','WHITE','ORANGE','PURPLE']:
              need(hub,n,'material color identity')

          for n in ['SPEAKER TEST','MIC ECHO','EVENTS ON','EVENTS OFF','hubSystemActionRect(2)','saveBuzzerSettings()']:
              need(hub,n,'Audio Lab/event sound control')
          need(settings,'prefs.getBool("buz_on", true)','WS350 event sounds default on')
          for n in ['buzzerBackendMicEcho','MALLOC_CAP_SPIRAM']:
              need(backend,n,'mic echo backend')
          need(backend_h,'buzzerBackendMicEcho','mic echo API')
          need(web,'handleAudioMicEcho','browser mic echo')

          for n in ['AMS / FILAMENT','LOADED MATERIAL','uiLoadedTray','uiLoadedFilamentLow']:
              need(hub,n,'materials-first Workshop')
          forbid(hub,'"CLASSIC DETAILS"','Printer Classic action')
          need(hub,'uiPrinterStateLabel','canonical printer state')
          need(hub,'const char* globalState = online ? "ONLINE" : "OFFLINE";','global header state')

          need(css,'Smart Home v11 Signature Workshop OS','signature browser CSS')
          need(app,"var HH_WIDGET_KEY='waveshare_home_v1041';",'browser Home module')

          need(main,'Smart Home v10.3.1 screen-retention contract.','screen retention')
          need(main,'if (!smartHubShouldYieldToPrinter(printing))','screen route guard')
          for n in ['BOARD_HAS_ES8311_AUDIO=1','BOARD_HAS_MICROPHONE=1','AUDIO_I2S_DIN=14','AUDIO_PA_CTRL=-1']:
              need(board,n,'WS350 audio hardware')
          need(web,'recoverySha256HexArrayBuffer','Safari-safe recovery')
          need(focal,'ft6336RecoverBus','FT6336 recovery')

          forbid(build,'Smart Home v10.6 Audio + Home RC1','old build label')
          print('v11 Signature Workshop OS contracts: PASS')
          PY

      - name: Validate browser JavaScript
        run: node --check upstream/web/app.js

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build WS350 v11
        working-directory: upstream
        run: pio run -e ws_lcd_350

      - name: Regression build shared 320x480 target
        working-directory: upstream
        run: pio run -e jc3248w535

      - name: Merge Full image
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full

      - name: Package v11 Signature Workshop OS RC1 artifacts
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' | sort | tail -1)"
          APP='upstream/.pio/build/ws_lcd_350/firmware.bin'
          mkdir -p v11-artifacts/source-snapshot
          cp "$FULL" v11-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v11.0-Signature-Workshop-OS-RC1-Full.bin
          cp "$APP" v11-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v11.0-Signature-Workshop-OS-RC1-OTA.bin
          cp "$APP" v11-artifacts/WaveshareHome-firmware.bin
          for f in src/main.cpp src/smart_hub.cpp src/settings.cpp src/web_server.cpp src/buzzer.cpp src/buzzer_backend.h src/buzzer_backend_es8311.cpp src/button_touch_focaltech.cpp include/smart_home_build.h web/app.js web/app.css boards/ws_lcd_350.ini; do
            mkdir -p "v11-artifacts/source-snapshot/$(dirname "$f")"
            cp "upstream/$f" "v11-artifacts/source-snapshot/$f"
          done
          {
            echo 'BambuHelper ws_lcd_350 Smart Home v11.0 Signature Workshop OS RC1 validation'
            echo 'signature_home_adaptive_hero=PASS'
            echo 'signature_material_rail=PASS'
            echo 'focused_printer_card=PASS'
            echo 'services_rail=PASS'
            echo 'event_sounds_control=PASS'
            echo 'ws350_event_sounds_default_on=PASS'
            echo 'speaker_self_test=PRESERVED'
            echo 'microphone_echo=PRESERVED'
            echo 'materials_first_workshop=PRESERVED'
            echo 'printer_configuration_screen_retention=PRESERVED'
            echo 'ft6336_reliability=PRESERVED'
            echo 'browser_signature_css=PASS'
            echo 'ws350_build=PASS'
            echo 'jc3248w535_regression=PASS'
            echo 'physical_acceptance=REQUIRED'
            sha256sum v11-artifacts/*.bin
          } | tee v11-artifacts/validation-report-v11-signature-workshop-os-rc1.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bambuhelper-ws_lcd_350-smart-home-v11-signature-workshop-os-rc1
          retention-days: 14
          if-no-files-found: error
          path: v11-artifacts/
