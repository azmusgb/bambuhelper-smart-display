name: BambuHelper ws_lcd_350 Smart Home v7.1 UX validation

on:
  push:
    branches: [smart-home-v7-1-ux-validation]
    paths:
      - 'apply_smart_home_ux_v7_1.py'
      - '.github/workflows/bambuhelper-v7-1-ux-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rehydrate v1-v7 patchers
        shell: bash
        run: |
          set -euo pipefail
          v1=https://raw.githubusercontent.com/azmusgb/filamentinventory/741a6f0651fb4e20d8e2674f2c0ce726b0d7bdf9/.bambuhelper-validation
          v3=https://raw.githubusercontent.com/azmusgb/filamentinventory/07ce909fa7dd485abfc556eaf9addfbbd82e3cb3/.bambuhelper-validation
          v6=https://raw.githubusercontent.com/azmusgb/filamentinventory/c1a6cdf389be14b18f26eecefd5c5a62b5d1e7dc/.bambuhelper-validation
          curl -fsSL "$v1/installer.zlib.b64" -o /tmp/installer.b64
          for n in 0 1 2 3; do curl -fsSL "$v1/device.part$n" -o "/tmp/device.part$n"; done
          cat /tmp/device.part{0,1,2,3} >/tmp/device.b64
          curl -fsSL "$v3/v2.zlib.b64" -o /tmp/v2.b64
          curl -fsSL "$v3/v3.zlib.b64" -o /tmp/v3.b64
          curl -fsSL "$v6/v4.zlib.b64" -o /tmp/v4.b64
          curl -fsSL "$v6/v5.zlib.b64" -o /tmp/v5.b64
          curl -fsSL "$v6/v6.zlib.b64" -o /tmp/v6.b64
          python - <<'PY'
          from pathlib import Path
          import base64,zlib
          pairs=[('/tmp/installer.b64','apply_installer_evolution.py'),('/tmp/device.b64','apply_device_onboarding_evolution.py'),('/tmp/v2.b64','apply_resilience_evolution_v2.py'),('/tmp/v3.b64','apply_smart_profiles_evolution_v3.py'),('/tmp/v4.b64','apply_ws350_remote_dashboard_v4.py'),('/tmp/v5.b64','apply_commissioning_evolution_v5.py'),('/tmp/v6.b64','apply_smart_display_platform_v6.py'),('.bambuhelper-validation/v7-home.zlib.b64','apply_smart_home_navigation_v7.py')]
          for src,dst in pairs:
              Path(dst).write_bytes(zlib.decompress(base64.b64decode(Path(src).read_text().strip())))
          PY

      - name: Repair v3 duplicate anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apply_smart_profiles_evolution_v3.py'); text=p.read_text(); needle='"app/profile-account-selection",'; pos=text.find(needle)
          if pos>=0:
              start=text.rfind('    text = replace_once(',0,pos); end=text.find('\n    )',pos)
              if min(start,end)<0: raise SystemExit('v3 repair anchor malformed')
              end+=len('\n    )')
              replacement="""    profile_refresh_anchor = '''  updatePrinterOnboarding();\n  refreshPrinterHealth(false);'''\n    profile_refresh_count = text.count(profile_refresh_anchor)\n    if profile_refresh_count < 1:\n        raise PatchError(\"app/profile-context-refresh: expected at least one v2 refresh anchor\")\n    text = text.replace(profile_refresh_anchor, '''  updatePrinterOnboarding();\n  refreshGaugeProfileUi();\n  refreshPrinterHealth(false);''')"""
              p.write_text(text[:start]+replacement+text[end:])
          PY
          python -m py_compile apply_*.py apply_smart_home_ux_v7_1.py

      - name: Apply v1-v7.1 stack
        shell: bash
        run: |
          set -euo pipefail
          python apply_installer_evolution.py --repo upstream --apply
          python apply_device_onboarding_evolution.py --repo upstream --apply
          python apply_resilience_evolution_v2.py --repo upstream --apply
          python apply_smart_profiles_evolution_v3.py --repo upstream --apply
          python apply_ws350_remote_dashboard_v4.py --repo upstream --apply
          python apply_commissioning_evolution_v5.py --repo upstream --apply
          python apply_smart_display_platform_v6.py --repo upstream --apply
          python apply_smart_home_navigation_v7.py --repo upstream --apply
          python apply_smart_home_ux_v7_1.py --repo upstream --apply

      - name: Static UX checks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'drawHeader("HOME", "Smart Home v7.1", 0)' upstream/src/smart_hub.cpp
          grep -Fq 'drawHeader("WORKSHOP", "Printer + AMS", 1)' upstream/src/smart_hub.cpp
          grep -Fq 'drawProgressTrack' upstream/src/smart_hub.cpp
          grep -Fq 'tr.type' upstream/src/smart_hub.cpp
          grep -Fq 'NOZZLE L' upstream/src/smart_hub.cpp
          grep -Fq 'NOZZLE R' upstream/src/smart_hub.cpp
          grep -Fq 'CHAMBER' upstream/src/smart_hub.cpp
          grep -Fq 'BambuHelper %s · ws_lcd_350' upstream/src/smart_hub.cpp
          grep -Fq 'tft.height() - 18' upstream/src/smart_hub.cpp
          grep -Fq 'smartHubEnterIdleHome' upstream/src/main.cpp
          grep -Fq 'BOARD_IS_WS350=1' upstream/boards/ws_lcd_350.ini
          grep -Fq 'DISPLAY_320x480=1' upstream/boards/ws_lcd_350.ini
          grep -Fq 'USE_FT6336=1' upstream/boards/ws_lcd_350.ini

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build WS350
        working-directory: upstream
        run: pio run -e ws_lcd_350
      - name: Regression build jc3248w535
        working-directory: upstream
        run: pio run -e jc3248w535
      - name: Merge Full image
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full

      - name: Validation report
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' | sort | tail -1)"
          APP=upstream/.pio/build/ws_lcd_350/firmware.bin
          test -f "$FULL"; test -f "$APP"
          {
            echo 'BambuHelper ws_lcd_350 Smart Home v7.1 UX validation'
            echo 'upstream_commit=8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4'
            echo 'layers=v1,v1-device,v2,v3,v4,v5,v6,v7,v7.1-ux'
            echo 'physical_photo_feedback_applied=PASS'
            echo 'workshop_dead_space_reduced=PASS'
            echo 'progress_hierarchy=PASS'
            echo 'ams_material_and_remaining=PASS'
            echo 'dual_nozzle_thermal_cards=PASS'
            echo 'bottom_safe_area=PASS'
            echo 'custom_release_identity=Smart_Home_v7.1'
            echo 'legacy_clock_replacement_preserved=PASS'
            echo 'hub_page_cycle=HOME_WORKSHOP_CUSTOM_SYSTEM_PRINTER_HOME'
            echo 'shared_layout_regression=jc3248w535_passed'
            echo "full_image=$FULL"
            echo 'SHA256:'
            sha256sum "$FULL" "$APP"
          } | tee validation-report-v7.1.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bambuhelper-ws_lcd_350-smart-home-v7-1
          retention-days: 7
          if-no-files-found: error
          path: |
            upstream/.pio/build/ws_lcd_350/firmware.bin
            upstream/firmware/*/BambuHelper-ws_lcd_350-*-Full.bin
            validation-report-v7.1.txt
