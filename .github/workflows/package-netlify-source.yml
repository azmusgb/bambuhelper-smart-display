name: Package Netlify source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-netlify-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production build
        run: |
          set -euo pipefail
          node --check app.js
          python3 build.py
      - name: Package source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p netlify-source/firmware
          cp index.html styles.css app.js release.json netlify.toml build.py README.md netlify-source/
          cp firmware/*.bin netlify-source/firmware/
          cp validation-report-v7.1.txt netlify-source/
          cd netlify-source
          test -f firmware/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-home-v7.1-validated.bin
          test -f firmware/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v7.1-OTA.bin
      - name: Upload Netlify source artifact
        uses: actions/upload-artifact@v4
        with:
          name: netlify-source-v7.1
          retention-days: 2
          if-no-files-found: error
          path: netlify-source/
