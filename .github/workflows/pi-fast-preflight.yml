name: Workshop Pi Fast Preflight

on:
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Also run the full exact-head OS12 reconstruction/build on the Pi'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: workshop-pi-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Pi fast preflight
    runs-on: [self-hosted, linux, ARM64, workshop-pi]
    timeout-minutes: 30
    env:
      OS12_RELEASE_VERSION: '12.8.0'
      OS12_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_NAME"
          uname -a
          python3 --version
          g++ --version | head -1
          echo "Source SHA: $OS12_SOURCE_SHA"

      - name: Validate fast Python contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/validate_os12_premium_ui_v2.py \
            scripts/validate_os12_touch_audio_fit.py \
            scripts/validate_os12_glance_legibility.py \
            scripts/test_x2d_bridge_camera.py
          python3 scripts/validate_os12_premium_ui_v2.py --repo .
          git diff --check HEAD^

      - name: Build and run tabs layout smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workshop-preflight"
          g++ \
            -std=c++11 \
            -O1 \
            -Wall \
            -Wextra \
            -Werror \
            -pedantic \
            tests/workshop_os12_tabs_layout_smoke.cpp \
            -o "$RUNNER_TEMP/workshop-preflight/tabs-layout-smoke"
          "$RUNNER_TEMP/workshop-preflight/tabs-layout-smoke"

      - name: Build and run More layout smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workshop-preflight"
          g++ \
            -std=c++11 \
            -O1 \
            -Wall \
            -Wextra \
            -Werror \
            -pedantic \
            tests/workshop_os12_more_layout_smoke.cpp \
            -o "$RUNNER_TEMP/workshop-preflight/more-layout-smoke"
          "$RUNNER_TEMP/workshop-preflight/more-layout-smoke"

      - name: Run X2D bridge unit tests
        run: python3 scripts/test_x2d_bridge_camera.py

      - name: Optional full exact-head OS12 build
        if: ${{ inputs.full_build }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/ws350-os12-pi-${OS12_SOURCE_SHA:0:7}"
          BUILD="$BUILD" \
          OS12_SOURCE_SHA="$OS12_SOURCE_SHA" \
            bash scripts/run_os12_ux_local.sh --build

      - name: Record preflight result
        if: always()
        shell: bash
        run: |
          echo 'Pi preflight is an accelerator only.'
          echo 'It does not replace the GitHub-hosted UX Architecture exact-head candidate authority.'
          echo 'No physical acceptance or stable promotion is established here.'
