name: Workshop OS v11.15 — Audio Essentials RC1

on:
  pull_request:
    branches: [evolve/v11-14-network-essentials]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v11-15-audio-essentials-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        name: Checkout evolution repository
      - name: Checkout pinned BambuHelper baseline
        uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate patch tooling
        run: |
          python -m py_compile \
            apply_smart_home_hardware_v10_1.py \
            apply_smart_home_ui_v10_2.py \
            apply_smart_home_browser_v10_3.py \
            apply_smart_home_screen_retention_v10_3_1.py \
            apply_smart_home_portal_v10_4.py \
            apply_smart_home_home_v10_4_1.py \
            apply_smart_home_physical_v10_5.py \
            apply_smart_home_audio_home_v10_6.py \
            apply_smart_home_signature_v11.py \
            apply_smart_home_calm_v11_1.py \
            apply_smart_home_workshop_tools_v11_2.py \
            apply_smart_home_printer_control_v11_3.py \
            apply_smart_home_printer_control_v11_3_fixup.py \
            apply_smart_home_control_polish_v11_4.py \
            apply_smart_home_printer_power_v11_5.py \
            apply_smart_home_workshop_command_v11_6.py \
            apply_smart_home_live_state_v11_7.py \
            apply_smart_home_display_experience_v11_8.py \
            apply_smart_home_display_schedule_v11_9.py \
            apply_smart_home_display_behavior_v11_10.py \
            apply_smart_home_display_visual_v11_11.py \
            apply_smart_home_clock_experience_v11_12.py \
            apply_smart_home_alerts_hms_v11_13.py \
            apply_smart_home_network_essentials_v11_14.py \
            apply_smart_home_audio_essentials_v11_15.py

      - name: Apply Smart Home stack through v10.1
        run: bash scripts/apply_smart_home_stack.sh upstream apply_smart_home_hardware_v10_1.py
      - run: python apply_smart_home_ui_v10_2.py --repo upstream --apply
        name: Apply v10.2
      - run: python apply_smart_home_browser_v10_3.py --repo upstream --apply
        name: Apply v10.3
      - run: python apply_smart_home_screen_retention_v10_3_1.py --repo upstream --apply
        name: Apply v10.3.1
      - run: python apply_smart_home_portal_v10_4.py --repo upstream --apply
        name: Apply v10.4
      - run: python apply_smart_home_home_v10_4_1.py --repo upstream --apply
        name: Apply v10.4.1
      - run: python apply_smart_home_physical_v10_5.py --repo upstream --apply
        name: Apply v10.5
      - run: python apply_smart_home_audio_home_v10_6.py --repo upstream --apply
        name: Apply v10.6
      - run: python apply_smart_home_signature_v11.py --repo upstream --apply
        name: Apply v11
      - run: python apply_smart_home_calm_v11_1.py --repo upstream --apply
        name: Apply v11.1
      - run: python apply_smart_home_workshop_tools_v11_2.py --repo upstream --apply
        name: Apply v11.2
      - run: python apply_smart_home_printer_control_v11_3.py --repo upstream --apply
        name: Apply v11.3 Printer Control
      - run: python apply_smart_home_printer_control_v11_3_fixup.py --repo upstream --apply
        name: Apply v11.3 browser serialization fixup
      - run: python apply_smart_home_control_polish_v11_4.py --repo upstream --apply
        name: Apply v11.4 Control Polish
      - run: python apply_smart_home_printer_power_v11_5.py --repo upstream --apply
        name: Apply v11.5 Printer Power
      - run: python apply_smart_home_workshop_command_v11_6.py --repo upstream --apply
        name: Apply v11.6 Workshop Command Center
      - run: python apply_smart_home_live_state_v11_7.py --repo upstream --apply
        name: Apply v11.7 Live State Integrity
      - run: python apply_smart_home_display_experience_v11_8.py --repo upstream --apply
        name: Apply v11.8 Display & Experience
      - run: python apply_smart_home_display_schedule_v11_9.py --repo upstream --apply
        name: Apply v11.9 Display Schedule & Finish
      - run: python apply_smart_home_display_behavior_v11_10.py --repo upstream --apply
        name: Apply v11.10 Display Behavior
      - run: python apply_smart_home_display_visual_v11_11.py --repo upstream --apply
        name: Apply v11.11 Display Visual
      - run: python apply_smart_home_clock_experience_v11_12.py --repo upstream --apply
        name: Apply v11.12 Clock Experience
      - run: python apply_smart_home_alerts_hms_v11_13.py --repo upstream --apply
        name: Apply v11.13 Alerts & HMS
      - run: python apply_smart_home_network_essentials_v11_14.py --repo upstream --apply
        name: Apply v11.14 Network Essentials
      - run: python apply_smart_home_audio_essentials_v11_15.py --repo upstream --apply
        name: Apply v11.15 Audio Essentials

      - name: Validate inherited device contracts
        run: python scripts/validate_device_contracts.py
      - name: Verify v11.15 audio contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          build=Path('upstream/include/smart_home_build.h').read_text()
          hub=Path('upstream/src/smart_hub.cpp').read_text()
          app=Path('upstream/web/app.js').read_text()
          def need(body,n,label):
              if n not in body: raise SystemExit(f'MISSING {label}: {n}')
          for n in ['#define SMART_HOME_VERSION "v11.15"','#define SMART_HOME_PROFILE "audio-essentials"','Smart Home v11.15 Audio Essentials RC1']:
              need(build,n,'identity')
          for n in ['g_audioSettingsView','g_audioSettingsPage','drawAudioSettings','hubSystemAudioSettingsEntryRect','EVENT SOUNDS','BUTTON CLICKS','QUIET START','QUIET END','BED COOLDOWN','BED THRESHOLD','SPEAKER TEST','MIC ECHO','buzzerSettings.buttonClick=!buzzerSettings.buttonClick','buzzerSettings.bedCooldownAlert=!buzzerSettings.bedCooldownAlert','hubStepCooldownThreshold']:
              need(hub,n,'audio essentials')
          for n in ['drawNetworkEssentials','STARTUP IP','DATE FORMAT']:
              need(hub,n,'v11.14 network essentials')
          for n in ['v117StateFresh','V117_STALE_MS=10000']:
              need(app,n,'v11.7 live-state integrity')
          print('v11.15 Audio Essentials contracts: PASS')
          PY
      - name: Validate browser JavaScript
        run: node --check upstream/web/app.js
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build WS350 v11.15
        working-directory: upstream
        run: pio run -e ws_lcd_350
      - name: Regression build shared 320x480 target
        working-directory: upstream
        run: pio run -e jc3248w535
      - name: Merge Full image
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full
      - name: Package v11.15 artifacts
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' | sort | tail -1)"
          APP='upstream/.pio/build/ws_lcd_350/firmware.bin'
          mkdir -p v11-15-artifacts/source-snapshot
          cp "$FULL" v11-15-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v11.15-Audio-Essentials-RC1-Full.bin
          cp "$APP" v11-15-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v11.15-Audio-Essentials-RC1-OTA.bin
          cp "$APP" v11-15-artifacts/WaveshareHome-firmware.bin
          for f in include/web_pages.h include/smart_home_build.h web/app.js web/app.css src/web_server.cpp src/bambu_mqtt.cpp src/smart_hub.cpp src/settings.cpp src/display_ui.h; do
            mkdir -p "v11-15-artifacts/source-snapshot/$(dirname "$f")"
            cp "upstream/$f" "v11-15-artifacts/source-snapshot/$f"
          done
          {
            echo 'BambuHelper ws_lcd_350 Smart Home v11.15 Audio Essentials RC1 validation'
            echo 'system_audio_entry=PASS'
            echo 'event_sounds_toggle=PASS_BUILD'
            echo 'button_click_toggle=PASS_BUILD'
            echo 'quiet_hours=PASS_BUILD'
            echo 'bed_cooldown_alert=PASS_BUILD'
            echo 'bed_threshold=PASS_BUILD'
            echo 'speaker_test=PRESERVED_AND_EXPOSED'
            echo 'mic_echo=PRESERVED_AND_EXPOSED'
            echo 'network_essentials=PRESERVED'
            echo 'ws350_build=PASS'
            echo 'jc3248w535_regression=PASS'
            echo 'physical_acceptance=REQUIRED'
            sha256sum v11-15-artifacts/*.bin
          } | tee v11-15-artifacts/validation-report-v11-15-audio-essentials-rc1.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bambuhelper-ws_lcd_350-smart-home-v11-15-audio-essentials-rc1
          retention-days: 14
          if-no-files-found: error
          path: v11-15-artifacts/
