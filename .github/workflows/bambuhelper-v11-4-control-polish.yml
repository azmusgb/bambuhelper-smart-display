name: BambuHelper ws_lcd_350 Smart Home v11.4 Control Polish RC1

on:
  push:
    branches: [evolve/v11-4-control-polish]
    paths:
      - 'apply_smart_home_control_polish_v11_4.py'
      - '.github/workflows/bambuhelper-v11-4-control-polish.yml'
  pull_request:
    branches: [evolve/v11-3-printer-control]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-home-v11-4-control-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout evolution repository
        uses: actions/checkout@v4

      - name: Checkout pinned BambuHelper baseline
        uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate patch tooling
        run: |
          python -m py_compile \
            apply_smart_home_hardware_v10_1.py \
            apply_smart_home_ui_v10_2.py \
            apply_smart_home_browser_v10_3.py \
            apply_smart_home_screen_retention_v10_3_1.py \
            apply_smart_home_portal_v10_4.py \
            apply_smart_home_home_v10_4_1.py \
            apply_smart_home_physical_v10_5.py \
            apply_smart_home_audio_home_v10_6.py \
            apply_smart_home_signature_v11.py \
            apply_smart_home_calm_v11_1.py \
            apply_smart_home_workshop_tools_v11_2.py \
            apply_smart_home_printer_control_v11_3.py \
            apply_smart_home_printer_control_v11_3_fixup.py \
            apply_smart_home_control_polish_v11_4.py
          bash -n scripts/apply_smart_home_stack.sh

      - name: Apply Smart Home stack through v10.1
        run: bash scripts/apply_smart_home_stack.sh upstream apply_smart_home_hardware_v10_1.py
      - name: Apply v10.2
        run: python apply_smart_home_ui_v10_2.py --repo upstream --apply
      - name: Apply v10.3
        run: python apply_smart_home_browser_v10_3.py --repo upstream --apply
      - name: Apply v10.3.1
        run: python apply_smart_home_screen_retention_v10_3_1.py --repo upstream --apply
      - name: Apply v10.4
        run: python apply_smart_home_portal_v10_4.py --repo upstream --apply
      - name: Apply v10.4.1
        run: python apply_smart_home_home_v10_4_1.py --repo upstream --apply
      - name: Apply v10.5
        run: python apply_smart_home_physical_v10_5.py --repo upstream --apply
      - name: Apply v10.6
        run: python apply_smart_home_audio_home_v10_6.py --repo upstream --apply
      - name: Apply v11
        run: python apply_smart_home_signature_v11.py --repo upstream --apply
      - name: Apply v11.1
        run: python apply_smart_home_calm_v11_1.py --repo upstream --apply
      - name: Apply v11.2
        run: python apply_smart_home_workshop_tools_v11_2.py --repo upstream --apply
      - name: Apply v11.3 Printer Control
        run: python apply_smart_home_printer_control_v11_3.py --repo upstream --apply
      - name: Apply v11.3 browser serialization fixup
        run: python apply_smart_home_printer_control_v11_3_fixup.py --repo upstream --apply
      - name: Apply v11.4 Control Polish
        run: python apply_smart_home_control_polish_v11_4.py --repo upstream --apply

      - name: Validate inherited device contracts
        run: python scripts/validate_device_contracts.py

      - name: Verify v11.4 control polish contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          hub=Path('upstream/src/smart_hub.cpp').read_text()
          mqtt=Path('upstream/src/bambu_mqtt.cpp').read_text()
          mqtth=Path('upstream/src/bambu_mqtt.h').read_text()
          web=Path('upstream/src/web_server.cpp').read_text()
          app=Path('upstream/web/app.js').read_text()
          css=Path('upstream/web/app.css').read_text()
          build=Path('upstream/include/smart_home_build.h').read_text()
          board=Path('upstream/boards/ws_lcd_350.ini').read_text()
          main=Path('upstream/src/main.cpp').read_text()
          focal=Path('upstream/src/button_touch_focaltech.cpp').read_text()
          backend=Path('upstream/src/buzzer_backend_es8311.cpp').read_text()

          def need(body,n,label):
              if n not in body: raise SystemExit(f'MISSING {label}: {n}')
          def forbid(body,n,label):
              if n in body: raise SystemExit(f'FORBIDDEN {label}: {n}')

          for n in ['#define SMART_HOME_VERSION "v11.4"','#define SMART_HOME_PROFILE "control-polish"','Smart Home v11.4 Control Polish RC1']:
              need(build,n,'v11.4 identity')

          for n in ['DROPPED: MQTT offline','if (!st.connected) return false','PRINTER_CTRL_PAUSE && (!active || paused)','PRINTER_CTRL_RESUME && !paused','PRINTER_CTRL_STOP && !active']:
              need(mqtt,n,'fail-closed command safety')
          forbid(mqtt,'leave the request queued','delayed printer command delivery')

          for n in ['g_printerFeedbackButton','LIGHT SENT','PAUSE SENT','RESUME SENT','STOP SENT','HOLD TO STOP','printerFeedbackLabel']:
              need(hub,n,'physical command feedback')
          for n in ['const bool disabled = accent == UI_DIM','const uint16_t textColor = disabled ? UI_DIM','s.connected?UI_AMBER:UI_DIM']:
              need(hub,n,'physical disabled-state rendering')
          need(hub,'if(s.connected){requestLightCommand(rotState.displayIndex','Workshop light offline guard')

          need(web,'if (!printers[slot].state.connected)','manual light offline guard')
          for n in ['v114ControlBusy','v114ControlBusy(true)','v114ControlBusy(false)']:
              need(app,n,'browser in-flight control lock')
          for n in ['Smart Home v11.4 Control Polish','button:disabled','focus-visible']:
              need(css,n,'browser control polish')

          for n in ['PRINTER_CTRL_PAUSE','PRINTER_CTRL_RESUME','PRINTER_CTRL_STOP','requestPrinterControlCommand']:
              need(mqtth,n,'v11.3 printer command API')
          for n in ['handlePrinterControl','/printer/control','stop confirmation required']:
              need(web,n,'v11.3 guarded web control')
          for n in ['g_timerPresets[4]','drawTools','TIMER COMPLETE','drawAmbientHome']:
              need(hub,n,'v11.2/v11.1 experience')
          for n in ['SPEAKER','MIC ECHO','EVENTS ON','EVENTS OFF']:
              need(hub,n,'Audio Lab')
          for n in ['buzzerBackendMicEcho','MALLOC_CAP_SPIRAM']:
              need(backend,n,'mic echo backend')
          for n in ['BOARD_HAS_ES8311_AUDIO=1','BOARD_HAS_MICROPHONE=1','AUDIO_I2S_DIN=14']:
              need(board,n,'WS350 audio hardware')
          need(main,'if (!smartHubShouldYieldToPrinter(printing))','screen retention')
          need(web,'recoverySha256HexArrayBuffer','Safari-safe recovery')
          need(focal,'ft6336RecoverBus','FT6336 recovery')
          print('v11.4 Control Polish contracts: PASS')
          PY

      - name: Validate browser JavaScript
        run: node --check upstream/web/app.js

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build WS350 v11.4
        working-directory: upstream
        run: pio run -e ws_lcd_350

      - name: Regression build shared 320x480 target
        working-directory: upstream
        run: pio run -e jc3248w535

      - name: Merge Full image
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full

      - name: Package v11.4 Control Polish RC1 artifacts
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' | sort | tail -1)"
          APP='upstream/.pio/build/ws_lcd_350/firmware.bin'
          mkdir -p v11-4-artifacts/source-snapshot
          cp "$FULL" v11-4-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v11.4-Control-Polish-RC1-Full.bin
          cp "$APP" v11-4-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v11.4-Control-Polish-RC1-OTA.bin
          cp "$APP" v11-4-artifacts/WaveshareHome-firmware.bin
          for f in src/main.cpp src/smart_hub.cpp src/settings.cpp src/web_server.cpp src/bambu_mqtt.cpp src/bambu_mqtt.h src/buzzer.cpp src/buzzer_backend.h src/buzzer_backend_es8311.cpp src/button_touch_focaltech.cpp include/smart_home_build.h web/app.js web/app.css boards/ws_lcd_350.ini; do
            mkdir -p "v11-4-artifacts/source-snapshot/$(dirname "$f")"
            cp "upstream/$f" "v11-4-artifacts/source-snapshot/$f"
          done
          {
            echo 'BambuHelper ws_lcd_350 Smart Home v11.4 Control Polish RC1 validation'
            echo 'fail_closed_printer_commands=PASS'
            echo 'centralized_state_validation=PASS'
            echo 'physical_command_feedback=PASS'
            echo 'disabled_control_rendering=PASS'
            echo 'offline_light_guard=PASS'
            echo 'browser_inflight_lock=PASS'
            echo 'v11_3_printer_controls=PRESERVED'
            echo 'v11_2_workshop_tools=PRESERVED'
            echo 'speaker_self_test=PRESERVED'
            echo 'microphone_echo=PRESERVED'
            echo 'printer_screen_retention=PRESERVED'
            echo 'ft6336_reliability=PRESERVED'
            echo 'ws350_build=PASS'
            echo 'jc3248w535_regression=PASS'
            echo 'physical_acceptance=REQUIRED'
            sha256sum v11-4-artifacts/*.bin
          } | tee v11-4-artifacts/validation-report-v11-4-control-polish-rc1.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bambuhelper-ws_lcd_350-smart-home-v11-4-control-polish-rc1
          retention-days: 14
          if-no-files-found: error
          path: v11-4-artifacts/
