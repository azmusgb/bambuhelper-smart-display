name: BambuHelper ws_lcd_350 Smart Home v9.7.2 Recovery Safari RC1

on:
  push:
    branches: [fix/recovery-safari-sha256]
    paths:
      - 'apply_smart_home_recovery_safari_v9_7_2.py'
      - '.github/workflows/bambuhelper-v9-7-2-recovery-safari.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apply_smart_home_recovery_safari_v9_7_2.py'
      - '.github/workflows/bambuhelper-v9-7-2-recovery-safari.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-home-v9-7-2-recovery-safari-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout evolution repository
        uses: actions/checkout@v4

      - name: Checkout pinned BambuHelper baseline
        uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rehydrate v1-v7.2 patch stack
        shell: bash
        run: |
          set -euo pipefail
          v1=https://raw.githubusercontent.com/azmusgb/filamentinventory/741a6f0651fb4e20d8e2674f2c0ce726b0d7bdf9/.bambuhelper-validation
          v3=https://raw.githubusercontent.com/azmusgb/filamentinventory/07ce909fa7dd485abfc556eaf9addfbbd82e3cb3/.bambuhelper-validation
          v6=https://raw.githubusercontent.com/azmusgb/filamentinventory/c1a6cdf389be14b18f26eecefd5c5a62b5d1e7dc/.bambuhelper-validation
          v72=https://raw.githubusercontent.com/azmusgb/bambuhelper-smart-display/smart-home-v7-2-display-stability
          curl -fsSL "$v1/installer.zlib.b64" -o /tmp/installer.b64
          for n in 0 1 2 3; do curl -fsSL "$v1/device.part$n" -o "/tmp/device.part$n"; done
          cat /tmp/device.part{0,1,2,3} > /tmp/device.b64
          curl -fsSL "$v3/v2.zlib.b64" -o /tmp/v2.b64
          curl -fsSL "$v3/v3.zlib.b64" -o /tmp/v3.b64
          curl -fsSL "$v6/v4.zlib.b64" -o /tmp/v4.b64
          curl -fsSL "$v6/v5.zlib.b64" -o /tmp/v5.b64
          curl -fsSL "$v6/v6.zlib.b64" -o /tmp/v6.b64
          curl -fsSL "$v72/.bambuhelper-validation/v7-home.zlib.b64" -o /tmp/v7-home.b64
          curl -fsSL "$v72/apply_smart_home_ux_v7_1.py" -o apply_smart_home_ux_v7_1.py
          curl -fsSL "$v72/apply_smart_home_display_stability_v7_2.py" -o apply_smart_home_display_stability_v7_2.py
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          pairs=[
            ('/tmp/installer.b64','apply_installer_evolution.py'),('/tmp/device.b64','apply_device_onboarding_evolution.py'),
            ('/tmp/v2.b64','apply_resilience_evolution_v2.py'),('/tmp/v3.b64','apply_smart_profiles_evolution_v3.py'),
            ('/tmp/v4.b64','apply_ws350_remote_dashboard_v4.py'),('/tmp/v5.b64','apply_commissioning_evolution_v5.py'),
            ('/tmp/v6.b64','apply_smart_display_platform_v6.py'),('/tmp/v7-home.b64','apply_smart_home_navigation_v7.py')]
          for src,dst in pairs:
              Path(dst).write_bytes(zlib.decompress(base64.b64decode(Path(src).read_text().strip())))
          PY

      - name: Repair historical v3 patcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apply_smart_profiles_evolution_v3.py')
          text=p.read_text()
          needle='"app/profile-account-selection",'
          pos=text.find(needle)
          if pos>=0:
              start=text.rfind('    text = replace_once(',0,pos)
              end=text.find('\n    )',pos)
              if min(start,end)<0: raise SystemExit('v3 repair anchor malformed')
              end += len('\n    )')
              replacement="""    profile_refresh_anchor = '''  updatePrinterOnboarding();\n  refreshPrinterHealth(false);'''\n    profile_refresh_count = text.count(profile_refresh_anchor)\n    if profile_refresh_count < 1:\n        raise PatchError(\"app/profile-context-refresh: expected at least one v2 refresh anchor\")\n    text = text.replace(profile_refresh_anchor, '''  updatePrinterOnboarding();\n  refreshGaugeProfileUi();\n  refreshPrinterHealth(false);''')"""
              p.write_text(text[:start]+replacement+text[end:])
          PY
          python -m py_compile apply_*.py scripts/validate_device_contracts.py

      - name: Apply complete v9.7.2 stack
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            apply_installer_evolution.py \
            apply_device_onboarding_evolution.py \
            apply_resilience_evolution_v2.py \
            apply_smart_profiles_evolution_v3.py \
            apply_ws350_remote_dashboard_v4.py \
            apply_commissioning_evolution_v5.py \
            apply_smart_display_platform_v6.py \
            apply_smart_home_navigation_v7.py \
            apply_smart_home_ux_v7_1.py \
            apply_smart_home_display_stability_v7_2.py \
            apply_smart_home_hardening_v8.py \
            apply_smart_home_hardening_v8_1.py \
            apply_smart_home_visual_v9.py \
            apply_smart_home_print_ui_v9.py \
            apply_smart_home_reliability_v9_1.py \
            apply_smart_home_evolution_v9_2.py \
            apply_smart_home_dev_unlock_v9_3.py \
            apply_smart_home_recovery_v9_4.py \
            apply_smart_home_recovery_hardening_v9_4_1.py \
            apply_smart_home_recovery_entry_v9_4_2.py \
            apply_smart_home_experience_v9_5.py \
            apply_smart_home_portal_v9_6.py \
            apply_smart_home_zero_blip_v9_6_1.py \
            apply_smart_home_interaction_v9_7.py \
            apply_smart_home_interaction_v9_7_fixup.py \
            apply_smart_home_touch_reliability_v9_7_1.py \
            apply_smart_home_recovery_safari_v9_7_2.py; do
              python "$p" --repo upstream --apply
          done

      - name: Validate inherited OTA and printer contracts
        run: python scripts/validate_device_contracts.py

      - name: Verify Safari-safe recovery and touch contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          web=Path('upstream/src/web_server.cpp').read_text()
          build=Path('upstream/include/smart_home_build.h').read_text()
          focal=Path('upstream/src/button_touch_focaltech.cpp').read_text()
          start=web.index('static void handleRecoveryPage()')
          end=web.index('static void handleRecoveryStatus()')
          recovery=web[start:end]
          def need(body,n,label):
              if n not in body: raise SystemExit(f'MISSING {label}: {n}')
          def forbid(body,n,label):
              if n in body: raise SystemExit(f'FORBIDDEN {label}: {n}')
          need(recovery,'recoverySha256HexArrayBuffer','plain HTTP SHA-256 helper')
          need(recovery,'Hashing failed:','recovery hashing error handling')
          need(recovery,"X-SHA256",'recovery integrity header')
          forbid(recovery,'crypto.subtle','WebCrypto in plain HTTP recovery page')
          need(focal,'TouchEvent::Pressed','v9.7.1 touch edge reliability')
          need(focal,'ft6336RecoverBus','FT6336 self recovery')
          need(build,'#define SMART_HOME_VERSION "v9.7.2"','v9.7.2 version')
          need(build,'Smart Home v9.7.2 Recovery Safari RC1','v9.7.2 build label')
          print('v9.7.2 Safari-safe recovery + touch reliability contracts: PASS')
          PY

      - name: Validate browser JavaScript
        run: node --check upstream/web/app.js

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build WS350
        working-directory: upstream
        run: pio run -e ws_lcd_350

      - name: Regression build shared 320x480 target
        working-directory: upstream
        run: pio run -e jc3248w535

      - name: Merge Full image
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full

      - name: Package v9.7.2 Recovery Safari RC1 artifacts
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' | sort | tail -1)"
          APP='upstream/.pio/build/ws_lcd_350/firmware.bin'
          mkdir -p v9.7.2-artifacts/source-snapshot
          cp "$FULL" v9.7.2-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v9.7.2-Recovery-Safari-RC1-Full.bin
          cp "$APP" v9.7.2-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v9.7.2-Recovery-Safari-RC1-OTA.bin
          cp "$APP" v9.7.2-artifacts/WaveshareHome-firmware.bin
          cp upstream/src/web_server.cpp v9.7.2-artifacts/source-snapshot/web_server.cpp
          cp upstream/src/button_touch_focaltech.cpp v9.7.2-artifacts/source-snapshot/button_touch_focaltech.cpp
          cp upstream/include/smart_home_build.h v9.7.2-artifacts/source-snapshot/smart_home_build.h
          {
            echo 'BambuHelper ws_lcd_350 Smart Home v9.7.2 Recovery Safari RC1 validation'
            echo 'safari_plain_http_recovery_sha256=PASS'
            echo 'crypto_subtle_recovery=FORBIDDEN'
            echo 'v9.7.1_touch_reliability=PRESERVED'
            echo 'ws350_build=PASS'
            echo 'jc3248w535_regression=PASS'
            echo 'physical_acceptance=REQUIRED'
            sha256sum v9.7.2-artifacts/*.bin
          } | tee v9.7.2-artifacts/validation-report-v9.7.2-recovery-safari-rc1.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bambuhelper-ws_lcd_350-smart-home-v9.7.2-recovery-safari-rc1
          retention-days: 14
          if-no-files-found: error
          path: v9.7.2-artifacts/
