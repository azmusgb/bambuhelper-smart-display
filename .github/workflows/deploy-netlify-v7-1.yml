name: Deploy Smart Home v7.1 to Netlify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-netlify-v7-1.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate source before deployment
        run: |
          set -euo pipefail
          node --check app.js
          python3 build.py
      - name: Deploy existing Netlify project
        run: |
          set -euo pipefail
