name: Import previously validated Smart Display firmware

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-validated-firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-validated-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download preserved v6 validation artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-18cc-81f5-8a37-04b1625dbaf3/raw?se=2026-08-30T04%3A27%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=8aaa8a81-9f1b-5dd9-9fb6-94eba412f348&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-29T19%3A48%3A33Z&ske=2026-08-30T19%3A48%3A33Z&sks=b&skv=2026-02-06&sig=Gz/MDevGOWGTmqCZASCPV6VCJVwbtb2PwkjaoyL9I%2BE%3D' -o /tmp/v6.zip
          mkdir -p /tmp/v6
          unzip -q /tmp/v6.zip -d /tmp/v6
          FULL=/tmp/v6/upstream/firmware/v3.8.1/BambuHelper-ws_lcd_350-v3.8.1-Full.bin
          test -f "$FULL"
          test "$(stat -c%s "$FULL")" = '2207040'
          echo '82265502dac6b93356ee2ab3d7c4edcaad47bdd7584be85d24ddef348166d5ac  '"$FULL" | sha256sum -c -
          mkdir -p firmware
          cp "$FULL" firmware/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-display-v6-validated.bin
          cp /tmp/v6/validation-report-v6.txt validation-report-v6-original.txt

      - name: Verify production installer against preserved firmware
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          python3 build.py
          test -f dist/firmware/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-display-v6-validated.bin
          echo '82265502dac6b93356ee2ab3d7c4edcaad47bdd7584be85d24ddef348166d5ac  dist/firmware/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-display-v6-validated.bin' | sha256sum -c -

      - name: Commit preserved validated firmware
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-display-v6-validated.bin validation-report-v6-original.txt
          if git diff --cached --quiet; then
            echo 'Validated firmware already present.'
          else
            git commit -m 'Add preserved validated Smart Display v6 firmware'
            git push origin HEAD:main
          fi
