name: BambuHelper ws_lcd_350 Smart Home v11.5 Printer Power RC1

on:
  push:
    branches: [evolve/v11-5-printer-power]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-home-v11-5-printer-power-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout evolution repository
        uses: actions/checkout@v4

      - name: Checkout pinned BambuHelper baseline
        uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate patch tooling
        run: |
          python -m py_compile \
            apply_smart_home_hardware_v10_1.py \
            apply_smart_home_ui_v10_2.py \
            apply_smart_home_browser_v10_3.py \
            apply_smart_home_screen_retention_v10_3_1.py \
            apply_smart_home_portal_v10_4.py \
            apply_smart_home_home_v10_4_1.py \
            apply_smart_home_physical_v10_5.py \
            apply_smart_home_audio_home_v10_6.py \
            apply_smart_home_signature_v11.py \
            apply_smart_home_calm_v11_1.py \
            apply_smart_home_workshop_tools_v11_2.py \
            apply_smart_home_printer_control_v11_3.py \
            apply_smart_home_printer_control_v11_3_fixup.py \
            apply_smart_home_control_polish_v11_4.py \
            apply_smart_home_printer_power_v11_5.py
          bash -n scripts/apply_smart_home_stack.sh

      - name: Apply Smart Home stack through v10.1
        run: bash scripts/apply_smart_home_stack.sh upstream apply_smart_home_hardware_v10_1.py
      - name: Apply v10.2
        run: python apply_smart_home_ui_v10_2.py --repo upstream --apply
      - name: Apply v10.3
        run: python apply_smart_home_browser_v10_3.py --repo upstream --apply
      - name: Apply v10.3.1
        run: python apply_smart_home_screen_retention_v10_3_1.py --repo upstream --apply
      - name: Apply v10.4
        run: python apply_smart_home_portal_v10_4.py --repo upstream --apply
      - name: Apply v10.4.1
        run: python apply_smart_home_home_v10_4_1.py --repo upstream --apply
      - name: Apply v10.5
        run: python apply_smart_home_physical_v10_5.py --repo upstream --apply
      - name: Apply v10.6
        run: python apply_smart_home_audio_home_v10_6.py --repo upstream --apply
      - name: Apply v11
        run: python apply_smart_home_signature_v11.py --repo upstream --apply
      - name: Apply v11.1
        run: python apply_smart_home_calm_v11_1.py --repo upstream --apply
      - name: Apply v11.2
        run: python apply_smart_home_workshop_tools_v11_2.py --repo upstream --apply
      - name: Apply v11.3 Printer Control
        run: python apply_smart_home_printer_control_v11_3.py --repo upstream --apply
      - name: Apply v11.3 browser serialization fixup
        run: python apply_smart_home_printer_control_v11_3_fixup.py --repo upstream --apply
      - name: Apply v11.4 Control Polish
        run: python apply_smart_home_control_polish_v11_4.py --repo upstream --apply
      - name: Apply v11.5 Printer Power
        run: python apply_smart_home_printer_power_v11_5.py --repo upstream --apply

      - name: Validate inherited device contracts
        run: python scripts/validate_device_contracts.py

      - name: Verify v11.5 printer-power contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          hub=Path('upstream/src/smart_hub.cpp').read_text()
          main=Path('upstream/src/main.cpp').read_text()
          dh=Path('upstream/src/display_ui.h').read_text()
          web=Path('upstream/src/web_server.cpp').read_text()
          app=Path('upstream/web/app.js').read_text()
          css=Path('upstream/web/app.css').read_text()
          mqtt=Path('upstream/src/bambu_mqtt.cpp').read_text()
          mqtth=Path('upstream/src/bambu_mqtt.h').read_text()
          build=Path('upstream/include/smart_home_build.h').read_text()
          board=Path('upstream/boards/ws_lcd_350.ini').read_text()
          focal=Path('upstream/src/button_touch_focaltech.cpp').read_text()
          backend=Path('upstream/src/buzzer_backend_es8311.cpp').read_text()

          def need(body,n,label):
              if n not in body: raise SystemExit(f'MISSING {label}: {n}')
          def forbid(body,n,label):
              if n in body: raise SystemExit(f'FORBIDDEN {label}: {n}')

          for n in ['#define SMART_HOME_VERSION "v11.5"','#define SMART_HOME_PROFILE "printer-power"','Smart Home v11.5 Printer Power RC1']:
              need(build,n,'v11.5 identity')

          need(dh,'powerConfirmOpenForSlot','guarded physical power entry')
          for n in ['bool powerConfirmOpenForSlot(uint8_t slot)','tasmotaControlPlugForSlot(slot)','tasmotaSettings[plug].enabled','openPowerConfirm(slot)']:
              need(main,n,'reuse existing power-confirm modal')
          for n in ['#include "tasmota.h"','POWER OFF','POWER ON','POWER ?','NO POWER','powerConfirmOpenForSlot(rotState.displayIndex)','for(uint8_t i=0;i<4;i++)if(hubToolsActionRect(i).contains(x,y))']:
              need(hub,n,'physical Tools power control')

          for n in ['handlePrinterPowerStatus','handlePrinterPower','/printer/power/status','/printer/power','POWER OFF DURING PRINT','power-off confirmation required','tasmotaControlPlugForSlot(slot)','tasmotaSetPower(plug,on)']:
              need(web,n,'printer-scoped web power API')
          for n in ['v115Power','v115RefreshPower','v115PrinterPower','Power not mapped','Power plug offline','POWER OFF DURING PRINT']:
              need(app,n,'browser printer power remote')
          need(css,'Smart Home v11.5 Printer Power','browser power styling')

          for n in ['DROPPED: MQTT offline','if (!st.connected) return false','PRINTER_CTRL_PAUSE && (!active || paused)','PRINTER_CTRL_RESUME && !paused','PRINTER_CTRL_STOP && !active']:
              need(mqtt,n,'v11.4 fail-closed printer commands')
          for n in ['PRINTER_CTRL_PAUSE','PRINTER_CTRL_RESUME','PRINTER_CTRL_STOP','requestPrinterControlCommand']:
              need(mqtth,n,'v11.3 printer controls')
          for n in ['SPEAKER','MIC ECHO','EVENTS ON','EVENTS OFF','drawTools','drawAmbientHome']:
              need(hub,n,'Workshop OS experience')
          for n in ['buzzerBackendMicEcho','MALLOC_CAP_SPIRAM']:
              need(backend,n,'audio/mic backend')
          for n in ['BOARD_HAS_ES8311_AUDIO=1','BOARD_HAS_MICROPHONE=1','AUDIO_I2S_DIN=14']:
              need(board,n,'WS350 hardware')
          need(web,'recoverySha256HexArrayBuffer','Safari-safe recovery')
          need(focal,'ft6336RecoverBus','FT6336 recovery')

          forbid(mqtth,'PRINTER_CTRL_SPEED','unvalidated speed control')
          forbid(mqtth,'PRINTER_CTRL_FAN','unvalidated fan control')
          print('v11.5 Printer Power contracts: PASS')
          PY

      - name: Validate browser JavaScript
        run: node --check upstream/web/app.js

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build WS350 v11.5
        working-directory: upstream
        run: pio run -e ws_lcd_350

      - name: Regression build shared 320x480 target
        working-directory: upstream
        run: pio run -e jc3248w535

      - name: Merge Full image
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full

      - name: Package v11.5 Printer Power RC1 artifacts
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' | sort | tail -1)"
          APP='upstream/.pio/build/ws_lcd_350/firmware.bin'
          mkdir -p v11-5-artifacts/source-snapshot
          cp "$FULL" v11-5-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v11.5-Printer-Power-RC1-Full.bin
          cp "$APP" v11-5-artifacts/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v11.5-Printer-Power-RC1-OTA.bin
          cp "$APP" v11-5-artifacts/WaveshareHome-firmware.bin
          for f in src/main.cpp src/display_ui.h src/smart_hub.cpp src/settings.cpp src/web_server.cpp src/bambu_mqtt.cpp src/bambu_mqtt.h src/buzzer.cpp src/buzzer_backend.h src/buzzer_backend_es8311.cpp src/button_touch_focaltech.cpp include/tasmota.h include/smart_home_build.h web/app.js web/app.css boards/ws_lcd_350.ini; do
            mkdir -p "v11-5-artifacts/source-snapshot/$(dirname "$f")"
            cp "upstream/$f" "v11-5-artifacts/source-snapshot/$f"
          done
          {
            echo 'BambuHelper ws_lcd_350 Smart Home v11.5 Printer Power RC1 validation'
            echo 'physical_printer_power=PASS'
            echo 'existing_hold_confirm_modal=REUSED'
            echo 'printing_poweroff_warning=PASS'
            echo 'printer_scoped_power_mapping=PASS'
            echo 'browser_printer_power=PASS'
            echo 'v11_4_fail_closed_controls=PRESERVED'
            echo 'speed_fan_controls=DEFERRED_UNTIL_PROVEN'
            echo 'speaker_self_test=PRESERVED'
            echo 'microphone_echo=PRESERVED'
            echo 'printer_screen_retention=PRESERVED'
            echo 'ft6336_reliability=PRESERVED'
            echo 'ws350_build=PASS'
            echo 'jc3248w535_regression=PASS'
            echo 'physical_acceptance=REQUIRED'
            sha256sum v11-5-artifacts/*.bin
          } | tee v11-5-artifacts/validation-report-v11-5-printer-power-rc1.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bambuhelper-ws_lcd_350-smart-home-v11-5-printer-power-rc1
          retention-days: 14
          if-no-files-found: error
          path: v11-5-artifacts/
