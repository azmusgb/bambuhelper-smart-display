name: One-time stage accepted v11.19.1 installer binaries

on:
  push:
    branches:
      - maintenance/promote-static-v11-19-1

permissions:
  contents: write

jobs:
  stage-binaries:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify exact accepted artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9910588814/zip" \
            -o /tmp/v1191.zip
          rm -rf /tmp/v1191 && mkdir -p /tmp/v1191
          unzip -q /tmp/v1191.zip -d /tmp/v1191
          FULL=/tmp/v1191/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v11.19.1-Physical-Fit-RC2-Full.bin
          OTA=/tmp/v1191/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v11.19.1-Physical-Fit-RC2-OTA.bin
          test "$(stat -c %s "$FULL")" = 2360944
          test "$(sha256sum "$FULL" | awk '{print $1}')" = f49f695f08966a8c1cf5822e1357d03793a1aac634540d8b3a290d891468343b
          test "$(stat -c %s "$OTA")" = 2295408
          test "$(sha256sum "$OTA" | awk '{print $1}')" = f0fc73b65eb39623b5f8e6f8f7564d844d06021ebcb7887d5fc67a6df9e2073e
          rm -f firmware/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-home-v7.1-validated.bin
          rm -f firmware/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v7.1-OTA.bin
          cp "$FULL" firmware/
          cp "$OTA" firmware/

      - name: Commit only the accepted binary promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/
          git diff --cached --quiet && { echo 'No binary changes to commit'; exit 0; }
          git commit -m "Stage accepted Workshop OS v11.19.1 installer binaries"
          git push origin HEAD:maintenance/promote-static-v11-19-1
