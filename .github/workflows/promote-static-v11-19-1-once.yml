name: One-time complete accepted v11.19.1 installer content

on:
  push:
    branches:
      - maintenance/promote-static-v11-19-1

permissions:
  contents: write

jobs:
  promote-content:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify exact accepted artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9910588814/zip" \
            -o /tmp/v1191.zip
          rm -rf /tmp/v1191 && mkdir -p /tmp/v1191
          unzip -q /tmp/v1191.zip -d /tmp/v1191
          FULL=/tmp/v1191/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v11.19.1-Physical-Fit-RC2-Full.bin
          OTA=/tmp/v1191/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v11.19.1-Physical-Fit-RC2-OTA.bin
          test "$(stat -c %s "$FULL")" = 2360944
          test "$(sha256sum "$FULL" | awk '{print $1}')" = f49f695f08966a8c1cf5822e1357d03793a1aac634540d8b3a290d891468343b
          test "$(stat -c %s "$OTA")" = 2295408
          test "$(sha256sum "$OTA" | awk '{print $1}')" = f0fc73b65eb39623b5f8e6f8f7564d844d06021ebcb7887d5fc67a6df9e2073e
          rm -f firmware/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-home-v7.1-validated.bin
          rm -f firmware/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v7.1-OTA.bin
          cp "$FULL" firmware/
          cp "$OTA" firmware/

      - name: Update static installer content and release policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              p.write_text(s.replace(old, new))

          replace('app.js', "const EXPECTED_RELEASE='production-rc-v7.2'", "const EXPECTED_RELEASE='production-workshop-os-v11.19.1'")
          replace('app.js', "selectedProfile='smart-home-v7.2'", "selectedProfile='workshop-os-v11.19.1'")
          replace('app.js', "$('release-pill').textContent='RC v7.2 · '+d.board.id", "$('release-pill').textContent='Workshop OS v11.19.1 · '+d.board.id")
          replace('app.js', "'release: production-rc-v7.2'", "'release: production-workshop-os-v11.19.1'")

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<span id="release-pill">RC v7.2</span>', '<span id="release-pill">Workshop OS v11.19.1</span>')
          start = '<section class="hero"><div><span class="eyebrow">WAVESHARE 3.5 + X2D</span><h1>Smart Home that behaves like an appliance.</h1><p>'
          end = '</p></div><div class="hero-specs">'
          a = s.index(start) + len(start)
          b = s.index(end, a)
          hero = 'Install the physically accepted <strong>Workshop OS v11.19.1 Physical Fit RC2</strong> on the Waveshare ESP32-S3-Touch-LCD-3.5. This channel includes the complete Workshop OS experience validated on the real WS350. Smart Home v7.2 remains available as the single immediate rollback. The browser hashes the selected Full and OTA images locally before enabling install or download.'
          s = s[:a] + hero + s[b:]
          old_select = '<select id="profile"><option value="smart-home-v7.2">Smart Home v7.2 — recommended · display stability</option><option value="smart-home-v7.1">Smart Home v7.1 — rollback</option><option value="smart-home-v7">Smart Home v7 — older rollback</option><option value="smart-display-v6">Smart Display v6 — legacy rollback</option></select>'
          new_select = '<select id="profile"><option value="workshop-os-v11.19.1">Workshop OS v11.19.1 — recommended · physically accepted</option><option value="smart-home-v7.2">Smart Home v7.2 — rollback</option></select>'
          if old_select not in s:
              raise SystemExit('profile selector contract not found')
          s = s.replace(old_select, new_select)
          s = s.replace('<strong>Smart Home v7.2 OTA</strong>', '<strong>Workshop OS v11.19.1 OTA</strong>')
          s = s.replace('Production RC v7.2 · ws_lcd_350 · source baseline 8cb1cbbb6d3c', 'Workshop OS v11.19.1 static channel · ws_lcd_350 · Smart Home v7.2 rollback')
          p.write_text(s)

          p = Path('scripts/validate_release.py')
          s = p.read_text()
          replacements = {
            'PRODUCTION_FULL = Path("firmware/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-home-v7.2-validated.bin")': 'PRODUCTION_FULL = Path("firmware/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v11.19.1-Physical-Fit-RC2-Full.bin")',
            'PRODUCTION_OTA = Path("firmware/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v7.2-OTA.bin")': 'PRODUCTION_OTA = Path("firmware/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v11.19.1-Physical-Fit-RC2-OTA.bin")',
            'ROLLBACK_FULL = Path("firmware/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-home-v7.1-validated.bin")': 'ROLLBACK_FULL = Path("firmware/BambuHelper-ws_lcd_350-v3.8.1-Full-smart-home-v7.2-validated.bin")',
            'ROLLBACK_OTA = Path("firmware/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v7.1-OTA.bin")': 'ROLLBACK_OTA = Path("firmware/BambuHelper-ws_lcd_350-v3.8.1-Smart-Home-v7.2-OTA.bin")',
            'if set(profiles) != {"smart-home-v7.2", "smart-home-v7.1"}:': 'if set(profiles) != {"workshop-os-v11.19.1", "smart-home-v7.2"}:',
            'fail("release.json must expose exactly production v7.2 and rollback v7.1")': 'fail("release.json must expose exactly production Workshop OS v11.19.1 and rollback v7.2")',
            '("smart-home-v7.2", "file"): PRODUCTION_FULL.as_posix(),': '("workshop-os-v11.19.1", "file"): PRODUCTION_FULL.as_posix(),',
            '("smart-home-v7.2", "otaFile"): PRODUCTION_OTA.as_posix(),': '("workshop-os-v11.19.1", "otaFile"): PRODUCTION_OTA.as_posix(),',
            '("smart-home-v7.1", "file"): ROLLBACK_FULL.as_posix(),': '("smart-home-v7.2", "file"): ROLLBACK_FULL.as_posix(),',
            '("smart-home-v7.1", "otaFile"): ROLLBACK_OTA.as_posix(),': '("smart-home-v7.2", "otaFile"): ROLLBACK_OTA.as_posix(),',
            'if download.get("channel") != "production-rc-v7.2":': 'if download.get("channel") != "production-workshop-os-v11.19.1":',
            'fail("download channel must remain production-rc-v7.2 until separately promoted")': 'fail("download channel must identify promoted Workshop OS v11.19.1")',
            'if str(download.get("rollbackVersion")) != "7.1":': 'if str(download.get("rollbackVersion")) != "7.2":',
            'fail("download rollbackVersion must remain 7.1")': 'fail("download rollbackVersion must identify Smart Home v7.2")',
            'print("Static download channel: v7.2 Full + OTA")': 'print("Static download channel: Workshop OS v11.19.1 Full + OTA")',
            'print("Immediate rollback channel: v7.1 Full + OTA")': 'print("Immediate rollback channel: Smart Home v7.2 Full + OTA")',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'validate_release contract not found: {old}')
              s = s.replace(old, new)
          p.write_text(s)

          replace('README.md', '| `release.json` / Netlify | **Smart Home v7.2** | Integrity-checked static download channel. |', '| `release.json` / Netlify | **Workshop OS v11.19.1 — physically accepted** | Integrity-checked static installer channel. |')
          replace('README.md', '| rollback download | **Smart Home v7.1** | Single immediate rollback retained for recovery safety. |', '| rollback download | **Smart Home v7.2** | Single immediate rollback retained for recovery safety. |')
          replace('README.md', '- `firmware/` — only the accepted v7.2 Full+OTA pair and immediate v7.1 rollback Full+OTA pair.', '- `firmware/` — only the accepted Workshop OS v11.19.1 Full+OTA pair and immediate Smart Home v7.2 rollback Full+OTA pair.')
          PY

          mkdir -p releases/archive
          cat > releases/archive/installer-promotion-v11.19.1.md <<'DOC'
          # Static installer promotion — Workshop OS v11.19.1

          The static installer was explicitly promoted from Smart Home v7.2 to the physically accepted Workshop OS v11.19.1 Physical Fit RC2 artifact pair. Smart Home v7.2 is retained as the single immediate rollback.

          Evidence:
          - accepted firmware commit: `f52641b74ca482514684616dad6a341d6447f0f0`;
          - artifact run: `33799445357`;
          - artifact id: `9910588814`;
          - artifact digest: `sha256:fa800c7afe85972734cbbdf773b129d405abf985b2191e217da206e2ee84119e`;
          - Full: 2,360,944 bytes, SHA-256 `f49f695f08966a8c1cf5822e1357d03793a1aac634540d8b3a290d891468343b`;
          - OTA: 2,295,408 bytes, SHA-256 `f0fc73b65eb39623b5f8e6f8f7564d844d06021ebcb7887d5fc67a6df9e2073e`.

          v11.20 Portal Auth remains merged but physically unaccepted and is therefore not the static distribution image.
          DOC

      - name: Validate generated static installer content
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq "EXPECTED_RELEASE='production-workshop-os-v11.19.1'" app.js
          grep -Fq "selectedProfile='workshop-os-v11.19.1'" app.js
          grep -Fq 'Workshop OS v11.19.1 — recommended' index.html
          grep -Fq 'Smart Home v7.2 — rollback' index.html
          grep -Fq 'Workshop OS v11.19.1 OTA' index.html

      - name: Commit non-workflow promotion content
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/ app.js index.html README.md scripts/validate_release.py release.json build.py releases/current.json releases/archive/installer-promotion-v11.19.1.md
          git diff --cached --quiet && { echo 'No promotion content changes to commit'; exit 0; }
          git commit -m "Promote accepted Workshop OS v11.19.1 static installer content"
          git push origin HEAD:maintenance/promote-static-v11-19-1
